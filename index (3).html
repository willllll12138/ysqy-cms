<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园素材库</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2; --card-bg: #FFFFFF; --ink: #1a1815; --gold: #b8832a;
            --gold-pale: #f7f0e0; --border: rgba(0,0,0,0.06); --radius-lg: 24px;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);font-family:'Noto Sans SC',sans-serif;color:var(--ink);}
        .container{max-width:960px;margin:0 auto;padding:0 24px;}
        .hero{text-align:center;padding:60px 0 40px;}
        .hero-title{font-family:'Noto Serif SC',serif;font-size:2.5rem;}
        .module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
        .module-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:24px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);text-align:center;}
        .module-card:hover{transform:translateY(-3px);}
        .sub-header{display:flex;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border);}
        .angle-bar,.cat-tabs{display:flex;gap:8px;padding:16px 0;}
        .angle-pill,.cat-tab{padding:6px 16px;border-radius:20px;background:var(--card-bg);border:1px solid var(--border);cursor:pointer;font-size:0.8rem;}
        .angle-pill.active,.cat-tab.active{background:var(--ink);color:#fff;}
        .card-grid,.media-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px 0;}
        .copy-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border);}
        .copy-text{font-size:0.9rem;line-height:1.8;white-space:pre-wrap;max-height:10em;overflow:hidden;}
        .copy-text.expanded{max-height:none;}
        .media-card{background:var(--card-bg);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);cursor:pointer;}
        .media-card-image{height:200px;background:#f0ede5;display:flex;align-items:center;justify-content:center;}
        .media-card-image img{width:100%;height:100%;object-fit:cover;}
        .media-card-body{padding:16px;}
        .copy-btn{cursor:pointer;color:#888;font-size:0.8rem;}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 20px;border-radius:20px;font-size:0.8rem;opacity:0;z-index:999;}
        .toast.show{opacity:1;}
        .empty-state{text-align:center;color:#ccc;padding:40px;}
    </style>
</head>
<body>
    <div id="homeView"><div class="container"><header class="hero"><h1 class="hero-title">易饰乾园素材库</h1></header><nav class="module-grid" id="moduleGrid"></nav></div></div>
    <div id="subView" style="display:none;"><div class="container"><div class="sub-header"><button onclick="goHome()">← 返回首页</button><h2 id="subTitle"></h2><input type="text" id="searchInput" placeholder="搜索…" oninput="doSearch()"></div><div class="angle-bar" id="angleBar"></div><div class="cat-tabs" id="catTabs"></div><div class="card-grid" id="cardGrid"></div><div class="media-card-grid" id="mediaCardGrid"></div><div class="empty-state">暂无内容</div></div></div>
    <a href="admin.html" style="position:fixed;bottom:20px;right:20px;width:50px;height:50px;background:var(--ink);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;">⚙</a>
    <div class="toast" id="toast"></div>
    <script>
        (function() {
            const KEY = 'ysqy_data_v3';
            const DEFAULT_MODULES = ['朋友圈','客户见证','课程卖点'];
            const DEFAULT_ANGLES = ['数字冲击','对话还原','情绪唤醒'];
            const DEFAULT_TESTCATS = ['文昌','沙龙','成交'];
            const DEFAULT_COURSECATS = ['核心价值','课程亮点'];

            function cleanModules(arr) {
                if (!Array.isArray(arr)) return DEFAULT_MODULES.slice();
                return arr.filter(m => typeof m === 'string' && m.trim() !== '' && m !== 'undefined' && m !== 'null');
            }

            function loadData() {
                let raw = localStorage.getItem(KEY);
                let data = null;
                try { data = raw ? JSON.parse(raw) : null; } catch(e) {}
                if (!data || !data.modules) {
                    return {
                        modules: DEFAULT_MODULES.slice(),
                        angles: DEFAULT_ANGLES.slice(),
                        testimonialCategories: DEFAULT_TESTCATS.slice(),
                        courseCategories: DEFAULT_COURSECATS.slice(),
                        posts: [],
                        testimonials: [],
                        courses: []
                    };
                }
                // 如果 modules 是对象数组 (新格式)，转换为旧格式
                if (data.modules.length && typeof data.modules[0] === 'object') {
                    const modules = data.modules.filter(m => m && m.id && m.name).map(m => m.name);
                    const angles = [];
                    const testCats = [];
                    const courseCats = [];
                    const posts = [];
                    const testimonials = [];
                    const courses = [];
                    (data.contents || []).forEach(c => {
                        const mod = data.modules.find(m => m.id === c.moduleId);
                        if (!mod) return;
                        if (mod.type === 'moments') {
                            posts.push({id:c.id, module:mod.name, angle:c.angle||'', text:c.text||'', time:c.time||Date.now()});
                            if (c.angle && !angles.includes(c.angle)) angles.push(c.angle);
                        } else if (mod.type === 'testimonial') {
                            testimonials.push({id:c.id, module:mod.name, category:c.category||'', imageUrl:c.imageUrl||'', videoUrl:c.videoUrl||'', title:c.title||'', description:c.description||'', clientName:c.clientName||'', date:c.date||''});
                            if (c.category && !testCats.includes(c.category)) testCats.push(c.category);
                        } else if (mod.type === 'course') {
                            courses.push({id:c.id, module:mod.name, category:c.category||'', imageUrl:c.imageUrl||'', videoUrl:c.videoUrl||'', title:c.title||'', description:c.description||'', date:c.date||''});
                            if (c.category && !courseCats.includes(c.category)) courseCats.push(c.category);
                        }
                    });
                    return {
                        modules: modules.length ? modules : DEFAULT_MODULES.slice(),
                        angles: angles.length ? angles : DEFAULT_ANGLES.slice(),
                        testimonialCategories: testCats.length ? testCats : DEFAULT_TESTCATS.slice(),
                        courseCategories: courseCats.length ? courseCats : DEFAULT_COURSECATS.slice(),
                        posts, testimonials, courses
                    };
                }
                // 旧格式：直接清洗 modules
                data.modules = cleanModules(data.modules);
                if (!data.angles) data.angles = DEFAULT_ANGLES.slice();
                if (!data.testimonialCategories) data.testimonialCategories = DEFAULT_TESTCATS.slice();
                if (!data.courseCategories) data.courseCategories = DEFAULT_COURSECATS.slice();
                data.posts = data.posts || [];
                data.testimonials = data.testimonials || [];
                data.courses = data.courses || [];
                return data;
            }

            let db = loadData();
            localStorage.setItem(KEY, JSON.stringify(db));
            let curModule = null, curAngle = '全部', curCat = '全部', query = '';

            function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
            window.copyText=function(t){navigator.clipboard.writeText(t).then(()=>toast('已复制'));};

            function renderHome(){
                document.getElementById('moduleGrid').innerHTML = db.modules.map(m=>`<div class="module-card" onclick="openModule('${m}')"><h3>${m}</h3></div>`).join('');
            }

            window.openModule=function(m){
                curModule=m; curAngle='全部'; curCat='全部'; query='';
                document.getElementById('homeView').style.display='none';
                document.getElementById('subView').style.display='block';
                document.getElementById('subTitle').textContent=m;
                renderSub();
            };
            window.goHome=function(){document.getElementById('subView').style.display='none';document.getElementById('homeView').style.display='block';};

            function renderSub(){
                document.getElementById('angleBar').style.display='none';
                document.getElementById('catTabs').style.display='none';
                document.getElementById('cardGrid').style.display='none';
                document.getElementById('mediaCardGrid').style.display='none';
                if(curModule==='朋友圈'){
                    document.getElementById('angleBar').style.display='flex';
                    document.getElementById('cardGrid').style.display='grid';
                    document.getElementById('angleBar').innerHTML=['全部',...db.angles].map(a=>`<span class="angle-pill ${curAngle===a?'active':''}" onclick="setAngle('${a}')">${a}</span>`).join('');
                    let filtered=db.posts.filter(p=>p.module==='朋友圈');
                    if(curAngle!=='全部') filtered=filtered.filter(p=>p.angle===curAngle);
                    if(query) filtered=filtered.filter(p=>p.text.includes(query));
                    const grid=document.getElementById('cardGrid');
                    if(!filtered.length){grid.innerHTML='<div class="empty-state">暂无文案</div>';return;}
                    grid.innerHTML=filtered.map(p=>{
                        const clean=p.text.split('\n').map(l=>l.trim()).join('\n');
                        const truncated=clean.split('\n').length>6;
                        const display=truncated?clean.split('\n').slice(0,6).join('\n'):clean;
                        return `<div class="copy-card"><div class="copy-text${truncated?'':' expanded'}">${display.replace(/\n/g,'<br>')}${truncated?'<span class="expand-btn" onclick="this.parentElement.classList.toggle(\'expanded\')">展开全文</span>':''}</div><span class="copy-btn" onclick="event.stopPropagation();copyText('${clean.replace(/'/g,"\\'")}')"><i class="fa-regular fa-clone"></i> 复制</span></div>`;
                    }).join('');
                } else if(curModule==='客户见证'){
                    document.getElementById('catTabs').style.display='flex';
                    document.getElementById('mediaCardGrid').style.display='grid';
                    document.getElementById('catTabs').innerHTML=['全部',...db.testimonialCategories].map(c=>`<span class="cat-tab ${curCat===c?'active':''}" onclick="setCat('${c}')">${c}</span>`).join('');
                    let filtered=db.testimonials.filter(t=>t.module==='客户见证');
                    if(curCat!=='全部') filtered=filtered.filter(t=>t.category===curCat);
                    if(query) filtered=filtered.filter(t=>t.title.includes(query)||t.description.includes(query));
                    const grid=document.getElementById('mediaCardGrid');
                    if(!filtered.length){grid.innerHTML='<div class="empty-state">暂无见证</div>';return;}
                    grid.innerHTML=filtered.map(t=>{
                        return `<div class="media-card">
                            <div class="media-card-image">${t.imageUrl?`<img src="${t.imageUrl}">`:'<i class="fa-solid fa-image"></i>'}</div>
                            <div class="media-card-body"><h4>${t.title}</h4><p>${t.description}</p>
                                <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:0.7rem;color:#888;">
                                    <span>${t.date||''} · ${t.clientName||''}</span>
                                    <span class="copy-btn" onclick="event.stopPropagation();copyText('${t.title+'\n'+t.description}')"><i class="fa-regular fa-clone"></i> 复制</span>
                                </div>
                            </div>
                        </div>`;
                    }).join('');
                } else if(curModule==='课程卖点'){
                    document.getElementById('catTabs').style.display='flex';
                    document.getElementById('mediaCardGrid').style.display='grid';
                    document.getElementById('catTabs').innerHTML=['全部',...db.courseCategories].map(c=>`<span class="cat-tab ${curCat===c?'active':''}" onclick="setCat('${c}')">${c}</span>`).join('');
                    let filtered=db.courses.filter(c=>c.module==='课程卖点');
                    if(curCat!=='全部') filtered=filtered.filter(c=>c.category===curCat);
                    if(query) filtered=filtered.filter(c=>c.title.includes(query)||c.description.includes(query));
                    const grid=document.getElementById('mediaCardGrid');
                    if(!filtered.length){grid.innerHTML='<div class="empty-state">暂无内容</div>';return;}
                    grid.innerHTML=filtered.map(c=>{
                        return `<div class="media-card">
                            <div class="media-card-image">${c.imageUrl?`<img src="${c.imageUrl}">`:'<i class="fa-solid fa-image"></i>'}</div>
                            <div class="media-card-body"><h4>${c.title}</h4><p>${c.description}</p>
                                <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:0.7rem;color:#888;">
                                    <span>${c.date||''}</span>
                                    <span class="copy-btn" onclick="event.stopPropagation();copyText('${c.title+'\n'+c.description}')"><i class="fa-regular fa-clone"></i> 复制</span>
                                </div>
                            </div>
                        </div>`;
                    }).join('');
                }
            }

            window.setAngle=function(a){curAngle=a;renderSub();};
            window.setCat=function(c){curCat=c;renderSub();};
            window.doSearch=function(){query=document.getElementById('searchInput').value.trim();renderSub();};

            renderHome();
        })();
    </script>
</body>
</html>
