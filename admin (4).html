<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园 · 后台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F9F7F2;--card-bg:#FFFFFF;--ink:#1a1815;--gold:#b8832a;--gold-pale:#f7f0e0;
  --border:rgba(0,0,0,0.07);--radius-lg:24px;--radius-full:50px;
  --shadow-sm:0 2px 12px rgba(0,0,0,0.05);--shadow-md:0 8px 32px rgba(0,0,0,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);min-height:100vh;}
.container{max-width:1040px;margin:0 auto;padding:0 24px;}

/* ── LOGIN ── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:48px 40px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 48px rgba(0,0,0,0.09);}
.login-eyebrow{display:inline-block;font-size:.62rem;letter-spacing:.38em;color:var(--gold);background:var(--gold-pale);padding:4px 14px;border-radius:var(--radius-full);margin-bottom:18px;}
.login-card h1{font-family:'Noto Serif SC','SimSun',serif;font-size:1.8rem;font-weight:700;margin-bottom:6px;letter-spacing:.06em;}
.login-card p{font-size:.78rem;color:#999;letter-spacing:.12em;margin-bottom:28px;}
.login-input{width:100%;padding:14px 20px;border:1.5px solid var(--border);border-radius:var(--radius-full);text-align:center;margin-bottom:14px;font-family:inherit;font-size:.9rem;outline:none;transition:border-color .2s;background:#faf8f4;}
.login-input:focus{border-color:var(--gold);}
.btn{background:var(--ink);color:#fff;border:none;padding:13px 28px;border-radius:var(--radius-full);cursor:pointer;font-weight:500;font-family:inherit;font-size:.85rem;transition:background .2s;}
.btn:hover{background:#333;}
.btn-full{width:100%;}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid #ccc;padding:8px 20px;border-radius:var(--radius-full);cursor:pointer;font-weight:500;font-family:inherit;font-size:.78rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none;margin:0 4px;transition:border-color .2s,color .2s;}
.btn-outline:hover{border-color:var(--ink);}
.login-links{margin-top:18px;display:flex;justify-content:center;gap:24px;}
.login-links a{color:#aaa;font-size:.78rem;cursor:pointer;transition:color .18s;}
.login-links a:hover{color:var(--ink);}
.back-link{margin-top:18px;display:inline-flex;justify-content:center;}

/* ── ADMIN LAYOUT ── */
#adminMain{display:none;}
.admin-header{display:flex;justify-content:space-between;align-items:center;padding:28px 0 20px;}
.admin-header h1{font-family:'Noto Serif SC','SimSun',serif;font-size:1.25rem;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:8px;}
.panel-grid{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start;}

/* SIDEBAR */
.module-sidebar{background:var(--card-bg);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.sidebar-label{font-size:.62rem;letter-spacing:.25em;color:#aaa;margin-bottom:12px;padding-left:4px;}
.module-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:14px;cursor:pointer;transition:background .18s;}
.module-item:hover{background:#f5f2eb;}
.module-item.active{background:var(--gold-pale);}
.module-item span{font-size:.88rem;letter-spacing:.04em;}
.module-item-actions{display:flex;gap:6px;}
.icon-btn{background:none;border:none;cursor:pointer;color:#bbb;font-size:.85rem;padding:2px 5px;border-radius:6px;transition:color .15s,background .15s;}
.icon-btn:hover{color:var(--ink);background:#ede9e0;}
.icon-btn.danger:hover{color:#c0392b;background:#fdecea;}

/* CONTENT PANEL */
.content-panel{background:var(--card-bg);border-radius:var(--radius-lg);padding:28px;border:1px solid var(--border);box-shadow:var(--shadow-sm);min-height:400px;}
.panel-title{font-family:'Noto Serif SC','SimSun',serif;font-size:1.05rem;font-weight:700;margin-bottom:18px;letter-spacing:.05em;display:flex;align-items:center;gap:8px;}
.panel-type-badge{font-size:.58rem;letter-spacing:.15em;color:var(--gold);background:var(--gold-pale);padding:3px 10px;border-radius:var(--radius-full);font-family:'Noto Sans SC',sans-serif;font-weight:400;}

/* TAGS */
.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.tag-item{display:inline-flex;align-items:center;gap:6px;background:#f0ede5;padding:5px 12px;border-radius:var(--radius-full);font-size:.78rem;}
.tag-del{cursor:pointer;color:#bbb;background:none;border:none;font-size:.8rem;line-height:1;transition:color .15s;}
.tag-del:hover{color:#c0392b;}
.tag-add-row{display:flex;gap:8px;margin-bottom:18px;}
.tag-add-row input{flex:1;padding:9px 16px;border:1.5px solid var(--border);border-radius:var(--radius-full);font-family:inherit;font-size:.82rem;outline:none;transition:border-color .2s;}
.tag-add-row input:focus{border-color:var(--gold);}
.tag-add-btn{padding:9px 20px;background:var(--ink);color:#fff;border:none;border-radius:var(--radius-full);cursor:pointer;font-family:inherit;font-size:.78rem;white-space:nowrap;}

/* FORM */
.form-group{margin-bottom:12px;}
.form-label{display:block;font-size:.62rem;letter-spacing:.18em;color:#999;margin-bottom:6px;}
input[type=text],input[type=url],input[type=password],select,textarea{
  width:100%;padding:11px 16px;border:1.5px solid var(--border);
  border-radius:14px;font-family:inherit;font-size:.84rem;
  color:var(--ink);background:#faf8f4;outline:none;
  transition:border-color .2s;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:#fff;}
textarea{min-height:140px;resize:vertical;line-height:1.9;border-radius:16px;}
select{cursor:pointer;}
.pub-btn{padding:11px 28px;background:var(--ink);color:#fff;border:none;border-radius:var(--radius-full);cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:500;transition:background .2s;margin-top:4px;}
.pub-btn:hover{background:#333;}

/* CARD GRID */
.admin-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:20px;}
.admin-card{background:#faf8f4;border-radius:16px;padding:16px;border:1px solid var(--border);transition:box-shadow .18s;}
.admin-card:hover{box-shadow:var(--shadow-sm);}
.admin-card-title{font-size:.82rem;font-weight:500;margin-bottom:6px;line-height:1.4;}
.admin-card-body{font-size:.78rem;color:#666;line-height:1.85;max-height:7em;overflow:hidden;white-space:pre-wrap;font-weight:300;}
.admin-card-thumb{width:100%;aspect-ratio:16/9;border-radius:10px;object-fit:cover;margin-bottom:10px;background:#f0ede5;}
.admin-card-thumb-ph{width:100%;aspect-ratio:16/9;border-radius:10px;background:#f0ede5;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#d0cbc2;margin-bottom:10px;}
.admin-card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.modal-box{background:#fff;border-radius:var(--radius-lg);padding:32px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;}
.modal-box h3{font-family:'Noto Serif SC','SimSun',serif;font-size:1rem;font-weight:700;margin-bottom:20px;letter-spacing:.05em;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

/* IMPORT/EXPORT */
.header-actions{display:flex;gap:8px;align-items:center;}

/* EMPTY / PLACEHOLDER */
.panel-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:240px;color:#ccc;font-size:.85rem;letter-spacing:.12em;gap:10px;}
.panel-placeholder span{font-size:2rem;}
.empty-list{text-align:center;padding:32px;color:#ccc;font-size:.8rem;letter-spacing:.1em;}

/* SECTION DIVIDER */
.section-divider{font-size:.62rem;letter-spacing:.25em;color:#bbb;margin:20px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:9px 22px;border-radius:var(--radius-full);font-size:.75rem;letter-spacing:.1em;opacity:0;transition:all .22s;pointer-events:none;z-index:3000;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:720px){
  .panel-grid{grid-template-columns:1fr;}
  .admin-header{flex-wrap:wrap;gap:10px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-eyebrow">ADMIN PANEL</div>
    <h1>易饰乾园 · 后台</h1>
    <p>文案资产管理系统</p>
    <input class="login-input" type="password" id="pwdInput" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')login()">
    <button class="btn btn-full" onclick="login()">进入后台</button>
    <div class="login-links">
      <a onclick="showChangePwdModal()">修改密码</a>
      <a onclick="showForgotPwdModal()">忘记密码？</a>
    </div>
    <div class="back-link">
      <a href="index.html" class="btn-outline">← 返回前台</a>
    </div>
  </div>
</div>

<!-- ADMIN MAIN -->
<div id="adminMain">
  <div class="container">
    <div class="admin-header">
      <h1>⚙ 库管理中心</h1>
      <div class="header-actions">
        <a href="index.html" class="btn-outline">← 前台</a>
        <button class="btn-outline" onclick="exportData()">⬇ 导出</button>
        <label class="btn-outline" style="cursor:pointer;">⬆ 导入<input type="file" hidden accept=".json" onchange="importData(this)"></label>
      </div>
    </div>
    <div class="panel-grid">
      <div class="module-sidebar">
        <div class="sidebar-label">模块</div>
        <div id="moduleList"></div>
        <button class="btn btn-full" style="margin-top:14px;" onclick="addModule()">＋ 新增模块</button>
      </div>
      <div class="content-panel" id="contentPanel">
        <div class="panel-placeholder"><span>📂</span>← 选择左侧模块</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY='ysqy_data_v3';
  const DEFAULT_PWD='ysqy798';
  const DEFAULT_MODULES=[
    {id:'pyq',name:'朋友圈',type:'moments',icon:'✍️',desc:'高转化发圈文案库',categories:['数字冲击','对话还原','情绪唤醒']},
    {id:'witness',name:'客户见证',type:'testimonial',icon:'🌟',desc:'真实案例 · 信任背书',categories:['文昌','沙龙','成交','夫妻关系','身体健康','知识成长','见识提升']},
    {id:'course',name:'课程卖点',type:'course',icon:'🎯',desc:'核心价值 · 转化文案',categories:['核心价值','课程亮点']},
  ];

  function cleanDB(raw){
    if(!raw||typeof raw!=='object')return{modules:JSON.parse(JSON.stringify(DEFAULT_MODULES)),contents:[]};
    if(!Array.isArray(raw.modules)||!raw.modules.length)raw.modules=JSON.parse(JSON.stringify(DEFAULT_MODULES));
    raw.modules=raw.modules.filter(m=>m&&typeof m==='object'&&m.id&&m.name&&m.name!=='undefined'&&m.name!=='null');
    raw.modules.forEach(m=>{if(!m.icon)m.icon='📄';if(!m.desc)m.desc='';if(!m.categories)m.categories=[];});
    if(!Array.isArray(raw.contents))raw.contents=[];
    return raw;
  }

  let raw;
  try{raw=JSON.parse(localStorage.getItem(KEY));}catch(e){raw=null;}
  let db=cleanDB(raw||{});
  save();

  function save(){localStorage.setItem(KEY,JSON.stringify(db));}
  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
  function getPwd(){return localStorage.getItem('ysqy_admin_pwd')||DEFAULT_PWD;}
  function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  // ── AUTH ──
  window.login=function(){
    if(document.getElementById('pwdInput').value===getPwd()){
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('adminMain').style.display='block';
      renderSidebar();
    } else toast('密码错误');
  };

  window.showChangePwdModal=function(){
    const m=makeModal(`<h3>修改密码</h3>
      <div class="form-group"><label class="form-label">当前密码</label><input type="password" id="mOld" placeholder="当前密码"/></div>
      <div class="form-group"><label class="form-label">新密码（≥6位）</label><input type="password" id="mNew" placeholder="新密码"/></div>
      <div class="form-group"><label class="form-label">确认新密码</label><input type="password" id="mCon" placeholder="再次输入"/></div>
      <div class="modal-actions">
        <button class="btn-outline" onclick="this.closest('.modal').remove()">取消</button>
        <button class="btn" id="doChange">确认修改</button>
      </div>`);
    document.getElementById('doChange').onclick=function(){
      const o=document.getElementById('mOld').value,n=document.getElementById('mNew').value,c=document.getElementById('mCon').value;
      if(o!==getPwd()){toast('当前密码不正确');return;}
      if(n.length<6){toast('新密码至少6位');return;}
      if(n!==c){toast('两次输入不一致');return;}
      localStorage.setItem('ysqy_admin_pwd',n);m.remove();toast('密码已修改 ✓');
    };
  };

  window.showForgotPwdModal=function(){
    const m=makeModal(`<h3>重置密码</h3>
      <p style="font-size:.8rem;color:#888;margin-bottom:16px;line-height:1.7;">输入重置暗号来恢复默认密码</p>
      <div class="form-group"><input type="text" id="resetCode" placeholder="重置暗号"/></div>
      <div class="modal-actions">
        <button class="btn-outline" onclick="this.closest('.modal').remove()">取消</button>
        <button class="btn" id="doReset">重置</button>
      </div>`);
    document.getElementById('doReset').onclick=function(){
      if(document.getElementById('resetCode').value==='ysqy_reset'){
        localStorage.removeItem('ysqy_admin_pwd');m.remove();toast('已重置为默认密码 ✓');
      } else toast('暗号错误');
    };
  };

  // ── SIDEBAR ──
  let curModId=null;

  function renderSidebar(){
    document.getElementById('moduleList').innerHTML=db.modules.map(m=>`
      <div class="module-item${curModId===m.id?' active':''}" onclick="selectMod('${m.id}')">
        <span>${m.icon||'📄'} ${esc(m.name)}</span>
        <div class="module-item-actions" onclick="event.stopPropagation()">
          <button class="icon-btn" onclick="renameMod('${m.id}')" title="重命名">✏</button>
          <button class="icon-btn danger" onclick="deleteMod('${m.id}')" title="删除">🗑</button>
        </div>
      </div>`).join('');
    if(curModId)renderContent();
  }

  window.selectMod=function(id){curModId=id;renderSidebar();};

  // ── CONTENT PANEL ──
  function renderContent(){
    const mod=db.modules.find(m=>m.id===curModId);
    if(!mod){document.getElementById('contentPanel').innerHTML='<div class="panel-placeholder"><span>📂</span>← 选择左侧模块</div>';return;}
    const contents=db.contents.filter(c=>c.moduleId===curModId);

    let html=`<div class="panel-title">${mod.icon||'📄'} ${esc(mod.name)} <span class="panel-type-badge">${mod.type}</span></div>`;

    // categories
    html+=`<div class="section-divider">分类标签</div>
    <div class="tag-list">${(mod.categories||[]).map(c=>`<span class="tag-item">${esc(c)}<button class="tag-del" onclick="delCat('${esc(c)}')">✕</button></span>`).join('')}</div>
    <div class="tag-add-row">
      <input id="newCat" placeholder="输入新分类名称…" onkeydown="if(event.key==='Enter')addCat()"/>
      <button class="tag-add-btn" onclick="addCat()">添加</button>
    </div>`;

    // publish form
    html+=`<div class="section-divider">添加内容</div>`;
    if(mod.type==='moments'){
      html+=`<div class="form-group"><label class="form-label">选择角度分类</label>
        <select id="pubAngle">${(mod.categories||[]).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">文案内容（每行回车）</label>
        <textarea id="pubText" placeholder="输入文案，每行对应发圈一句…"></textarea></div>
        <button class="pub-btn" onclick="pub()">发布文案</button>`;
    } else {
      html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group"><label class="form-label">分类</label>
          <select id="pubCat">${(mod.categories||[]).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">客户姓名（选填）</label>
          <input type="text" id="pubClient" placeholder="张女士"/></div>
      </div>
      <div class="form-group"><label class="form-label">标题</label><input type="text" id="pubTitle" placeholder="见证标题或课程名称"/></div>
      <div class="form-group"><label class="form-label">图片链接（外链 URL）</label><input type="url" id="pubImg" placeholder="https://…"/></div>
      <div class="form-group"><label class="form-label">描述内容</label><textarea id="pubDesc" placeholder="详细描述…"></textarea></div>
      <div class="form-group"><label class="form-label">日期（选填）</label><input type="text" id="pubDate" placeholder="2025-01"/></div>
      <button class="pub-btn" onclick="pub()">保存</button>`;
    }

    // list
    html+=`<div class="section-divider">已发布内容 (${contents.length})</div>`;
    if(!contents.length){html+=`<div class="empty-list">暂无内容</div>`;}
    else{
      html+=`<div class="admin-card-grid">`;
      contents.forEach(c=>{
        const idx=db.contents.indexOf(c);
        const isFirst=idx===0,isLast=idx===db.contents.length-1;
        let cardHtml='';
        if(mod.type!=='moments'){
          if(c.imageUrl)cardHtml+=`<img class="admin-card-thumb" src="${esc(c.imageUrl)}" alt="" onerror="this.style.display='none'"/>`;
          else cardHtml+=`<div class="admin-card-thumb-ph">🖼</div>`;
        }
        if(c.title||c.angle)cardHtml+=`<div class="admin-card-title">${esc(c.angle||c.category||'')} ${esc(c.title||'')}</div>`;
        cardHtml+=`<div class="admin-card-body">${esc(c.text||c.description||'')}</div>`;
        cardHtml+=`<div class="admin-card-actions">
          <button class="icon-btn" onclick="moveItem(${idx},-1)" ${isFirst?'disabled':''} title="上移">↑</button>
          <button class="icon-btn" onclick="moveItem(${idx},1)"  ${isLast?'disabled':''} title="下移">↓</button>
          <button class="icon-btn" onclick="editItem(${idx})" title="编辑">✏</button>
          <button class="icon-btn danger" onclick="delItem(${idx})" title="删除">🗑</button>
        </div>`;
        html+=`<div class="admin-card">${cardHtml}</div>`;
      });
      html+=`</div>`;
    }

    document.getElementById('contentPanel').innerHTML=html;
  }

  // ── CRUD ──
  window.pub=function(){
    const mod=db.modules.find(m=>m.id===curModId);
    const item={id:Date.now(),moduleId:curModId};
    if(mod.type==='moments'){
      item.angle=document.getElementById('pubAngle').value;
      item.text=document.getElementById('pubText').value.trim();
      if(!item.text){toast('请输入文案内容');return;}
      item.time=Date.now();
    } else {
      item.category=document.getElementById('pubCat').value;
      item.title=(document.getElementById('pubTitle').value||'').trim();
      item.description=(document.getElementById('pubDesc').value||'').trim();
      item.imageUrl=(document.getElementById('pubImg').value||'').trim();
      item.clientName=(document.getElementById('pubClient').value||'').trim();
      item.date=(document.getElementById('pubDate').value||'').trim();
      if(!item.title&&!item.description){toast('标题或描述至少填一项');return;}
    }
    db.contents.unshift(item);save();renderContent();toast('已发布 ✓');
  };

  window.editItem=function(idx){
    const c=db.contents[idx];
    const mod=db.modules.find(m=>m.id===c.moduleId);
    let form='';
    if(mod.type==='moments'){
      form=`<div class="form-group"><label class="form-label">角度分类</label>
        <select id="eAngle">${mod.categories.map(cat=>`<option value="${esc(cat)}"${cat===c.angle?' selected':''}>${esc(cat)}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">文案内容</label><textarea id="eText">${esc(c.text||'')}</textarea></div>`;
    } else {
      form=`<div class="form-group"><label class="form-label">分类</label>
        <select id="eCat">${mod.categories.map(cat=>`<option value="${esc(cat)}"${cat===c.category?' selected':''}>${esc(cat)}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">标题</label><input type="text" id="eTitle" value="${esc(c.title||'')}"/></div>
        <div class="form-group"><label class="form-label">图片链接</label><input type="url" id="eImg" value="${esc(c.imageUrl||'')}"/></div>
        <div class="form-group"><label class="form-label">描述</label><textarea id="eDesc">${esc(c.description||'')}</textarea></div>
        <div class="form-group"><label class="form-label">客户姓名</label><input type="text" id="eClient" value="${esc(c.clientName||'')}"/></div>
        <div class="form-group"><label class="form-label">日期</label><input type="text" id="eDate" value="${esc(c.date||'')}"/></div>`;
    }
    const m=makeModal(`<h3>编辑内容</h3>${form}
      <div class="modal-actions">
        <button class="btn-outline" onclick="this.closest('.modal').remove()">取消</button>
        <button class="btn" id="doSaveEdit">保存修改</button>
      </div>`);
    document.getElementById('doSaveEdit').onclick=function(){
      if(mod.type==='moments'){
        c.angle=document.getElementById('eAngle').value;
        c.text=document.getElementById('eText').value.trim();
      } else {
        c.category=document.getElementById('eCat').value;
        c.title=document.getElementById('eTitle').value.trim();
        c.imageUrl=document.getElementById('eImg').value.trim();
        c.description=document.getElementById('eDesc').value.trim();
        c.clientName=document.getElementById('eClient').value.trim();
        c.date=document.getElementById('eDate').value.trim();
      }
      save();renderContent();m.remove();toast('已更新 ✓');
    };
  };

  window.moveItem=function(idx,dir){
    const n=idx+dir;
    if(n<0||n>=db.contents.length)return;
    [db.contents[idx],db.contents[n]]=[db.contents[n],db.contents[idx]];
    save();renderContent();
  };

  window.delItem=function(idx){
    if(!confirm('确认删除这条内容？'))return;
    db.contents.splice(idx,1);save();renderContent();toast('已删除');
  };

  window.addCat=function(){
    const val=(document.getElementById('newCat').value||'').trim();
    if(!val)return;
    const mod=db.modules.find(m=>m.id===curModId);
    if(!mod.categories)mod.categories=[];
    if(mod.categories.includes(val)){toast('分类已存在');return;}
    mod.categories.push(val);save();renderContent();
  };

  window.delCat=function(val){
    const mod=db.modules.find(m=>m.id===curModId);
    mod.categories=mod.categories.filter(c=>c!==val);save();renderContent();
  };

  window.addModule=function(){
    const m=makeModal(`<h3>新增模块</h3>
      <div style="display:grid;grid-template-columns:80px 1fr;gap:10px;margin-bottom:12px;">
        <div class="form-group"><label class="form-label">图标 Emoji</label><input type="text" id="modIcon" value="📄" maxlength="2"/></div>
        <div class="form-group"><label class="form-label">模块名称</label><input type="text" id="modName" placeholder="如：学员案例"/></div>
      </div>
      <div class="form-group"><label class="form-label">描述</label><input type="text" id="modDesc" placeholder="简短描述"/></div>
      <div class="form-group"><label class="form-label">类型</label>
        <select id="modType">
          <option value="moments">moments（文字文案）</option>
          <option value="testimonial">testimonial（图文见证）</option>
          <option value="course">course（图文卖点）</option>
        </select></div>
      <div class="modal-actions">
        <button class="btn-outline" onclick="this.closest('.modal').remove()">取消</button>
        <button class="btn" id="doAddMod">添加</button>
      </div>`);
    document.getElementById('doAddMod').onclick=function(){
      const name=(document.getElementById('modName').value||'').trim();
      const icon=document.getElementById('modIcon').value||'📄';
      const desc=(document.getElementById('modDesc').value||'').trim();
      const type=document.getElementById('modType').value;
      if(!name){toast('请填写模块名称');return;}
      db.modules.push({id:'mod_'+Date.now(),name,icon,desc,type,categories:[]});
      save();renderSidebar();m.remove();toast('模块已添加 ✓');
    };
  };

  window.renameMod=function(id){
    const mod=db.modules.find(m=>m.id===id);
    const m=makeModal(`<h3>编辑模块</h3>
      <div style="display:grid;grid-template-columns:80px 1fr;gap:10px;margin-bottom:12px;">
        <div class="form-group"><label class="form-label">图标</label><input type="text" id="rIcon" value="${esc(mod.icon||'📄')}" maxlength="2"/></div>
        <div class="form-group"><label class="form-label">名称</label><input type="text" id="rName" value="${esc(mod.name)}"/></div>
      </div>
      <div class="form-group"><label class="form-label">描述</label><input type="text" id="rDesc" value="${esc(mod.desc||'')}"/></div>
      <div class="modal-actions">
        <button class="btn-outline" onclick="this.closest('.modal').remove()">取消</button>
        <button class="btn" id="doRename">保存</button>
      </div>`);
    document.getElementById('doRename').onclick=function(){
      mod.name=(document.getElementById('rName').value||'').trim()||mod.name;
      mod.icon=document.getElementById('rIcon').value||'📄';
      mod.desc=(document.getElementById('rDesc').value||'').trim();
      save();renderSidebar();if(curModId===id)renderContent();m.remove();toast('已更新 ✓');
    };
  };

  window.deleteMod=function(id){
    if(!confirm('删除模块及其全部内容？此操作不可撤销。'))return;
    db.modules=db.modules.filter(m=>m.id!==id);
    db.contents=db.contents.filter(c=>c.moduleId!==id);
    if(curModId===id){curModId=null;document.getElementById('contentPanel').innerHTML='<div class="panel-placeholder"><span>📂</span>← 选择左侧模块</div>';}
    save();renderSidebar();toast('已删除');
  };

  // ── EXPORT / IMPORT ──
  window.exportData=function(){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
    a.download='ysqy_backup_'+Date.now()+'.json';a.click();toast('已导出 ✓');
  };

  window.importData=function(input){
    const file=input.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        const data=JSON.parse(e.target.result);
        if(data.modules&&data.contents){
          if(confirm('导入将覆盖当前全部数据，确认？')){
            db=cleanDB(data);save();curModId=null;
            document.getElementById('contentPanel').innerHTML='<div class="panel-placeholder"><span>📂</span>← 选择左侧模块</div>';
            renderSidebar();toast('导入成功 ✓');
          }
        } else toast('格式错误，请使用本站导出的备份文件');
      } catch(ex){toast('解析失败：'+ex.message);}
    };
    reader.readAsText(file);input.value='';
  };

  // ── HELPERS ──
  function makeModal(html){
    const ov=document.createElement('div');ov.className='modal';
    ov.innerHTML=`<div class="modal-box">${html}</div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
    return ov;
  }
})();
</script>
</body>
</html>
