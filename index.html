<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园素材库</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2;
            --card-bg: #FFFFFF;
            --ink: #1a1815;
            --ink-light: #5c574f;
            --gold: #b8832a;
            --gold-light: #d4a84b;
            --gold-pale: #f7f0e0;
            --bordeaux: #8b3a3a;
            --bordeaux-light: #a85555;
            --sage: #5a6b4d;
            --sage-light: #7d8f6e;
            --border: rgba(0, 0, 0, 0.06);
            --border-strong: rgba(0, 0, 0, 0.12);
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 50px;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.10);
            --transition: 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: var(--font-sans);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── 顶部装饰线 ── */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--bordeaux), var(--sage));
            z-index: 1000;
        }

        /* ── 全局容器 ── */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 28px;
        }

        /* ── 首页头部 ── */
        .hero {
            text-align: center;
            padding: 72px 0 48px;
            position: relative;
        }
        .hero-tag {
            display: inline-block;
            font-size: 0.7rem;
            letter-spacing: 0.35em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 16px;
            font-weight: 500;
            background: var(--gold-pale);
            padding: 6px 18px;
            border-radius: var(--radius-full);
        }
        .hero-title {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 0.06em;
            color: var(--ink);
            margin-bottom: 8px;
            line-height: 1.2;
        }
        .hero-subtitle {
            font-size: 0.9rem;
            color: var(--ink-light);
            font-weight: 300;
            letter-spacing: 0.15em;
        }
        .hero-line {
            width: 50px;
            height: 2px;
            background: var(--gold);
            margin: 20px auto 0;
            border-radius: 2px;
        }

        /* ── 模块卡片网格（首页）── */
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
            padding-bottom: 60px;
        }
        .module-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 36px 30px 30px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: var(--shadow-sm);
        }
        .module-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border-strong);
        }
        .module-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gold-light);
            opacity: 0;
            transition: var(--transition);
        }
        .module-card:hover::after {
            opacity: 1;
        }
        .module-card-icon {
            font-size: 2rem;
            color: var(--gold);
            transition: var(--transition);
        }
        .module-card:hover .module-card-icon {
            color: var(--bordeaux);
            transform: scale(1.1);
        }
        .module-card-title {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .module-card-desc {
            font-size: 0.8rem;
            color: var(--ink-light);
            letter-spacing: 0.06em;
            line-height: 1.5;
        }
        .module-card-arrow {
            align-self: flex-end;
            font-size: 0.8rem;
            color: #ccc;
            transition: var(--transition);
        }
        .module-card:hover .module-card-arrow {
            color: var(--gold);
            transform: translateX(4px);
        }

        /* ── 二级页面布局 ── */
        .sub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 0 20px;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 3px;
            background: var(--bg);
            z-index: 99;
            border-bottom: 1px solid var(--border);
        }
        .sub-title-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .sub-title {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.06em;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eae6dc;
            color: var(--ink-light);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            white-space: nowrap;
            font-weight: 500;
            border: none;
            font-family: inherit;
        }
        .btn-back:hover {
            background: #ddd8cc;
            color: var(--ink);
        }
        .search-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 1rem;
            color: var(--ink-light);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .search-toggle:hover {
            color: var(--gold);
            border-color: var(--gold);
        }
        .search-input-wrap {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            overflow: hidden;
            transition: var(--transition);
            background: var(--card-bg);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
        }
        .search-input-wrap.open {
            width: 240px;
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-md);
        }
        .search-input-wrap input {
            width: 100%;
            padding: 10px 40px 10px 18px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            color: var(--ink);
        }
        .search-input-wrap .search-close {
            position: absolute;
            right: 8px;
            cursor: pointer;
            color: #aaa;
            font-size: 0.8rem;
            padding: 6px;
            transition: var(--transition);
        }
        .search-input-wrap .search-close:hover {
            color: var(--ink);
        }

        /* ── 角度筛选Pills（圆润弧形）── */
        .angle-bar {
            display: flex;
            gap: 10px;
            padding: 18px 0;
            flex-wrap: wrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .angle-bar::-webkit-scrollbar {
            display: none;
        }
        .angle-pill {
            padding: 9px 22px;
            border-radius: var(--radius-full);
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.82rem;
            letter-spacing: 0.04em;
            transition: var(--transition);
            font-weight: 400;
            color: var(--ink-light);
            box-shadow: var(--shadow-sm);
        }
        .angle-pill:hover {
            border-color: var(--gold-light);
            color: var(--ink);
        }
        .angle-pill.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
            font-weight: 500;
            box-shadow: var(--shadow-md);
        }

        /* ── 朋友圈卡片网格 ── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
            padding: 10px 0 50px;
        }
        .copy-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 30px 28px;
            transition: var(--transition);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 18px;
            box-shadow: var(--shadow-sm);
        }
        .copy-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border-strong);
        }
        .copy-text {
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.9;
            white-space: pre-wrap;
            letter-spacing: 0.02em;
            color: var(--ink);
        }
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #aaa;
            letter-spacing: 0.06em;
        }
        .card-meta .copy-btn {
            cursor: pointer;
            font-size: 0.85rem;
            color: #bbb;
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: 6px;
        }
        .card-meta .copy-btn:hover {
            color: var(--gold);
            background: var(--gold-pale);
        }

        /* ── 客户见证 / 课程卖点 列表布局 ── */
        .testimonial-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 10px 0 50px;
        }
        .testimonial-item {
            display: flex;
            gap: 18px;
            align-items: flex-start;
            padding: 18px 20px;
            background: var(--card-bg);
            cursor: pointer;
            transition: var(--transition);
            border-bottom: 1px solid var(--border);
            border-radius: 2px;
        }
        .testimonial-item:hover {
            background: #fdfbf6;
            box-shadow: var(--shadow-sm);
        }
        .testimonial-thumb {
            width: 70px;
            height: 70px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            flex-shrink: 0;
            background: #f0ede5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 1.4rem;
            overflow: hidden;
        }
        .testimonial-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .testimonial-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .testimonial-info h4 {
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--ink);
            margin: 0;
        }
        .testimonial-info p {
            font-size: 0.78rem;
            color: var(--ink-light);
            letter-spacing: 0.04em;
            line-height: 1.5;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .testimonial-meta {
            font-size: 0.68rem;
            color: #bbb;
            letter-spacing: 0.06em;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .testimonial-cat {
            display: inline-block;
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: var(--radius-full);
            background: var(--gold-pale);
            color: var(--gold);
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        /* ── 分类Tab（客户见证顶部）── */
        .cat-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }
        .cat-tab {
            padding: 8px 18px;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            transition: var(--transition);
            background: transparent;
            color: var(--ink-light);
            border: 1.5px solid transparent;
            white-space: nowrap;
            font-family: inherit;
        }
        .cat-tab:hover {
            color: var(--ink);
            background: #f5f2ea;
        }
        .cat-tab.active {
            background: var(--ink);
            color: #fff;
            font-weight: 500;
            border-color: var(--ink);
        }

        /* ── 详情弹窗 ── */
        .detail-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .detail-modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .detail-modal {
            background: #fff;
            border-radius: var(--radius-lg);
            padding: 36px 30px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--shadow-lg);
        }
        .detail-modal img {
            width: 100%;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            max-height: 350px;
            object-fit: cover;
        }
        .detail-modal h3 {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            margin-bottom: 8px;
            letter-spacing: 0.04em;
        }
        .detail-modal p {
            font-size: 0.88rem;
            color: var(--ink-light);
            line-height: 1.8;
            letter-spacing: 0.03em;
        }
        .detail-modal .close-modal {
            position: absolute;
            top: 16px;
            right: 18px;
            cursor: pointer;
            font-size: 1.3rem;
            color: #aaa;
            transition: var(--transition);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f5f5f5;
        }
        .detail-modal .close-modal:hover {
            color: var(--ink);
            background: #e8e8e8;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(14px);
            background: var(--ink);
            color: #fff;
            padding: 10px 24px;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 999;
            box-shadow: var(--shadow-lg);
        }
        .toast.on {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── 空状态 ── */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #ccc;
            letter-spacing: 0.08em;
            font-size: 0.9rem;
            grid-column: 1 / -1;
        }

        /* ── 响应式 ── */
        @media (max-width: 680px) {
            .hero-title {
                font-size: 2rem;
            }
            .card-grid {
                grid-template-columns: 1fr;
            }
            .module-grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
            .module-card {
                padding: 24px 18px 20px;
            }
            .sub-header {
                padding: 18px 0 14px;
            }
            .sub-title {
                font-size: 1.3rem;
            }
            .search-input-wrap.open {
                width: 180px;
            }
            .detail-modal {
                padding: 24px 18px;
                width: 95%;
            }
            .testimonial-thumb {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- ═══════════ 首页视图 ═══════════ -->
    <div id="homeView">
        <div class="container">
            <header class="hero">
                <div class="hero-tag">YISHI QIANYUAN</div>
                <h1 class="hero-title">易饰乾园素材库</h1>
                <p class="hero-subtitle">极简文案资产 · 驱动品牌自然生长</p>
                <div class="hero-line"></div>
            </header>
            <nav class="module-grid" id="moduleGrid"></nav>
        </div>
    </div>

    <!-- ═══════════ 二级页面视图 ═══════════ -->
    <div id="subView" style="display:none;">
        <div class="container">
            <div class="sub-header">
                <div class="sub-title-area">
                    <button class="btn-back" onclick="goHome()">
                        <i class="fa-solid fa-arrow-left"></i> 返回首页
                    </button>
                    <h2 class="sub-title" id="subTitle">朋友圈</h2>
                </div>
                <div class="search-wrap" id="searchWrap">
                    <button class="search-toggle" id="searchToggle" onclick="toggleSearch()">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <div class="search-input-wrap" id="searchInputWrap">
                        <input type="text" id="searchInput" placeholder="搜索文案内容…" oninput="doSearch()">
                        <span class="search-close" onclick="closeSearch()"><i class="fa-solid fa-xmark"></i></span>
                    </div>
                </div>
            </div>
            <!-- 角度筛选（朋友圈用） -->
            <div class="angle-bar" id="angleBar" style="display:none;"></div>
            <!-- 分类Tab（客户见证/课程卖点用） -->
            <div class="cat-tabs" id="catTabs" style="display:none;"></div>
            <!-- 朋友圈卡片网格 -->
            <div class="card-grid" id="cardGrid" style="display:none;"></div>
            <!-- 客户见证/课程卖点列表 -->
            <div class="testimonial-list" id="testimonialList" style="display:none;"></div>
            <!-- 空状态 -->
            <div class="empty-state" id="emptyState" style="display:none;">暂无内容</div>
        </div>
    </div>

    <!-- ═══════════ 详情弹窗 ═══════════ -->
    <div class="detail-modal-overlay" id="detailOverlay" onclick="closeDetail(event)">
        <div class="detail-modal" id="detailModal" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i></span>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- ═══════════ Toast ═══════════ -->
    <div class="toast" id="toast"></div>

            courses: [
                { id: 201, module: '课程卖点', category: '核心价值',

                { id: 202, module: '课程卖点', category: '课程亮点',

                    description: '从判断到布局到落地，每步有据。涵盖五行色彩、读像思维、经营根源、九运趋势四大模块，构建完整的文化营销体系。',
                    clientName: '', date: '2024-05-01' },
                { id: 203, module: '课程卖点', category: '学员反馈',
                    imageUrl: '',
                    title: '学员真实反馈合集',
                    description: '"学完才知道，签单和美学没多大关系，和懂人有关系"——这是学员最常说的一句话。课程带给他们的不仅是知识，更是看待客户的全新眼光。',

        let db = JSON.parse(localStorage.getItem(DATA_KEY) || 'null') || JSON.parse(JSON.stringify(
        DEFAULT_DATA));
        let currentModule = null;
        let currentAngle = '全部';
        let currentCategory = '全部';
        let searchQuery = '';

        // 保存数据
        function saveDB() {
            localStorage.setItem(DATA_KEY, JSON.stringify(db));
            // 触发storage事件同步给admin页面
            window.dispatchEvent(new StorageEvent('storage', { key: DATA_KEY, newValue: JSON.stringify(db) }));
        }

        // Toast
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('on');
            setTimeout(() => t.classList.remove('on'), 2200);
        }

        // ═══════════ 首页渲染 ═══════════
        function renderHome() {
            const grid = document.getElementById('moduleGrid');
            const icons = { '朋友圈': 'fa-solid fa-pen-to-square', '客户见证': 'fa-solid fa-comments',
                '课程卖点': 'fa-solid fa-graduation-cap' };
            const descs = { '朋友圈': '高转化发图文案库 · 真实案例信任背书', '客户见证': '真实案例 · 信任背书 · 截图存档',
                '课程卖点': '核心价值 · 转化文案 · 课程亮点' };
            grid.innerHTML = db.modules.map(m => `
            <div class="module-card" onclick="openModule('${m}')">
              <div class="module-card-icon"><i class="${icons[m] || 'fa-solid fa-folder'}"></i></div>
              <div class="module-card-title">${m}</div>
              <div class="module-card-desc">${descs[m] || '点击查看详情'}</div>
              <div class="module-card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
            </div>
          `).join('');
        }

        // ═══════════ 二级页面 ═══════════
        function openModule(moduleName) {
            currentModule = moduleName;
            currentAngle = '全部';
            currentCategory = '全部';
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('searchInputWrap').classList.remove('open');
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('subView').style.display = 'block';
            document.getElementById('subTitle').textContent = moduleName;
            renderSubPage();
            window.scrollTo(0, 0);
        }

        function goHome() {
            document.getElementById('subView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
            currentModule = null;
            renderHome();
            window.scrollTo(0, 0);
        }

        function renderSubPage() {
            if (!currentModule) return;
            const isMoments = currentModule === '朋友圈';
            const isTestimonial = currentModule === '客户见证';
            const isCourse = currentModule === '课程卖点';

            // 角度栏（朋友圈）
            document.getElementById('angleBar').style.display = isMoments ? 'flex' : 'none';
            // 分类Tab（客户见证/课程卖点）
            document.getElementById('catTabs').style.display = (isTestimonial || isCourse) ? 'flex' : 'none';
            // 卡片网格（朋友圈）
            document.getElementById('cardGrid').style.display = isMoments ? 'grid' : 'none';
            // 列表（客户见证/课程卖点）
            document.getElementById('testimonialList').style.display = (isTestimonial || isCourse) ? 'flex' : 'none';
            document.getElementById('emptyState').style.display = 'none';

            if (isMoments) renderMoments();
            if (isTestimonial) renderTestimonials();
            if (isCourse) renderCourses();
        }

        // ── 朋友圈 ──
        function renderMoments() {
            // 角度pills
            const angleBar = document.getElementById('angleBar');
            const allAngles = ['全部', ...db.angles];
            angleBar.innerHTML = allAngles.map(a => `
            <span class="angle-pill ${currentAngle === a ? 'active' : ''}" onclick="setAngle('${a}')">${a}</span>
          `).join('');

            // 卡片
            let filtered = db.posts.filter(p => p.module === '朋友圈');
            if (currentAngle !== '全部') filtered = filtered.filter(p => p.angle === currentAngle);
            if (searchQuery) filtered = filtered.filter(p => p.text.includes(searchQuery) || p.angle.includes(
                searchQuery));

            const grid = document.getElementById('cardGrid');
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state">暂无匹配文案</div>';
                return;
            }
            grid.innerHTML = filtered.map(p => `
            <div class="copy-card">
              <div class="copy-text">${p.text}</div>
              <div class="card-meta">
                <span># ${p.angle}</span>
                <span class="copy-btn" onclick="copyText('${p.text.replace(/\n/g, '\\n').replace(/'/g, "\\'")}')" title="复制">
                  <i class="fa-regular fa-clone"></i> 复制
                </span>
              </div>
            </div>
          `).join('');
        }

        function setAngle(a) {
            currentAngle = a;
            renderMoments();
        }

        function copyText(text) {
            navigator.clipboard.writeText(text.replace(/\\n/g, '\n')).then(() => toast('已复制到剪贴板 ✓'));
        }

        // ── 客户见证 ──
        function renderTestimonials() {
            const catTabs = document.getElementById('catTabs');
            const allCats = ['全部', ...db.testimonialCategories];
            catTabs.innerHTML = allCats.map(c => `
            <button class="cat-tab ${currentCategory === c ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>
          `).join('');

            let filtered = db.testimonials.filter(t => t.module === '客户见证');
            if (currentCategory !== '全部') filtered = filtered.filter(t => t.category === currentCategory);
            if (searchQuery) filtered = filtered.filter(t => t.title.includes(searchQuery) || t.description.includes(
                searchQuery) || t.category.includes(searchQuery));

            const list = document.getElementById('testimonialList');
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state" style="width:100%;">暂无匹配见证</div>';
                return;
            }
            list.innerHTML = filtered.map(t => `
            <div class="testimonial-item" onclick="openDetail('testimonial', ${t.id})">
              <div class="testimonial-thumb">
                ${t.imageUrl ? `<img src="${t.imageUrl}" alt="${t.title}" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\'fa-solid fa-image\\'></i>'">` : '<i class="fa-solid fa-image"></i>'}
              </div>
              <div class="testimonial-info">
                <h4>${t.title}</h4>
                <p>${t.description}</p>
                <div class="testimonial-meta">
                  <span class="testimonial-cat">${t.category}</span>
                  <span>${t.date || ''}</span>
                  <span>${t.clientName || ''}</span>
                </div>
              </div>
            </div>
          `).join('');
        }

        // ── 课程卖点 ──
        function renderCourses() {
            const catTabs = document.getElementById('catTabs');
            const allCats = ['全部', ...db.courseCategories];
            catTabs.innerHTML = allCats.map(c => `
            <button class="cat-tab ${currentCategory === c ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>
          `).join('');

            let filtered = db.courses.filter(c => c.module === '课程卖点');
            if (currentCategory !== '全部') filtered = filtered.filter(c => c.category === currentCategory);
            if (searchQuery) filtered = filtered.filter(c => c.title.includes(searchQuery) || c.description.includes(
                searchQuery) || c.category.includes(searchQuery));

            const list = document.getElementById('testimonialList');
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state" style="width:100%;">暂无匹配内容</div>';
                return;
            }
            list.innerHTML = filtered.map(c => `
            <div class="testimonial-item" onclick="openDetail('course', ${c.id})">
              <div class="testimonial-thumb">
                ${c.imageUrl ? `<img src="${c.imageUrl}" alt="${c.title}" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\'fa-solid fa-image\\'></i>'">` : '<i class="fa-solid fa-graduation-cap"></i>'}
              </div>
              <div class="testimonial-info">
                <h4>${c.title}</h4>
                <p>${c.description}</p>
                <div class="testimonial-meta">
                  <span class="testimonial-cat">${c.category}</span>
                  <span>${c.date || ''}</span>
                </div>
              </div>
            </div>
          `).join('');
        }

        function setCategory(c) {
            currentCategory = c;
            if (currentModule === '客户见证') renderTestimonials();
            if (currentModule === '课程卖点') renderCourses();
        }

        // ── 搜索 ──
        function toggleSearch() {
            const wrap = document.getElementById('searchInputWrap');
            const input = document.getElementById('searchInput');
            if (wrap.classList.contains('open')) {
                closeSearch();
            } else {
                wrap.classList.add('open');
                setTimeout(() => input.focus(), 200);
            }
        }

        function closeSearch() {
            document.getElementById('searchInputWrap').classList.remove('open');
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            renderSubPage();
        }

        function doSearch() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderSubPage();
        }

        // ── 详情弹窗 ──
        function openDetail(type, id) {
            let item;
            if (type === 'testimonial') item = db.testimonials.find(t => t.id === id);
            if (type === 'course') item = db.courses.find(c => c.id === id);
            if (!item) return;

            const content = document.getElementById('detailContent');
            content.innerHTML = `
            ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.title}" onerror="this.style.display='none'">` : ''}
            <h3>${item.title}</h3>
            <p style="color:#888;font-size:0.75rem;letter-spacing:0.08em;margin-bottom:8px;">
              ${item.category || ''} ${item.date ? '· ' + item.date : ''} ${item.clientName ? '· ' + item.clientName : ''}
            </p>
            <p>${item.description}</p>
          `;
            document.getElementById('detailOverlay').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail(e) {
            if (e && e.target !== document.getElementById('detailOverlay')) return;
            document.getElementById('detailOverlay').classList.remove('open');
            document.body.style.overflow = '';
        }

        // ═══════════ 键盘快捷键 ═══════════
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeDetail();
                if (document.getElementById('searchInputWrap').classList.contains('open')) {
                    closeSearch();
                }
            }
            // Ctrl+K 或 / 触发搜索
            if ((e.ctrlKey && e.key === 'k') || (e.key === '/' && !e.ctrlKey && document.activeElement === document
                    .body)) {
                e.preventDefault();
                if (currentModule) toggleSearch();
            }
        });

        // ═══════════ 监听storage同步 ═══════════
        window.addEventListener('storage', function(e) {
            if (e.key === DATA_KEY && e.newValue) {
                try {
                    db = JSON.parse(e.newValue);
                    if (currentModule) {
                        renderSubPage();
                    }
                    renderHome();
                } catch (err) {}
            }
        });

        // ═══════════ 初始化 ═══════════
        function init() {
            renderHome();
            // 检查URL参数，支持直接跳转
            const params = new URLSearchParams(window.location.search);
            const mod = params.get('module');
            if (mod && db.modules.includes(mod)) {
                openModule(mod);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
