<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>易饰乾园素材库 · 文案资产系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2; --card-bg: #FFFFFF; --ink: #1a1815; --ink-light: #5c574f;
            --gold: #b8832a; --gold-pale: #f7f0e0; --border: rgba(0,0,0,0.06);
            --radius-sm: 10px; --radius-md: 18px; --radius-lg: 24px; --radius-full: 50px;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.04); --shadow-md: 0 8px 30px rgba(0,0,0,0.07);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);font-family:'Noto Sans SC',sans-serif;color:var(--ink);line-height:1.6;}
        .container{max-width:960px;margin:0 auto;padding:0 24px;}
        .hero{text-align:center;padding:72px 0 48px;}
        .hero-title{font-family:'Noto Serif SC',serif;font-size:2.8rem;font-weight:900;}
        .module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding-bottom:60px;}
        .module-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:32px 26px;cursor:pointer;transition:0.3s;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
        .module-card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,0.08);}
        .sub-header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 16px;position:sticky;top:3px;background:var(--bg);z-index:90;border-bottom:1px solid var(--border);}
        .angle-bar,.cat-tabs{display:flex;gap:8px;padding:16px 0;flex-wrap:wrap;}
        .angle-pill,.cat-tab{padding:7px 18px;border-radius:50px;background:var(--card-bg);border:1.5px solid var(--border);cursor:pointer;font-size:0.8rem;}
        .angle-pill.active,.cat-tab.active{background:var(--ink);color:#fff;}
        .card-grid,.media-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:10px 0 50px;}
        .copy-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:28px 24px;transition:0.3s;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
        .copy-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,0.08);}
        .copy-text{font-size:0.92rem;font-weight:300;line-height:1.9;white-space:pre-wrap;max-height:11.4em;overflow:hidden;}
        .copy-text.expanded{max-height:none;}
        .expand-btn{color:var(--gold);cursor:pointer;font-size:0.8rem;}
        .media-card{background:var(--card-bg);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:0.3s;cursor:pointer;}
        .media-card:hover{transform:translateY(-4px);}
        .media-card-image{width:100%;height:240px;background:#f0ede5;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;}
        .media-card-image img{width:100%;height:100%;object-fit:cover;}
        .media-card-body{padding:20px;}
        .media-card-body h3{font-size:1.1rem;margin-bottom:8px;}
        .media-card-body p{font-size:0.85rem;color:var(--ink-light);line-height:1.7;}
        .copy-btn{cursor:pointer;color:#888;padding:4px 8px;border-radius:6px;}
        .copy-btn:hover{color:var(--gold);background:var(--gold-pale);}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 24px;border-radius:30px;font-size:0.8rem;opacity:0;transition:0.3s;z-index:999;}
        .toast.show{opacity:1;}
        .empty-state{text-align:center;padding:60px 20px;color:#ccc;}
    </style>
</head>
<body>
<div id="homeView"><div class="container"><header class="hero"><h1 class="hero-title">易饰乾园素材库</h1></header><nav class="module-grid" id="moduleGrid"></nav></div></div>
<div id="subView" style="display:none;"><div class="container"><div class="sub-header"><div><button class="btn-back" onclick="goHome()">← 返回首页</button><h2 class="sub-title" id="subTitle">朋友圈</h2></div><div class="search-wrap"><input type="text" id="searchInput" placeholder="搜索…" oninput="doSearch()"></div></div><div class="angle-bar" id="angleBar"></div><div class="cat-tabs" id="catTabs"></div><div class="card-grid" id="cardGrid"></div><div class="media-card-grid" id="mediaCardGrid"></div><div class="empty-state" id="emptyState">暂无内容</div></div></div>
<a href="admin.html" class="admin-float" style="position:fixed;bottom:28px;right:28px;width:56px;height:56px;background:var(--ink);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;">⚙</a>
<div class="toast" id="toast"></div>

<script>
(function() {
const DATA_KEY = 'ysqy_data_v3';
const DEFAULT_DATA = {
  modules: ['朋友圈','客户见证','课程卖点'],
  angles: ['数字冲击','对话还原','情绪唤醒','场景反差','旁观者视角','预言式','时间轴','选择题','内幕揭秘','反常识','学员故事','身体感知','追问式','画面描写'],
  testimonialCategories: ['文昌','沙龙','成交','夫妻关系','身体健康','知识成长','见识提升'],
  courseCategories: ['核心价值','课程亮点','学员反馈'],
  posts: [
    {id:1,module:'朋友圈',angle:'数字冲击',text:'同样做室内设计，收入差距能有10倍\n靠颜感做方案的，改稿改到怀疑人生\n靠五行色彩做方案的，签单当天就定\n区别不在于谁更努力\n而在于那套判断客户的底层工具 🎯',time:1715000000000},
    {id:2,module:'朋友圈',angle:'对话还原',text:'客户上周说了一句话，我一直在想 💬\n她说：“你懂我”\n别人都在说方案，你在说我的生活\n五行色彩秒懂客户，教的就是这种眼光 👀',time:1714900000000}
  ],
  testimonials: [
    {id:101,module:'客户见证',category:'成交',imageUrl:'',videoUrl:'',title:'林女士 · 软装设计师',description:'学了五行色彩后，第一个月签单率提升40%。客户说“你懂我”，这种感觉太好了。以前总是猜测客户想要什么，现在一眼就能判断对方的五行属性，方案直接命中需求。',clientName:'林女士',date:'2024-05-15'},
    {id:102,module:'客户见证',category:'文昌',imageUrl:'',videoUrl:'',title:'张先生 · 企业主',description:'调整办公室文昌位后，团队效率明显提升，业绩稳步增长。以前总觉得办公室布局哪里不对，员工也抱怨压抑，现在整个气场都顺了。',clientName:'张先生',date:'2024-05-10'}
  ],
  courses: [
    {id:201,module:'课程卖点',category:'核心价值',imageUrl:'',videoUrl:'',title:'五行色彩诊断系统',description:'一套让设计师秒懂客户的底层工具，让签单变成自然结果。课程包含五行基础、色彩心理学、客户性格分析三大模块，学完即可用于实战。',date:'2024-05-01'},
    {id:202,module:'课程卖点',category:'课程亮点',imageUrl:'',videoUrl:'',title:'四天精华班 · 易学全案',description:'涵盖五行色彩、读像思维、经营根源、九运趋势四大模块，从判断到布局到落地，每步有据。',date:'2024-05-01'}
  ]
};

let db = (() => {
  let raw = localStorage.getItem(DATA_KEY);
  if (raw) { try { return JSON.parse(raw); } catch(e) {} }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
})();

// 确保数据结构兼容
if (!db.modules || !Array.isArray(db.modules)) db = JSON.parse(JSON.stringify(DEFAULT_DATA));
if (!db.posts) db.posts = [];
if (!db.testimonials) db.testimonials = [];
if (!db.courses) db.courses = [];
localStorage.setItem(DATA_KEY, JSON.stringify(db));

let currentModule = null, currentAngle = '全部', currentCategory = '全部', searchQuery = '';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1500);
}

function handleCopy(btn) {
  const text = btn.getAttribute('data-copy');
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => toast('已复制 ✓'));
}

function renderHome() {
  const grid = document.getElementById('moduleGrid');
  grid.innerHTML = db.modules.map(m => `<div class="module-card" onclick="openModule('${m}')"><div class="module-card-icon"><i class="fa-solid fa-folder"></i></div><div class="module-card-title">${m}</div></div>`).join('');
}

window.openModule = function(m) {
  currentModule = m; currentAngle = '全部'; currentCategory = '全部'; searchQuery = '';
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('subView').style.display = 'block';
  document.getElementById('subTitle').textContent = m;
  renderSubPage();
};

window.goHome = function() {
  document.getElementById('subView').style.display = 'none';
  document.getElementById('homeView').style.display = 'block';
};

function renderSubPage() {
  document.getElementById('angleBar').style.display = 'none';
  document.getElementById('catTabs').style.display = 'none';
  document.getElementById('cardGrid').style.display = 'none';
  document.getElementById('mediaCardGrid').style.display = 'none';
  if (currentModule === '朋友圈') {
    document.getElementById('angleBar').style.display = 'flex';
    document.getElementById('cardGrid').style.display = 'grid';
    renderMoments();
  } else if (currentModule === '客户见证') {
    document.getElementById('catTabs').style.display = 'flex';
    document.getElementById('mediaCardGrid').style.display = 'grid';
    renderWitness();
  } else if (currentModule === '课程卖点') {
    document.getElementById('catTabs').style.display = 'flex';
    document.getElementById('mediaCardGrid').style.display = 'grid';
    renderCourse();
  }
}

function renderMoments() {
  document.getElementById('angleBar').innerHTML = ['全部',...db.angles].map(a => `<span class="angle-pill ${currentAngle===a?'active':''}" onclick="setAngle('${a}')">${a}</span>`).join('');
  let filtered = db.posts.filter(p => p.module === '朋友圈');
  if (currentAngle !== '全部') filtered = filtered.filter(p => p.angle === currentAngle);
  if (searchQuery) filtered = filtered.filter(p => p.text.includes(searchQuery));
  const grid = document.getElementById('cardGrid');
  if (!filtered.length) { grid.innerHTML = '<div class="empty-state">暂无文案</div>'; return; }
  grid.innerHTML = filtered.map(p => {
    const lines = p.text.split('\n');
    const truncated = lines.length > 6;
    const displayText = truncated ? lines.slice(0,6).join('\n') : p.text;
    const copyData = p.text.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<div class="copy-card"><div class="copy-text${truncated?'':' expanded'}" id="t-${p.id}">${displayText.replace(/\n/g,'<br>')}${truncated?`<span class="expand-btn" onclick="event.stopPropagation();toggleExpand('${p.id}')">展开全文</span>`:''}</div><div class="card-meta"><span># ${p.angle}</span><span class="copy-btn" data-copy="${copyData}" onclick="event.stopPropagation();handleCopy(this)"><i class="fa-regular fa-clone"></i> 复制</span></div></div>`;
  }).join('');
}
window.toggleExpand = function(id) {
  const el = document.getElementById('t-'+id);
  el.classList.toggle('expanded');
  const btn = el.querySelector('.expand-btn');
  if (btn) btn.textContent = el.classList.contains('expanded') ? '收起' : '展开全文';
};
window.setAngle = function(a) { currentAngle = a; renderMoments(); };

function renderWitness() {
  document.getElementById('catTabs').innerHTML = ['全部',...db.testimonialCategories].map(c => `<span class="cat-tab ${currentCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</span>`).join('');
  let filtered = db.testimonials.filter(t => t.module === '客户见证');
  if (currentCategory !== '全部') filtered = filtered.filter(t => t.category === currentCategory);
  if (searchQuery) filtered = filtered.filter(t => t.title.includes(searchQuery) || t.description.includes(searchQuery));
  const grid = document.getElementById('mediaCardGrid');
  if (!filtered.length) { grid.innerHTML = '<div class="empty-state">暂无见证</div>'; return; }
  grid.innerHTML = filtered.map(t => {
    const copyData = (t.title + '\n' + t.description).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<div class="media-card" onclick="openDetail('testimonial',${t.id})"><div class="media-card-image" onclick="event.stopPropagation()">${t.imageUrl?`<img src="${t.imageUrl}">`:'<i class="fa-solid fa-image" style="font-size:3rem;color:#ccc;"></i>'}</div><div class="media-card-body"><h3>${t.title}</h3><p>${t.description}</p><span class="copy-btn" data-copy="${copyData}" onclick="event.stopPropagation();handleCopy(this)"><i class="fa-regular fa-clone"></i> 复制</span></div></div>`;
  }).join('');
}
window.setCategory = function(c) { currentCategory = c; renderSubPage(); };

function renderCourse() {
  document.getElementById('catTabs').innerHTML = ['全部',...db.courseCategories].map(c => `<span class="cat-tab ${currentCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</span>`).join('');
  let filtered = db.courses.filter(c => c.module === '课程卖点');
  if (currentCategory !== '全部') filtered = filtered.filter(c => c.category === currentCategory);
  if (searchQuery) filtered = filtered.filter(c => c.title.includes(searchQuery) || c.description.includes(searchQuery));
  const grid = document.getElementById('mediaCardGrid');
  if (!filtered.length) { grid.innerHTML = '<div class="empty-state">暂无内容</div>'; return; }
  grid.innerHTML = filtered.map(c => `<div class="media-card" onclick="openDetail('course',${c.id})"><div class="media-card-image" onclick="event.stopPropagation()">${c.imageUrl?`<img src="${c.imageUrl}">`:'<i class="fa-solid fa-image" style="font-size:3rem;color:#ccc;"></i>'}</div><div class="media-card-body"><h3>${c.title}</h3><p>${c.description}</p><span class="copy-btn" data-copy="${(c.title+'\\n'+c.description).replace(/&/g,'&amp;')}" onclick="event.stopPropagation();handleCopy(this)"><i class="fa-regular fa-clone"></i> 复制</span></div></div>`).join('');
}

window.doSearch = function() { searchQuery = document.getElementById('searchInput').value.trim(); renderSubPage(); };
window.openDetail = function(type, id) { /* 简单弹窗略，不影响主要功能 */ };

renderHome();
})();
</script>
</body>
</html>
