<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --bg: #F7F5F0;
  --ink: #1D1D1F;
  --gold: #C66A4E;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--ink); }

.hero {
  height: 100vh;
  background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=2000') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  position: relative;
}
.hero-content h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(3rem, 8vw, 5.5rem);
  margin-bottom: 16px;
}
.hero-content p { font-size: 1.3rem; opacity: 0.9; }

.modules {
  max-width: 1200px;
  margin: -80px auto 80px;
  padding: 0 40px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 24px;
}
.module-card {
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  transition: all 0.4s;
  cursor: pointer;
}
.module-card:hover {
  transform: translateY(-12px);
  box-shadow: 0 25px 50px rgba(198,106,78,0.15);
}
.module-card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
}
.module-card h3 {
  padding: 24px 24px 8px;
  font-size: 1.5rem;
}
.module-card p {
  padding: 0 24px 28px;
  color: #666;
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <h1>易饰乾园</h1>
    <p>极简文案资产 · 驱动品牌自然生长</p>
  </div>
</div>

<div class="modules">
  <div class="module-card" onclick="goToModule('friends')">
    <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?w=800" alt="朋友圈">
    <h3>朋友圈</h3>
    <p>高转化发圈文案库</p>
  </div>
  <div class="module-card" onclick="goToModule('testimonials')">
    <img src="https://images.unsplash.com/photo-1551836022-d5d88e9218df?w=800" alt="客户见证">
    <h3>客户见证</h3>
    <p>真实案例 · 信任背书</p>
  </div>
  <div class="module-card" onclick="goToModule('course')">
    <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=800" alt="课程卖点">
    <h3>课程卖点</h3>
    <p>核心价值 · 转化文案</p>
  </div>
</div>

<script>
function goToModule(page) {
  window.location.href = `${page}.html`;
}
</script>
</body>
</html>
