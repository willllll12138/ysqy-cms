<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>易饰乾园素材库 · 文案资产系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2;
            --card-bg: #FFFFFF;
            --ink: #1a1815;
            --ink-light: #5c574f;
            --gold: #b8832a;
            --gold-light: #d4a84b;
            --gold-pale: #f7f0e0;
            --bordeaux: #8b3a3a;
            --sage: #5a6b4d;
            --border: rgba(0,0,0,0.06);
            --border-strong: rgba(0,0,0,0.12);
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-full: 50px;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.07);
            --transition: 0.3s cubic-bezier(0.23,1,0.32,1);
            --font-serif: 'Noto Serif SC', 'Songti SC', serif;
            --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:var(--bg);
            font-family:var(--font-sans);
            color:var(--ink);
            line-height:1.6;
            min-height:100vh;
            -webkit-font-smoothing:antialiased;
        }
        body::before {
            content:''; position:fixed; top:0; left:0; right:0; height:3px;
            background:linear-gradient(90deg,var(--gold),var(--bordeaux),var(--sage));
            z-index:1000;
        }
        .container { max-width:900px; margin:0 auto; padding:0 24px; }
        .hero { text-align:center; padding:72px 0 48px; }
        .hero-tag { display:inline-block; font-size:0.7rem; letter-spacing:0.35em; color:var(--gold); background:var(--gold-pale); padding:6px 18px; border-radius:var(--radius-full); margin-bottom:16px; font-weight:500; }
        .hero-title { font-family:var(--font-serif); font-size:2.8rem; font-weight:900; letter-spacing:0.06em; color:var(--ink); margin-bottom:8px; line-height:1.2; }
        .hero-subtitle { font-size:0.9rem; color:var(--ink-light); font-weight:300; letter-spacing:0.15em; }
        .hero-line { width:50px; height:2px; background:var(--gold); margin:20px auto 0; border-radius:2px; }
        .module-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; padding-bottom:60px; }
        .module-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:32px 26px 26px; cursor:pointer; transition:var(--transition); border:1px solid var(--border); text-decoration:none; color:inherit; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow-sm); }
        .module-card:hover { transform:translateY(-6px); box-shadow:0 20px 40px rgba(0,0,0,0.08); border-color:var(--border-strong); }
        .module-card-icon { font-size:1.8rem; color:var(--gold); }
        .module-card-title { font-family:var(--font-serif); font-size:1.3rem; font-weight:700; letter-spacing:0.04em; }
        .module-card-desc { font-size:0.8rem; color:var(--ink-light); }
        .module-card-arrow { align-self:flex-end; color:#ccc; }
        .sub-header { display:flex; align-items:center; justify-content:space-between; padding:24px 0 16px; gap:12px; flex-wrap:wrap; position:sticky; top:3px; background:var(--bg); z-index:90; border-bottom:1px solid var(--border); }
        .sub-title-area { display:flex; align-items:center; gap:12px; }
        .sub-title { font-family:var(--font-serif); font-size:1.6rem; font-weight:700; }
        .btn-back { display:inline-flex; align-items:center; gap:6px; background:#eae6dc; color:var(--ink-light); padding:7px 14px; border-radius:var(--radius-full); font-size:0.73rem; letter-spacing:0.06em; cursor:pointer; text-decoration:none; transition:var(--transition); white-space:nowrap; border:none; font-family:inherit; }
        .btn-back:hover { background:#ddd8cc; color:var(--ink); }
        .search-wrap { position:relative; display:flex; align-items:center; }
        .search-toggle { width:38px; height:38px; border-radius:50%; background:var(--card-bg); border:1px solid var(--border); cursor:pointer; font-size:1rem; color:var(--ink-light); display:flex; align-items:center; justify-content:center; transition:var(--transition); }
        .search-toggle:hover { color:var(--gold); border-color:var(--gold); }
        .search-input-wrap { position:absolute; right:0; top:50%; transform:translateY(-50%); width:0; overflow:hidden; transition:var(--transition); background:var(--card-bg); border-radius:var(--radius-full); display:flex; align-items:center; }
        .search-input-wrap.open { width:240px; border:1px solid var(--border-strong); box-shadow:var(--shadow-md); }
        .search-input-wrap input { width:100%; padding:9px 38px 9px 16px; border:none; background:transparent; font-size:0.82rem; font-family:inherit; outline:none; }
        .search-input-wrap .search-close { position:absolute; right:6px; cursor:pointer; color:#aaa; padding:6px; }
        .angle-bar { display:flex; gap:8px; padding:16px 0; flex-wrap:wrap; }
        .angle-pill { padding:7px 18px; border-radius:var(--radius-full); background:var(--card-bg); border:1.5px solid var(--border); cursor:pointer; font-size:0.8rem; transition:var(--transition); color:var(--ink-light); }
        .angle-pill.active { background:var(--ink); color:#fff; border-color:var(--ink); font-weight:500; }
        .cat-tabs { display:flex; gap:8px; flex-wrap:wrap; padding:14px 0; border-bottom:1px solid var(--border); margin-bottom:4px; }
        .cat-tab { padding:7px 16px; border-radius:var(--radius-full); cursor:pointer; font-size:0.76rem; letter-spacing:0.05em; background:transparent; color:var(--ink-light); border:1.5px solid transparent; transition:var(--transition); }
        .cat-tab.active { background:var(--ink); color:#fff; font-weight:500; }
        .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; padding:10px 0 50px; }
        .copy-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:26px 24px; transition:var(--transition); border:1px solid var(--border); display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow-sm); }
        .copy-card:hover { transform:translateY(-4px); box-shadow:0 16px 40px rgba(0,0,0,0.08); }
        .copy-text { font-size:0.92rem; font-weight:300; line-height:1.9; white-space:pre-wrap; position:relative; }
        .copy-text.truncated { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
        .copy-text .expand-btn { color:var(--gold); cursor:pointer; font-size:0.8rem; margin-top:4px; display:inline-block; }
        .card-meta { display:flex; justify-content:space-between; align-items:center; font-size:0.7rem; color:#aaa; }
        .copy-btn { cursor:pointer; color:#888; transition:var(--transition); padding:4px 8px; border-radius:6px; }
        .copy-btn:hover { color:var(--gold); background:var(--gold-pale); }
        .testimonial-list { display:flex; flex-direction:column; gap:2px; padding-bottom:50px; }
        .testimonial-item { display:flex; gap:16px; align-items:flex-start; padding:16px 18px; background:var(--card-bg); border-bottom:1px solid var(--border); transition:var(--transition); cursor:pointer; }
        .testimonial-item:hover { background:#fdfbf5; }
        .testimonial-thumb { width:64px; height:64px; border-radius:var(--radius-sm); overflow:hidden; flex-shrink:0; background:#f0ede5; display:flex; align-items:center; justify-content:center; color:#ccc; font-size:1.4rem; position:relative; cursor:zoom-in; }
        .testimonial-thumb img { width:100%; height:100%; object-fit:cover; }
        .testimonial-info { flex:1; min-width:0; }
        .testimonial-info h4 { font-size:0.9rem; font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
        .testimonial-info p { font-size:0.78rem; color:var(--ink-light); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .testimonial-meta { font-size:0.68rem; color:#bbb; margin-top:4px; display:flex; gap:8px; align-items:center; }
        .testimonial-cat { background:var(--gold-pale); color:var(--gold); padding:2px 8px; border-radius:var(--radius-full); font-size:0.65rem; }
        .admin-float { position:fixed; bottom:28px; right:28px; width:56px; height:56px; background:var(--ink); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:998; box-shadow:0 8px 28px rgba(0,0,0,0.25); font-size:1.3rem; transition:0.2s; text-decoration:none; }
        .admin-float:hover { background:#2b2b2b; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(14px); background:var(--ink); color:#fff; padding:10px 24px; border-radius:var(--radius-full); font-size:0.8rem; letter-spacing:0.06em; opacity:0; transition:0.3s; pointer-events:none; z-index:999; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s; }
        .lightbox.open { opacity:1; pointer-events:auto; }
        .lightbox img, .lightbox video { max-width:90%; max-height:85vh; border-radius:12px; }
        .lightbox .close-lightbox { position:absolute; top:20px; right:30px; color:#fff; font-size:2rem; cursor:pointer; }
        .detail-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:1500; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s; }
        .detail-modal-overlay.open { opacity:1; pointer-events:auto; }
        .detail-modal { background:#fff; border-radius:var(--radius-lg); padding:32px 28px; max-width:600px; width:90%; max-height:85vh; overflow-y:auto; position:relative; }
        .detail-modal .close-btn { position:absolute; top:16px; right:16px; font-size:1.2rem; cursor:pointer; }
        .empty-state { text-align:center; padding:60px 20px; color:#ccc; }
        @media (max-width:680px) {
            .hero-title { font-size:2rem; }
        }
    </style>
</head>
<body>
    <!-- 首页视图 -->
    <div id="homeView">
        <div class="container">
            <header class="hero">
                <div class="hero-tag">YISHI QIANYUAN</div>
                <h1 class="hero-title">易饰乾园素材库</h1>
                <p class="hero-subtitle">极简文案资产 · 驱动品牌自然生长</p>
                <div class="hero-line"></div>
            </header>
            <nav class="module-grid" id="moduleGrid"></nav>
        </div>
    </div>

    <!-- 二级页面视图 -->
    <div id="subView" style="display:none;">
        <div class="container">
            <div class="sub-header">
                <div class="sub-title-area">
                    <button class="btn-back" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> 返回首页</button>
                    <h2 class="sub-title" id="subTitle">朋友圈</h2>
                </div>
                <div class="search-wrap" id="searchWrap">
                    <button class="search-toggle" onclick="toggleSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <div class="search-input-wrap" id="searchInputWrap">
                        <input type="text" id="searchInput" placeholder="搜索内容…" oninput="doSearch()">
                        <span class="search-close" onclick="closeSearch()"><i class="fa-solid fa-xmark"></i></span>
                    </div>
                </div>
            </div>
            <div class="angle-bar" id="angleBar"></div>
            <div class="cat-tabs" id="catTabs"></div>
            <div class="card-grid" id="cardGrid"></div>
            <div class="testimonial-list" id="testimonialList"></div>
            <div class="empty-state" id="emptyState">暂无内容</div>
        </div>
    </div>

    <!-- 管理后台入口 -->
    <a href="admin.html" class="admin-float" title="管理后台"><i class="fa-solid fa-sliders"></i></a>

    <!-- 灯箱（图片/视频放大） -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        <div id="lightboxContent"></div>
    </div>
    <!-- 详情弹窗 -->
    <div class="detail-modal-overlay" id="detailOverlay" onclick="closeDetail(event)">
        <div class="detail-modal" id="detailModal" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i></span>
            <div id="detailContent"></div>
        </div>
    </div>
    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const DATA_KEY = 'ysqy_data_v3';
            const DEFAULT_DATA = {
                modules: ['朋友圈','客户见证','课程卖点'],
                angles: ['数字冲击','对话还原','情绪唤醒','场景反差','旁观者视角','预言式','时间轴','选择题','内幕揭秘','反常识','学员故事','身体感知','追问式','画面描写'],
                testimonialCategories: ['文昌','沙龙','成交','夫妻关系','身体健康','知识成长','见识提升'],
                courseCategories: ['核心价值','课程亮点','学员反馈'],
                posts: [
                    {id:1,module:'朋友圈',angle:'数字冲击',text:'同样做室内设计，收入差距能有10倍 📊\n靠颜感做方案的，改稿改到怀疑人生\n靠五行色彩做方案的，签单当天就定\n区别不在于谁更努力\n而在于那套判断客户的底层工具 🎯',time:1715000000000},
                    {id:2,module:'朋友圈',angle:'对话还原',text:'客户上周说了一句话，我一直在想 💬\n她说："你懂我"\n别人都在说方案，你在说我的生活\n五行色彩秒懂客户，教的就是这种眼光 👀',time:1714900000000}
                ],
                testimonials: [
                    {id:101,module:'客户见证',category:'成交',imageUrl:'',videoUrl:'',title:'林女士 · 软装设计师',description:'学了五行色彩后，第一个月签单率提升40%。客户说"你懂我"，这种感觉太好了。',clientName:'林女士',date:'2024-05-15'},
                    {id:102,module:'客户见证',category:'文昌',imageUrl:'',videoUrl:'',title:'张先生 · 企业主',description:'调整办公室文昌位后，团队效率明显提升，业绩稳步增长。',clientName:'张先生',date:'2024-05-10'}
                ],
                courses: [
                    {id:201,module:'课程卖点',category:'核心价值',imageUrl:'',videoUrl:'',title:'五行色彩诊断系统',description:'一套让设计师秒懂客户的底层工具，让签单变成自然结果。',date:'2024-05-01'},
                    {id:202,module:'课程卖点',category:'课程亮点',imageUrl:'',videoUrl:'',title:'四天精华班 · 易学全案',description:'涵盖五行色彩、读像思维、经营根源、九运趋势四大模块。',date:'2024-05-01'}
                ]
            };
            let db = JSON.parse(localStorage.getItem(DATA_KEY) || 'null');
            if(!db||!db.modules){ db=JSON.parse(JSON.stringify(DEFAULT_DATA)); localStorage.setItem(DATA_KEY,JSON.stringify(db)); }
            let currentModule=null, currentAngle='全部', currentCategory='全部', searchQuery='';

            function save(){ localStorage.setItem(DATA_KEY,JSON.stringify(db)); }
            function toast(msg){ 
                const t=document.getElementById('toast'); 
                t.textContent=msg; t.classList.add('show'); 
                clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1500); 
            }

            // ── 全局复制功能（基于 data-copy 属性）──
            document.body.addEventListener('click', function(e) {
                const btn = e.target.closest('.copy-btn');
                if (!btn) return;
                const text = btn.getAttribute('data-copy');
                if (text) {
                    navigator.clipboard.writeText(text).then(() => {
                        toast('已复制 ✓');
                    }).catch(() => {
                        const textarea = document.createElement('textarea');
                        textarea.value = text;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        toast('已复制 ✓');
                    });
                }
            });

            // ── URL Hash 状态管理 ──
            function updateHash() {
                if (!currentModule) {
                    history.replaceState(null, '', ' ');
                    return;
                }
                const parts = [encodeURIComponent(currentModule)];
                if (currentAngle && currentAngle !== '全部') parts.push('angle=' + encodeURIComponent(currentAngle));
                if (currentCategory && currentCategory !== '全部') parts.push('cat=' + encodeURIComponent(currentCategory));
                if (searchQuery) parts.push('q=' + encodeURIComponent(searchQuery));
                history.replaceState(null, '', '#' + parts.join('&'));
            }

            function restoreFromHash() {
                const hash = location.hash.substring(1);
                if (!hash) return false;
                const parts = hash.split('&');
                let module = null, angle = '全部', cat = '全部', q = '';
                for (const part of parts) {
                    if (part.includes('=')) {
                        const [key, val] = part.split('=');
                        if (key === 'angle') angle = decodeURIComponent(val);
                        else if (key === 'cat') cat = decodeURIComponent(val);
                        else if (key === 'q') q = decodeURIComponent(val);
                    } else {
                        module = decodeURIComponent(part);
                    }
                }
                if (module && db.modules.includes(module)) {
                    currentModule = module;
                    currentAngle = angle;
                    currentCategory = cat;
                    searchQuery = q;
                    document.getElementById('searchInput').value = q;
                    if (q) document.getElementById('searchInputWrap').classList.add('open');
                    document.getElementById('homeView').style.display = 'none';
                    document.getElementById('subView').style.display = 'block';
                    document.getElementById('subTitle').textContent = module;
                    renderSubPage();
                    return true;
                }
                return false;
            }

            // 监听浏览器前进/后退
            window.addEventListener('popstate', function() {
                if (!restoreFromHash()) {
                    goHome(true);
                }
            });

            // 渲染首页模块
            function renderHome(){
                const grid=document.getElementById('moduleGrid');
                const icons={'朋友圈':'fa-pen-to-square','客户见证':'fa-comments','课程卖点':'fa-graduation-cap'};
                grid.innerHTML=db.modules.map(m=>`
                    <div class="module-card" onclick="openModule('${m}')">
                        <div class="module-card-icon"><i class="fa-solid ${icons[m]||'fa-folder'}"></i></div>
                        <div class="module-card-title">${m}</div>
                        <div class="module-card-desc">点击查看内容</div>
                        <div class="module-card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                    </div>`).join('');
            }

            window.openModule=function(m){
                currentModule=m; currentAngle='全部'; currentCategory='全部'; searchQuery='';
                document.getElementById('searchInput').value='';
                document.getElementById('searchInputWrap').classList.remove('open');
                document.getElementById('homeView').style.display='none';
                document.getElementById('subView').style.display='block';
                document.getElementById('subTitle').textContent=m;
                renderSubPage(); 
                updateHash();
                window.scrollTo(0,0);
            };

            window.goHome=function(silent){
                // silent 参数用于避免重复写入历史记录
                currentModule=null;
                document.getElementById('subView').style.display='none';
                document.getElementById('homeView').style.display='block';
                renderHome(); 
                if (!silent) updateHash();
                window.scrollTo(0,0);
            };

            function renderSubPage(){
                if(!currentModule)return;
                const isMoments=currentModule==='朋友圈';
                const isTest=currentModule==='客户见证';
                const isCourse=currentModule==='课程卖点';
                document.getElementById('angleBar').style.display=isMoments?'flex':'none';
                document.getElementById('catTabs').style.display=(isTest||isCourse)?'flex':'none';
                document.getElementById('cardGrid').style.display=isMoments?'grid':'none';
                document.getElementById('testimonialList').style.display=(isTest||isCourse)?'flex':'none';
                if(isMoments) renderMoments();
                if(isTest) renderTestimonials();
                if(isCourse) renderCourses();
                updateHash();
            }

            function renderMoments(){
                const angleBar=document.getElementById('angleBar');
                angleBar.innerHTML=['全部',...db.angles].map(a=>`<span class="angle-pill ${currentAngle===a?'active':''}" onclick="setAngle('${a}')">${a}</span>`).join('');
                let filtered=db.posts.filter(p=>p.module==='朋友圈');
                if(currentAngle!=='全部') filtered=filtered.filter(p=>p.angle===currentAngle);
                if(searchQuery) filtered=filtered.filter(p=>p.text.includes(searchQuery)||p.angle.includes(searchQuery));
                const grid=document.getElementById('cardGrid');
                if(!filtered.length){grid.innerHTML='<div class="empty-state">暂无文案</div>';return;}

                grid.innerHTML=filtered.map(p=>{
                    const lines=p.text.split('\n');
                    const truncated=lines.length>4;
                    const displayText=truncated?lines.slice(0,4).join('\n')+'...':p.text;
                    const copyText = p.text.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    return `<div class="copy-card">
                        <div class="copy-text${truncated?' truncated':''}" id="text-${p.id}">${displayText.replace(/\n/g,'<br>')}
                        ${truncated?`<span class="expand-btn" onclick="event.stopPropagation();toggleExpand('text-${p.id}','${p.text.replace(/\n/g,'\\n').replace(/'/g,"\\'")}')">展开全文</span>`:''}
                        </div>
                        <div class="card-meta">
                            <span># ${p.angle}</span>
                            <span class="copy-btn" data-copy="${copyText}"><i class="fa-regular fa-clone"></i> 复制</span>
                        </div>
                    </div>`;
                }).join('');
            }

            window.toggleExpand=function(id,fullText){
                const el=document.getElementById(id);
                if(el.classList.contains('truncated')){
                    el.classList.remove('truncated');
                    el.innerHTML=fullText.replace(/\\n/g,'<br>')+' <span class="expand-btn" onclick="event.stopPropagation();toggleExpand(\''+id+'\',\''+fullText+'\')">收起</span>';
                }else{
                    const lines=fullText.split('\\n');
                    el.classList.add('truncated');
                    el.innerHTML=lines.slice(0,4).join('<br>')+'... <span class="expand-btn" onclick="event.stopPropagation();toggleExpand(\''+id+'\',\''+fullText+'\')">展开全文</span>';
                }
            };

            window.setAngle=function(a){ 
                currentAngle=a; 
                renderMoments(); 
                updateHash();
            };

            function renderMediaHTML(item){
                if(item.videoUrl&&item.videoUrl.trim()){
                    return `<iframe src="${item.videoUrl}" frameborder="0" allowfullscreen style="width:100%;height:100%;"></iframe>`;
                }
                if(item.imageUrl&&item.imageUrl.trim()){
                    return `<img src="${item.imageUrl}" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\'fa-solid fa-image\\'></i>'">`;
                }
                return '<i class="fa-solid fa-image"></i>';
            }

            function renderTestimonials(){
                const catTabs=document.getElementById('catTabs');
                catTabs.innerHTML=['全部',...db.testimonialCategories].map(c=>`<span class="cat-tab ${currentCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</span>`).join('');
                let filtered=db.testimonials.filter(t=>t.module==='客户见证');
                if(currentCategory!=='全部') filtered=filtered.filter(t=>t.category===currentCategory);
                if(searchQuery) filtered=filtered.filter(t=>t.title.includes(searchQuery)||t.description.includes(searchQuery));
                const list=document.getElementById('testimonialList');
                if(!filtered.length){list.innerHTML='<div class="empty-state">暂无见证</div>';return;}

                list.innerHTML=filtered.map(t=>{
                    const copyText = (t.title + '\n' + t.description).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    return `<div class="testimonial-item" onclick="openDetail('testimonial',${t.id})">
                        <div class="testimonial-thumb" onclick="event.stopPropagation();openLightbox('${t.imageUrl||''}','${t.videoUrl||''}')">${renderMediaHTML(t)}</div>
                        <div class="testimonial-info">
                            <h4>${t.title} <span class="copy-btn" data-copy="${copyText}" onclick="event.stopPropagation();"><i class="fa-regular fa-clone"></i></span></h4>
                            <p>${t.description}</p>
                            <div class="testimonial-meta"><span class="testimonial-cat">${t.category}</span> ${t.date||''} ${t.clientName||''}</div>
                        </div>
                    </div>`;
                }).join('');
            }

            function renderCourses(){
                const catTabs=document.getElementById('catTabs');
                catTabs.innerHTML=['全部',...db.courseCategories].map(c=>`<span class="cat-tab ${currentCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</span>`).join('');
                let filtered=db.courses.filter(c=>c.module==='课程卖点');
                if(currentCategory!=='全部') filtered=filtered.filter(c=>c.category===currentCategory);
                if(searchQuery) filtered=filtered.filter(c=>c.title.includes(searchQuery)||c.description.includes(searchQuery));
                const list=document.getElementById('testimonialList');
                if(!filtered.length){list.innerHTML='<div class="empty-state">暂无内容</div>';return;}

                list.innerHTML=filtered.map(c=>{
                    const copyText = (c.title + '\n' + c.description).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    return `<div class="testimonial-item" onclick="openDetail('course',${c.id})">
                        <div class="testimonial-thumb" onclick="event.stopPropagation();openLightbox('${c.imageUrl||''}','${c.videoUrl||''}')">${renderMediaHTML(c)}</div>
                        <div class="testimonial-info">
                            <h4>${c.title} <span class="copy-btn" data-copy="${copyText}" onclick="event.stopPropagation();"><i class="fa-regular fa-clone"></i></span></h4>
                            <p>${c.description}</p>
                            <div class="testimonial-meta"><span class="testimonial-cat">${c.category}</span> ${c.date||''}</div>
                        </div>
                    </div>`;
                }).join('');
            }

            window.setCategory=function(c){ 
                currentCategory=c; 
                if(currentModule==='客户见证') renderTestimonials(); 
                else if(currentModule==='课程卖点') renderCourses(); 
                updateHash();
            };

            window.toggleSearch=function(){
                const wrap=document.getElementById('searchInputWrap');
                if(wrap.classList.contains('open')){ closeSearch(); }else{ wrap.classList.add('open'); setTimeout(()=>document.getElementById('searchInput').focus(),200); }
            };
            window.closeSearch=function(){
                document.getElementById('searchInputWrap').classList.remove('open');
                document.getElementById('searchInput').value='';
                searchQuery=''; 
                renderSubPage();
            };
            window.doSearch=function(){ 
                searchQuery=document.getElementById('searchInput').value.trim(); 
                renderSubPage(); 
            };

            window.openLightbox=function(img,video){
                const lb=document.getElementById('lightbox');
                const content=document.getElementById('lightboxContent');
                if(video){
                    content.innerHTML=`<iframe src="${video}" frameborder="0" allowfullscreen style="width:80vw;height:60vh;"></iframe>`;
                }else if(img){
                    content.innerHTML=`<img src="${img}" onerror="this.style.display='none';this.parentElement.innerHTML='<p style=color:#fff>图片加载失败</p>'">`;
                }else return;
                lb.classList.add('open');
            };
            window.closeLightbox=function(){ document.getElementById('lightbox').classList.remove('open'); };

            window.openDetail=function(type,id){
                let item;
                if(type==='testimonial') item=db.testimonials.find(t=>t.id===id);
                if(type==='course') item=db.courses.find(c=>c.id===id);
                if(!item) return;
                const content=document.getElementById('detailContent');
                const copyText = (item.title + '\n' + item.description).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                content.innerHTML=`
                    ${item.videoUrl?`<iframe src="${item.videoUrl}" frameborder="0" allowfullscreen style="width:100%;height:300px;"></iframe>`:
                    (item.imageUrl?`<img src="${item.imageUrl}" style="width:100%;border-radius:12px;" onclick="openLightbox('${item.imageUrl}','')">`:'')}
                    <h3 style="margin:16px 0 8px;">${item.title}</h3>
                    <p style="color:#888;font-size:0.8rem;">${item.category||''} ${item.date||''} ${item.clientName||''}</p>
                    <p style="white-space:pre-wrap;line-height:1.8;">${item.description}</p>
                    <button class="copy-btn" data-copy="${copyText}" onclick="event.stopPropagation();"><i class="fa-regular fa-clone"></i> 复制文案</button>
                `;
                document.getElementById('detailOverlay').classList.add('open');
                document.body.style.overflow='hidden';
            };
            window.closeDetail=function(e){
                if(e && e.target !== document.getElementById('detailOverlay')) return;
                document.getElementById('detailOverlay').classList.remove('open');
                document.body.style.overflow='';
            };

            // 监听 storage 同步
            window.addEventListener('storage',(e)=>{
                if(e.key===DATA_KEY && e.newValue){
                    db=JSON.parse(e.newValue);
                    if(currentModule) renderSubPage();
                    renderHome();
                }
            });

            document.addEventListener('keydown',e=>{
                if(e.key==='Escape'){
                    closeDetail();
                    closeLightbox();
                }
            });

            // 启动：先尝试从 hash 恢复，否则显示首页
            if (!restoreFromHash()) {
                renderHome();
            }
        })();
    </script>
</body>
</html>
