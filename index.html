<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园 · 文案资产库</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F7F5F0;
            --card: #FFFFFF;
            --ink: #1D1D1F;
            --terracotta: #C66A4E;
            --sage: #849688;
            --border: rgba(0,0,0,0.08);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--ink);
            line-height: 1.8;
        }
        .header {
            padding: 100px 40px 60px;
            text-align: center;
            background: linear-gradient(to bottom, #F7F5F0, rgba(247,245,240,0.98));
        }
        .title {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(3rem, 8vw, 5rem);
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .subtitle { font-size: 1.15rem; opacity: 0.7; }

        .tabs {
            display: flex; justify-content: center; gap: 40px; margin: 50px 0 20px;
            border-bottom: 1px solid var(--border); flex-wrap: wrap;
        }
        .tab {
            padding: 15px 0; font-size: 1.2rem; cursor: pointer;
            position: relative; transition: all 0.4s ease;
        }
        .tab.active {
            color: var(--terracotta);
            font-weight: 500;
        }
        .tab.active::after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 3px;
            background: var(--terracotta);
        }

        .angle-bar {
            display: flex; gap: 12px; padding: 20px 40px; overflow-x: auto;
            background: rgba(247,245,240,0.95); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100; scrollbar-width: none;
        }
        .pill {
            padding: 10px 28px; border-radius: 50px; background: white;
            border: 1px solid var(--border); white-space: nowrap; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
        }
        .pill:hover { transform: translateY(-2px); }
        .pill.active {
            background: var(--ink); color: white; border-color: var(--ink);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 32px;
            padding: 40px;
        }
        .card {
            background: var(--card);
            border-radius: 28px;
            padding: 42px 36px;
            transition: all 0.6s cubic-bezier(0.23,1,0.32,1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .card:hover {
            transform: translateY(-16px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.12);
        }
        .copy-text {
            font-size: 1.18rem;
            line-height: 1.9;
            margin-bottom: 30px;
            white-space: pre-wrap;
        }
        .meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.9rem; color: #666;
        }
        .admin-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 70px; height: 70px; background: var(--ink); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; cursor: pointer; box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            z-index: 999; transition: all 0.3s;
        }
        .admin-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body>

<div class="header">
    <div style="letter-spacing:0.5em; font-size:0.9rem; opacity:0.6;">YISHI QIANYUAN</div>
    <h1 class="title">易饰乾园</h1>
    <p class="subtitle">极简文案资产库 · 驱动品牌自然生长</p>
    <div class="tabs" id="module-tabs"></div>
</div>

<div class="angle-bar" id="angle-bar"></div>

<main class="grid" id="card-grid"></main>

<div class="admin-btn" onclick="window.open('admin.html','_blank')">
    <i class="fa-solid fa-gear"></i>
</div>

<script>
// 配置
const BIN_ID = 'YOUR_BIN_ID';
const MASTER_KEY = 'YOUR_MASTER_KEY';

let db = { modules: ["朋友圈", "课程手册", "品牌故事"], angles: ["数字冲击", "对话还原", "情绪唤醒", "场景反差"], posts: [] };
let currentModule = "朋友圈";
let currentAngle = "全部";

async function loadData() {
    if (BIN_ID === 'YOUR_BIN_ID') {
        renderAll();
        return;
    }
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
        db = (await res.json()).record || db;
    } catch(e) {}
    renderAll();
}

function renderAll() {
    renderModules();
    renderAngles();
    renderCards();
}

function renderModules() {
    const container = document.getElementById('module-tabs');
    container.innerHTML = db.modules.map(m => `
        <div class="tab ${currentModule === m ? 'active' : ''}" onclick="setModule('${m}')">${m}</div>
    `).join('');
}

function renderAngles() {
    const container = document.getElementById('angle-bar');
    const list = ["全部", ...db.angles];
    container.innerHTML = list.map(a => `
        <div class="pill ${currentAngle === a ? 'active' : ''}" onclick="setAngle('${a}')">${a}</div>
    `).join('');
}

function renderCards() {
    const container = document.getElementById('card-grid');
    let filtered = db.posts.filter(p => p.module === currentModule);
    if (currentAngle !== "全部") filtered = filtered.filter(p => p.angle === currentAngle);

    if (filtered.length === 0) {
        container.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:120px;opacity:0.5;font-size:1.2rem;">暂无文案，点击右下角齿轮进入后台发布</p>`;
        return;
    }

    container.innerHTML = filtered.map((p, i) => `
        <div class="card">
            <div class="copy-text">${p.text}</div>
            <div class="meta">
                <span># ${p.angle}</span>
                <i class="fa-regular fa-copy" style="cursor:pointer;font-size:1.3rem;" onclick="copyText('${p.text.replace(/\n/g, '\\n')}')"></i>
            </div>
        </div>
    `).join('');
}

function copyText(text) {
    navigator.clipboard.writeText(text.replace(/\\n/g, '\n')).then(() => alert('✅ 已复制到剪贴板'));
}

function setModule(m) { currentModule = m; currentAngle = "全部"; renderAll(); }
function setAngle(a) { currentAngle = a; renderAll(); }

window.onload = loadData;
</script>
</body>
</html>
