<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>易饰乾园素材库 · 文案资产系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2; --card-bg: #FFFFFF; --ink: #1a1815; --ink-light: #5c574f;
            --gold: #b8832a; --gold-pale: #f7f0e0; --border: rgba(0,0,0,0.06);
            --border-strong: rgba(0,0,0,0.12); --radius-sm: 10px; --radius-md: 18px;
            --radius-lg: 24px; --radius-full: 50px; --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.07); --transition: 0.2s ease;
            --font-serif: 'Noto Serif SC', 'Songti SC', serif; --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); font-family:var(--font-sans); color:var(--ink); line-height:1.6; min-height:100vh; }
        body::before { content:''; position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--gold),#8b3a3a,#5a6b4d); z-index:1000; }
        .container { max-width:960px; margin:0 auto; padding:0 24px; }
        .hero { text-align:center; padding:72px 0 48px; }
        .hero-tag { display:inline-block; font-size:0.7rem; letter-spacing:0.35em; color:var(--gold); background:var(--gold-pale); padding:6px 18px; border-radius:var(--radius-full); margin-bottom:16px; font-weight:500; }
        .hero-title { font-family:var(--font-serif); font-size:2.8rem; font-weight:900; letter-spacing:0.06em; color:var(--ink); margin-bottom:8px; line-height:1.2; }
        .hero-subtitle { font-size:0.9rem; color:var(--ink-light); font-weight:300; letter-spacing:0.15em; }
        .hero-line { width:50px; height:2px; background:var(--gold); margin:20px auto 0; border-radius:2px; }
        .module-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; padding-bottom:60px; }
        .module-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:32px 26px 26px; cursor:pointer; transition:var(--transition); border:1px solid var(--border); text-decoration:none; color:inherit; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow-sm); position:relative; }
        .module-card:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,0.06); border-color:var(--border-strong); }
        .module-card.locked::after { content:'🔒'; position:absolute; top:12px; right:16px; font-size:1.2rem; opacity:0.6; }
        .module-card-icon { font-size:1.8rem; color:var(--gold); }
        .module-card-title { font-family:var(--font-serif); font-size:1.3rem; font-weight:700; letter-spacing:0.04em; }
        .module-card-desc { font-size:0.8rem; color:var(--ink-light); }
        .module-card-arrow { align-self:flex-end; color:#ccc; }
        .sub-header { display:flex; align-items:center; justify-content:space-between; padding:24px 0 16px; gap:12px; flex-wrap:wrap; position:sticky; top:3px; background:var(--bg); z-index:90; border-bottom:1px solid var(--border); }
        .sub-title-area { display:flex; align-items:center; gap:12px; }
        .sub-title { font-family:var(--font-serif); font-size:1.6rem; font-weight:700; }
        .btn-back { display:inline-flex; align-items:center; gap:6px; background:#eae6dc; color:var(--ink-light); padding:7px 14px; border-radius:var(--radius-full); font-size:0.73rem; letter-spacing:0.06em; cursor:pointer; text-decoration:none; transition:var(--transition); white-space:nowrap; border:none; font-family:inherit; }
        .btn-back:hover { background:#ddd8cc; color:var(--ink); }
        .search-wrap { position:relative; display:flex; align-items:center; gap:8px; }
        .sort-btn { width:38px; height:38px; border-radius:50%; background:var(--card-bg); border:1px solid var(--border); cursor:pointer; font-size:0.9rem; color:var(--ink-light); display:flex; align-items:center; justify-content:center; transition:var(--transition); }
        .sort-btn:hover { color:var(--gold); border-color:var(--gold); }
        .search-toggle { width:38px; height:38px; border-radius:50%; background:var(--card-bg); border:1px solid var(--border); cursor:pointer; font-size:1rem; color:var(--ink-light); display:flex; align-items:center; justify-content:center; transition:var(--transition); }
        .search-toggle:hover { color:var(--gold); border-color:var(--gold); }
        .search-input-wrap { position:absolute; right:0; top:50%; transform:translateY(-50%); width:0; overflow:hidden; transition:var(--transition); background:var(--card-bg); border-radius:var(--radius-full); display:flex; align-items:center; }
        .search-input-wrap.open { width:240px; border:1px solid var(--border-strong); box-shadow:var(--shadow-md); }
        .search-input-wrap input { width:100%; padding:9px 38px 9px 16px; border:none; background:transparent; font-size:0.82rem; font-family:inherit; outline:none; }
        .search-input-wrap .search-close { position:absolute; right:6px; cursor:pointer; color:#aaa; padding:6px; }
        .angle-bar, .cat-tabs { display:flex; gap:8px; padding:16px 0; flex-wrap:wrap; }
        .angle-pill, .cat-tab { padding:7px 18px; border-radius:var(--radius-full); background:var(--card-bg); border:1.5px solid var(--border); cursor:pointer; font-size:0.8rem; transition:var(--transition); color:var(--ink-light); }
        .angle-pill.active, .cat-tab.active { background:var(--ink); color:#fff; border-color:var(--ink); font-weight:500; }
        .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; padding:10px 0 30px; }
        .copy-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:28px 24px; transition:var(--transition); border:1px solid var(--border); display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow-sm); }
        .copy-card:hover { transform:translateY(-4px); box-shadow:0 16px 40px rgba(0,0,0,0.08); }
        .copy-text { font-size:0.92rem; font-weight:300; line-height:1.9; white-space:pre-wrap; max-height:11.4em; overflow:hidden; position:relative; text-indent:0!important; padding-left:0!important; }
        .copy-text.expanded { max-height:none; }
        .copy-text .expand-btn { color:var(--gold); cursor:pointer; font-size:0.8rem; margin-top:4px; display:inline-block; }
        .card-meta { display:flex; justify-content:space-between; align-items:center; font-size:0.7rem; color:#aaa; }
        .copy-btn { cursor:pointer; color:#888; transition:var(--transition); padding:4px 8px; border-radius:6px; }
        .copy-btn:hover { color:var(--gold); background:var(--gold-pale); }
        .media-card-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; padding:10px 0 30px; }
        .media-card { background:var(--card-bg); border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:var(--transition); cursor:pointer; display:flex; flex-direction:column; }
        .media-card:hover { transform:translateY(-4px); box-shadow:0 16px 40px rgba(0,0,0,0.08); }
        .media-card-image { width:100%; height:240px; background:#f0ede5; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; cursor:pointer; }
        .media-card-image img { width:100%; height:100%; object-fit:cover; }
        .media-card-image iframe { width:100%; height:100%; border:0; }
        .media-card-body { padding:20px; display:flex; flex-direction:column; gap:10px; flex:1; }
        .media-card-body h3 { font-size:1.15rem; font-weight:700; color:var(--ink); }
        .media-card-body .desc { font-size:0.85rem; color:var(--ink-light); line-height:1.7; white-space:pre-wrap; }
        .media-card-footer { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:0.7rem; color:#999; }
        .media-card-footer .category-badge { background:var(--gold-pale); color:var(--gold); padding:2px 10px; border-radius:20px; font-size:0.65rem; }
        .admin-float { position:fixed; bottom:28px; right:28px; width:56px; height:56px; background:var(--ink); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:998; box-shadow:0 8px 28px rgba(0,0,0,0.25); font-size:1.3rem; transition:0.2s; text-decoration:none; }
        .admin-float:hover { background:#2b2b2b; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(14px); background:var(--ink); color:#fff; padding:10px 24px; border-radius:var(--radius-full); font-size:0.8rem; letter-spacing:0.06em; opacity:0; transition:0.3s; pointer-events:none; z-index:999; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s; }
        .lightbox.open { opacity:1; pointer-events:auto; }
        .lightbox img, .lightbox video { max-width:90%; max-height:85vh; border-radius:12px; }
        .lightbox .close-lightbox { position:absolute; top:20px; right:30px; color:#fff; font-size:2rem; cursor:pointer; }
        .detail-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:1500; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s; }
        .detail-modal-overlay.open { opacity:1; pointer-events:auto; }
        .detail-modal { background:#fff; border-radius:var(--radius-lg); padding:32px 28px; max-width:600px; width:90%; max-height:85vh; overflow-y:auto; position:relative; }
        .detail-modal .close-btn { position:absolute; top:16px; right:16px; font-size:1.2rem; cursor:pointer; }
        .empty-state { text-align:center; padding:60px 20px; color:#ccc; }
        .update-badge { display:none; background:#c0392b; color:#fff; font-size:0.7rem; padding:3px 10px; border-radius:12px; margin-left:8px; cursor:pointer; animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0.4)}50%{box-shadow:0 0 0 6px rgba(192,57,43,0)} }
        .refresh-btn { background:var(--card-bg); border:1px solid var(--border); padding:8px 16px; border-radius:20px; cursor:pointer; font-size:0.8rem; display:flex; align-items:center; gap:6px; transition:0.2s; }
        .refresh-btn:hover { background:#f0ede5; }
        .unified-input { width:100%; padding:12px 18px; border:1.5px solid #ddd; border-radius:30px; font-family:var(--font-sans); font-size:0.9rem; outline:none; margin:8px 0; background:#fdfdfb; transition:border 0.2s; }
        .unified-input:focus { border-color:var(--gold); box-shadow:0 0 0 2px rgba(184,131,42,0.1); }
        .pagination { display:flex; justify-content:center; align-items:center; gap:12px; padding:20px 0; }
        .pagination button { background:var(--card-bg); border:1px solid var(--border); padding:8px 16px; border-radius:20px; cursor:pointer; font-size:0.85rem; color:var(--ink); transition:0.2s; }
        .pagination button:hover { background:var(--gold-pale); color:var(--gold); }
        .pagination button:disabled { opacity:0.4; cursor:not-allowed; }
        .pagination select { padding:8px 12px; border:1px solid var(--border); border-radius:20px; font-size:0.85rem; background:var(--card-bg); color:var(--ink); outline:none; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
            display: flex; align-items: center; justify-content: center; z-index: 2500;
            opacity: 0; visibility: hidden; transition: 0.2s;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .modal-container {
            background: #fff; border-radius: 32px; max-width: 420px; width: 90%; padding: 32px 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); text-align: center; position: relative;
        }
        .modal-container h3 { font-family: var(--font-serif); font-size: 1.5rem; margin-bottom: 16px; color: var(--ink); }
        .modal-container .modal-desc { font-size: 0.85rem; color: var(--ink-light); margin-bottom: 20px; }
        .modal-container input { width: 100%; margin-bottom: 16px; }
        .modal-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
        .btn-primary { background: var(--ink); color: #fff; border: none; padding: 10px 24px; border-radius: 60px; font-weight: 500; cursor: pointer; transition: 0.2s; font-family: var(--font-sans); }
        .btn-primary:hover { background: #2b2b2b; transform: translateY(-1px); }
        .btn-secondary { background: transparent; border: 1.5px solid #ccc; color: var(--ink-light); padding: 10px 24px; border-radius: 60px; cursor: pointer; transition: 0.2s; font-family: var(--font-sans); }
        .btn-secondary:hover { background: #f5f5f5; border-color: var(--gold); color: var(--gold); }
        .error-msg { color: #c33; font-size: 0.8rem; margin-top: 8px; }
        .close-modal-icon { position: absolute; top: 20px; right: 24px; font-size: 1.2rem; cursor: pointer; color: #aaa; }
        .close-modal-icon:hover { color: var(--ink); }

        @media (max-width:680px) { .hero-title{font-size:2rem} .media-card-grid{grid-template-columns:repeat(2,1fr)} }
    </style>
</head>
<body>
    <div id="homeView">
        <div class="container">
            <header class="hero">
                <div class="hero-tag">YISHI QIANYUAN</div>
                <h1 class="hero-title">易饰乾园素材库</h1>
                <p class="hero-subtitle">极简文案资产 · 驱动品牌自然生长</p>
                <div class="hero-line"></div>
            </header>
            <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
                <button class="refresh-btn" onclick="refreshContent()" id="refreshBtn">🔄 检查更新<span class="update-badge" id="updateBadge">有更新</span></button>
            </div>
            <nav class="module-grid" id="moduleGrid"></nav>
        </div>
    </div>

    <div id="subView" style="display:none;">
        <div class="container">
            <div class="sub-header">
                <div class="sub-title-area">
                    <button class="btn-back" onclick="goHome()">← 返回首页</button>
                    <h2 class="sub-title" id="subTitle"></h2>
                </div>
                <div class="search-wrap">
                    <button class="sort-btn" id="sortBtn" onclick="toggleSortOrder()">↓</button>
                    <button class="search-toggle" onclick="toggleSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <div class="search-input-wrap" id="searchInputWrap">
                        <input type="text" id="searchInput" placeholder="搜索…" oninput="doSearch()">
                    </div>
                </div>
            </div>
            <div class="angle-bar" id="angleBar"></div>
            <div class="cat-tabs" id="catTabs"></div>
            <div class="card-grid" id="cardGrid"></div>
            <div class="media-card-grid" id="mediaCardGrid"></div>
            <div class="pagination" id="paginationBar"></div>
        </div>
    </div>

    <a href="admin.html" class="admin-float" title="管理后台"><i class="fa-solid fa-sliders"></i></a>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()"><span class="close-lightbox">&times;</span><div id="lightboxContent"></div></div>
    <div class="detail-modal-overlay" id="detailOverlay" onclick="closeDetail(event)"><div class="detail-modal" id="detailModal" onclick="event.stopPropagation()"><span class="close-btn" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i></span><div id="detailContent"></div></div></div>
    <div class="toast" id="toast"></div>

    <!-- 锁密码验证模态框（无修改/忘记密码入口） -->
    <div id="lockModal" class="modal-overlay">
        <div class="modal-container">
            <i class="fa-solid fa-xmark close-modal-icon" onclick="closeLockModal()"></i>
            <h3>🔒 模块已锁定</h3>
            <p class="modal-desc">此模块需要密码访问，请输入密码</p>
            <input type="password" id="lockPwdInput" placeholder="请输入访问密码" class="unified-input" onkeydown="if(event.key==='Enter')verifyLockPwd()">
            <div class="modal-buttons">
                <button class="btn-primary" onclick="verifyLockPwd()">解锁</button>
                <button class="btn-secondary" onclick="closeLockModal()">取消</button>
            </div>
            <p id="lockError" class="error-msg"></p>
        </div>
    </div>

    <script>
        (function() {
            const DATA_BIN_ID = '6a02eef4250b1311c33a8e0d';
            const ACCESS_KEY = '$2a$10$byuLg90GXwHLTkabTfftfedRg87sbBfGZ4WXp.NBSRCqJIpp7CmSW';
            const USE_CLOUD = true;
            const CACHE_KEY = 'ysqy_data_cache';
            const VERSION_KEY = 'ysqy_data_version';
            const DEFAULT_ANGLES = ['数字冲击','对话还原','情绪唤醒','场景反差','旁观者视角','预言式','时间轴','选择题','内幕揭秘','反常识','学员故事','身体感知','追问式','画面描写'];
            const PAGE_SIZE = 18;

            let pendingLockedModule = null;
            let sortOrder = 'desc';
            let db = { modules: [], angles: [], contents: [], _modules: [], globalLockPassword: 'zheshimima' };
            let currentModule = null, currentAngle = '全部', currentCategory = '全部', searchQuery = '';
            let currentPage = 1;
            let filteredItems = [];

            const preloadCache = {};

            function getLocalVersion() { return parseInt(localStorage.getItem(VERSION_KEY) || '0'); }
            function getLocalCache() { const c = localStorage.getItem(CACHE_KEY); return c ? JSON.parse(c) : null; }
            function setLocalCache(data) { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }
            function setLocalVersion(v) { localStorage.setItem(VERSION_KEY, v.toString()); }

            function getThumbUrl(originalUrl) {
                if (!originalUrl) return '';
                let fullUrl = originalUrl;
                if (!/^https?:\/\//i.test(originalUrl)) {
                    fullUrl = `https://raw.githubusercontent.com/willllll12138/ysqy-cms/main/${originalUrl}`;
                }
                return `https://wsrv.nl/?url=${encodeURIComponent(fullUrl)}&w=400`;
            }

            window.preloadImage = function(url) {
                if (!url || preloadCache[url]) return;
                preloadCache[url] = true;
                const img = new Image();
                img.src = url;
            };

            async function loadRemoteData() {
                if (!USE_CLOUD) return null;
                const res = await fetch(`https://api.jsonbin.io/v3/b/${DATA_BIN_ID}/latest`, {
                    headers: { 'X-Access-Key': ACCESS_KEY }
                });
                if (res.ok) { const json = await res.json(); return json.record; }
                throw new Error('Failed to load data');
            }

            function normalizeData(data) {
                if (!data || !data.modules) return createDefaultData();
                const _modules = Array.isArray(data.modules) ? data.modules : [];
                const moduleNames = _modules.filter(m => m && m.name).map(m => m.name);
                const pyqModule = _modules.find(m => m.id === 'pyq' || m.name === '朋友圈') || {};
                const angles = Array.isArray(pyqModule.categories) && pyqModule.categories.length > 0 
                               ? pyqModule.categories : DEFAULT_ANGLES;
                const contents = (data.contents || []).map(c => {
                    if (!c.module && c.moduleId) {
                        const mod = _modules.find(m => m.id === c.moduleId);
                        c.module = mod ? mod.name : '';
                    }
                    return c;
                });
                // 读取全局锁密码，如果没有则设置默认值
                const globalLockPassword = data.globalLockPassword || 'zheshimima';
                return { modules: moduleNames.length ? moduleNames : ['朋友圈','客户见证','课程卖点'], angles, contents, _modules, globalLockPassword };
            }

            function createDefaultData() {
                return { modules: ['朋友圈','客户见证','课程卖点'], angles: DEFAULT_ANGLES, contents: [], _modules: [
                    { id:'pyq', name:'朋友圈', type:'moments', categories:['数字冲击','对话还原','情绪唤醒'], locked: false },
                    { id:'witness', name:'客户见证', type:'testimonial', categories:['文昌','沙龙','成交'], locked: false },
                    { id:'course', name:'课程卖点', type:'course', categories:['核心价值','课程亮点'], locked: false }
                ], globalLockPassword: 'zheshimima' };
            }

            function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }
            window.handleCopy = function(btn) { const text=btn.getAttribute('data-copy'); if(!text)return; navigator.clipboard.writeText(text).then(()=>toast('已复制 ✓')); };

            function renderHome() {
                const grid = document.getElementById('moduleGrid');
                const icons = { '朋友圈':'fa-pen-to-square', '客户见证':'fa-comments', '课程卖点':'fa-graduation-cap' };
                grid.innerHTML = db.modules.map(m => {
                    const mod = db._modules.find(md => md.name === m);
                    const locked = mod?.locked || false;
                    return `<div class="module-card ${locked ? 'locked' : ''}" onclick="${locked ? `showLockModal('${m}')` : `openModule('${m}')`}">
                        <div class="module-card-icon"><i class="fa-solid ${icons[m] || 'fa-folder'}"></i></div>
                        <div class="module-card-title">${m}</div>
                        <div class="module-card-desc">点击查看内容</div>
                        <div class="module-card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                    </div>`;
                }).join('');
            }

            window.showLockModal = function(moduleName) {
                pendingLockedModule = moduleName;
                document.getElementById('lockPwdInput').value = '';
                document.getElementById('lockError').textContent = '';
                document.getElementById('lockModal').classList.add('open');
                document.getElementById('lockPwdInput').focus();
            };
            window.closeLockModal = function() { document.getElementById('lockModal').classList.remove('open'); pendingLockedModule = null; };
            window.verifyLockPwd = function() {
                // 从云端获取当前全局密码
                const currentLockPwd = db.globalLockPassword || 'zheshimima';
                if (document.getElementById('lockPwdInput').value === currentLockPwd) {
                    const target = pendingLockedModule;
                    closeLockModal();
                    if (target) openModule(target);
                } else document.getElementById('lockError').textContent = '密码错误';
            };

            window.openModule = function(m) {
                currentModule = m; currentAngle = '全部'; currentCategory = '全部'; searchQuery = '';
                currentPage = 1;
                document.getElementById('homeView').style.display = 'none';
                document.getElementById('subView').style.display = 'block';
                document.getElementById('subTitle').textContent = m;
                renderSubPage();
            };
            window.goHome = function() {
                document.getElementById('subView').style.display = 'none';
                document.getElementById('homeView').style.display = 'block';
            };

            window.toggleSortOrder = function() {
                sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
                document.getElementById('sortBtn').textContent = sortOrder === 'desc' ? '↓' : '↑';
                currentPage = 1;
                renderSubPage();
            };

            function renderSubPage() {
                if (!currentModule) return;
                document.getElementById('angleBar').style.display = 'none';
                document.getElementById('catTabs').style.display = 'none';
                document.getElementById('cardGrid').style.display = 'none';
                document.getElementById('mediaCardGrid').style.display = 'none';
                document.getElementById('paginationBar').innerHTML = '';
                const mod = db._modules.find(m => m.name === currentModule);
                const cats = mod?.categories || [];
                if (currentModule === '朋友圈') {
                    document.getElementById('angleBar').style.display = 'flex';
                    document.getElementById('cardGrid').style.display = 'grid';
                    document.getElementById('angleBar').innerHTML = ['全部', ...db.angles].map(a => `<span class="angle-pill ${currentAngle===a?'active':''}" onclick="setAngle('${a}')">${a}</span>`).join('');
                    let items = db.contents.filter(c => c.module === '朋友圈' && c.angle);
                    if (currentAngle !== '全部') items = items.filter(c => c.angle === currentAngle);
                    if (searchQuery) items = items.filter(c => c.text.includes(searchQuery));
                    items = sortContents(items);
                    filteredItems = items;
                    renderMoments(items);
                } else {
                    if (cats.length > 0) {
                        document.getElementById('catTabs').style.display = 'flex';
                        document.getElementById('catTabs').innerHTML = ['全部', ...cats].map(c => `<span class="cat-tab ${currentCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</span>`).join('');
                    }
                    document.getElementById('mediaCardGrid').style.display = 'grid';
                    let items = db.contents.filter(c => c.module === currentModule);
                    if (currentCategory !== '全部') items = items.filter(c => c.category === currentCategory);
                    if (searchQuery) items = items.filter(c => (c.title||'').includes(searchQuery) || (c.description||c.text||'').includes(searchQuery));
                    items = sortContents(items);
                    filteredItems = items;
                    renderMediaCards(items);
                }
            }

            function sortContents(items) { return items.sort((a,b) => { const tA = a.time || a.id || 0, tB = b.time || b.id || 0; return sortOrder === 'desc' ? tB - tA : tA - tB; }); }

            function renderMoments(items) {
                const grid = document.getElementById('cardGrid');
                const totalPages = Math.ceil(items.length / PAGE_SIZE);
                const pageItems = items.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
                if (!pageItems.length) { grid.innerHTML = '<div class="empty-state">暂无文案</div>'; return; }
                grid.innerHTML = pageItems.map(p => {
                    const text = (p.text||'').split('\n').map(l=>l.trim()).join('\n');
                    const truncated = text.split('\n').length > 6;
                    const display = truncated ? text.split('\n').slice(0,6).join('<br>') + '<span class="expand-btn" onclick="this.parentElement.classList.toggle(\'expanded\')"> 展开全文</span>' : text.replace(/\n/g,'<br>');
                    return `<div class="copy-card"><div class="copy-text ${truncated?'':'expanded'}">${display}</div><div class="card-meta"><span># ${p.angle}</span><span class="copy-btn" data-copy="${text.replace(/"/g,'&quot;')}" onclick="event.stopPropagation();handleCopy(this)"><i class="fa-regular fa-clone"></i> 复制</span></div></div>`;
                }).join('');
                renderPagination(totalPages);
            }

            function renderMediaCards(items) {
                const grid = document.getElementById('mediaCardGrid');
                const totalPages = Math.ceil(items.length / PAGE_SIZE);
                const pageItems = items.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
                if (!pageItems.length) { grid.innerHTML = '<div class="empty-state">暂无内容</div>'; return; }
                let html = '';
                pageItems.forEach(item => {
                    const copyText = ((item.title||'') + '\n' + (item.description||item.text||'')).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
                    const images = (item.imageUrl||'').split(',').map(u=>u.trim()).filter(u=>u);
                    const jumpLink = item.jumpUrl || '';
                    const clickAction = jumpLink ? `window.open('${jumpLink}', '_blank')` : `openLightbox('${images[0]||''}','')`;
                    if (images.length) {
                        images.forEach(img => {
                            const thumbUrl = getThumbUrl(img);
                            const originalImg = img;
                            html += `<div class="media-card" onmouseenter="preloadImage('${originalImg.replace(/'/g, "\\'")}')">
                                <div class="media-card-image" onclick="event.stopPropagation();${clickAction}">
                                    <img src="${thumbUrl}" loading="lazy" onerror="if(this.src!=='${originalImg}'){this.src='${originalImg}';}">
                                </div>
                                <div class="media-card-body">
                                    <h3>${item.title||''}</h3>
                                    <div class="desc">${item.description||''}</div>
                                    <div class="media-card-footer">
                                        ${item.category ? `<span class="category-badge">${item.category}</span>` : ''}
                                        <span>${item.date||''} ${item.clientName ? '· '+item.clientName : ''}</span>
                                    </div>
                                    <span class="copy-btn" data-copy="${copyText}" onclick="event.stopPropagation();handleCopy(this)"><i class="fa-regular fa-clone"></i> 复制</span>
                                </div>
                            </div>`;
                        });
                    } else {
                        html += `<div class="media-card">
                            <div class="media-card-image" onclick="event.stopPropagation();${jumpLink ? `window.open('${jumpLink}', '_blank')` : ''}"><i class="fa-solid fa-image" style="font-size:3rem;color:#ccc;"></i></div>
                            <div class="media-card-body"><h3>${item.title||''}</h3><div class="desc">${item.description||''}</div><span>${item.date||''}</span></div>
                        </div>`;
                    }
                });
                grid.innerHTML = html;
                renderPagination(totalPages);
            }

            function renderPagination(totalPages) {
                const bar = document.getElementById('paginationBar');
                if (totalPages <= 1) { bar.innerHTML = ''; return; }
                let html = '';
                html += `<button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>« 首页</button>`;
                html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ 上一页</button>`;
                html += `<span>第 <select onchange="goToPage(parseInt(this.value))">`;
                for (let i = 1; i <= totalPages; i++) {
                    html += `<option value="${i}" ${i === currentPage ? 'selected' : ''}>${i}</option>`;
                }
                html += `</select> / ${totalPages} 页</span>`;
                html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页 ›</button>`;
                html += `<button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>末页 »</button>`;
                bar.innerHTML = html;
            }

            window.goToPage = function(page) {
                const totalPages = Math.ceil(filteredItems.length / PAGE_SIZE);
                if (page < 1 || page > totalPages) return;
                currentPage = page;
                if (currentModule === '朋友圈') {
                    renderMoments(filteredItems);
                } else {
                    renderMediaCards(filteredItems);
                }
                window.scrollTo(0, 0);
            };

            window.setAngle = function(a) { currentAngle = a; currentPage = 1; renderSubPage(); };
            window.setCategory = function(c) { currentCategory = c; currentPage = 1; renderSubPage(); };
            window.doSearch = function() { searchQuery = document.getElementById('searchInput').value.trim(); currentPage = 1; renderSubPage(); };
            window.toggleSearch = function() {
                const wrap = document.getElementById('searchInputWrap');
                wrap.classList.toggle('open');
                if (wrap.classList.contains('open')) document.getElementById('searchInput').focus();
            };

            window.openLightbox = function(img, video) {
                const lb = document.getElementById('lightbox');
                if (video) { document.getElementById('lightboxContent').innerHTML = `<iframe src="${video}" allowfullscreen style="width:80vw;height:60vh;"></iframe>`; }
                else if (img) { document.getElementById('lightboxContent').innerHTML = `<img src="${img}">`; }
                else return;
                lb.classList.add('open');
            };
            window.closeLightbox = function() { document.getElementById('lightbox').classList.remove('open'); };
            window.openDetail = function(id, moduleName) { /* 可选 */ };
            window.closeDetail = function() { document.getElementById('detailOverlay').classList.remove('open'); };

            function showUpdateBadge(show) {
                const badge = document.getElementById('updateBadge');
                if (badge) badge.style.display = show ? 'inline' : 'none';
            }

            async function loadData() {
                const localCache = getLocalCache();
                if (localCache) {
                    db = localCache;
                    renderHome();
                    loadRemoteData().then(remoteData => {
                        if (remoteData && remoteData.version > getLocalVersion()) {
                            showUpdateBadge(true);
                        }
                    }).catch(() => {});
                    return;
                }
                try {
                    const remoteData = await loadRemoteData();
                    db = normalizeData(remoteData);
                    setLocalCache(db);
                    setLocalVersion(remoteData.version || 0);
                    renderHome();
                } catch (e) {
                    db = createDefaultData();
                    renderHome();
                }
            }

            window.refreshContent = async function() {
                const btn = document.getElementById('refreshBtn');
                if (btn) btn.disabled = true;
                try {
                    const remoteData = await loadRemoteData();
                    const remoteVersion = remoteData.version || 0;
                    db = normalizeData(remoteData);
                    setLocalCache(db);
                    setLocalVersion(remoteVersion);
                    renderHome();
                    if (currentModule) { currentPage = 1; renderSubPage(); }
                    showUpdateBadge(false);
                    toast('✅ 已更新至最新版本');
                } catch (e) {
                    toast('更新失败，请检查网络');
                }
                if (btn) btn.disabled = false;
            };

            document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDetail(); closeLightbox(); } });
            loadData();
        })();
    </script>
</body>
</html>
