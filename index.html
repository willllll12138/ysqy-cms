<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园 · 发圈文案库</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --bg: #F7F5F0;
  --card: #FFFFFF;
  --ink: #1D1D1F;
  --gold: #C66A4E;
  --mist: #E5E0D8;
}

* {margin:0;padding:0;box-sizing:border-box;}
body {background: var(--bg); font-family: 'Noto Sans SC', sans-serif; color: var(--ink); min-height: 100vh;}

.hero { padding: 100px 40px 60px; text-align: center; }
.hero h1 { font-family: 'Noto Serif SC', serif; font-size: clamp(2.8rem, 8vw, 4.5rem); letter-spacing: 0.08em; }
.hero h1 em { color: var(--gold); }

.legend-wrap { background: var(--bg); position: sticky; top: 0; z-index: 100; padding: 20px 0; border-bottom: 1px solid var(--mist); text-align: center; }
.legend { display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.leg-btn { padding: 10px 24px; border-radius: 50px; background: white; border: 1px solid var(--mist); cursor: pointer; transition: all 0.4s; }
.leg-btn.on { background: var(--ink); color: white; border-color: var(--ink); }

.grid { max-width: 1280px; margin: 40px auto; padding: 0 30px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 28px; }

.card { background: var(--card); border: 1px solid var(--mist); border-radius: 20px; overflow: hidden; transition: all 0.5s; }
.card:hover { transform: translateY(-12px); box-shadow: 0 30px 60px rgba(0,0,0,0.08); }

.card-stripe { height: 4px; }
.s-gold .card-stripe { background: linear-gradient(90deg, #C66A4E, #d4a84b); }

.card-head { padding: 18px 24px 10px; display: flex; justify-content: space-between; align-items: center; }
.card-angle { font-size: 0.85rem; padding: 4px 12px; border-radius: 20px; background: #fdf0e8; color: var(--gold); }
.card-no { font-family: 'Noto Serif SC', serif; font-size: 1.1rem; font-weight: 700; color: #999; }

.card-body { padding: 10px 24px 20px; line-height: 1.95; font-size: 1.05rem; }
.card-foot { padding: 14px 24px; border-top: 1px solid var(--mist); display: flex; justify-content: space-between; align-items: center; color: #777; }
.btn-copy { padding: 6px 20px; border: 1px solid var(--mist); border-radius: 30px; background: transparent; cursor: pointer; }
.btn-copy:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>

<div class="hero">
  <h1>易饰乾园 · <em>发圈文案库</em></h1>
  <p class="hero-desc">极简文案资产 · 驱动品牌自然生长</p>
</div>

<div class="legend-wrap">
  <div class="legend" id="legend"></div>
</div>

<div class="grid" id="grid"></div>

<div style="text-align:center;padding:60px;color:#888;">
  <a href="admin.html" style="color:var(--gold);">后台管理</a>
</div>

<script>
const DEFAULT_DATA = [ /* 30条完整数据 */ 
  // ...（与之前一致，这里省略以节省篇幅，实际代码中已完整包含）
];

let allData = [];
let curAngle = 'ALL';

function loadData() {
  allData = DEFAULT_DATA;
  renderLegend();
  render();
}

function renderLegend() {
  const angles = ['ALL', ...new Set(allData.map(d => d.angle))];
  let html = '';
  angles.forEach(a => {
    const name = a === 'ALL' ? '全部' : a;
    html += `<button class="leg-btn ${a==='ALL'?'on':''}" onclick="flt('${a}',this)">${name}</button>`;
  });
  document.getElementById('legend').innerHTML = html;
}

function render() {
  const grid = document.getElementById('grid');
  let filtered = curAngle === 'ALL' ? allData : allData.filter(d => d.angle === curAngle);

  // 按角度分组后重新编号
  const grouped = {};
  filtered.forEach(item => {
    if (!grouped[item.angle]) grouped[item.angle] = [];
    grouped[item.angle].push(item);
  });

  let html = '';
  Object.keys(grouped).forEach(angle => {
    grouped[angle].forEach((item, idx) => {
      const lines = item.text.split('\n').join('<br>');
      const localNo = String(idx + 1).padStart(2, '0');
      html += `
      <div class="card ${item.scheme}">
        <div class="card-stripe"></div>
        <div class="card-head">
          <span class="card-angle">${item.angle}</span>
          <span class="card-no">${localNo}</span>
        </div>
        <div class="card-body">${lines}</div>
        <div class="card-foot">
          <span>${item.struct||''}</span>
          <button class="btn-copy" onclick="copyOne(this,'${item.text.replace(/\n/g,'\\n')}')">复制</button>
        </div>
      </div>`;
    });
  });

  grid.innerHTML = html || '<p style="grid-column:1/-1;text-align:center;padding:100px;color:#aaa;">暂无文案</p>';
}

function flt(angle, btn) {
  curAngle = angle;
  document.querySelectorAll('.leg-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function copyOne(btn, text) {
  navigator.clipboard.writeText(text.replace(/\\n/g,'\n')).then(() => {
    const old = btn.textContent;
    btn.textContent = '✓ 已复制';
    setTimeout(() => btn.textContent = old, 1600);
  });
}

window.onload = loadData;
</script>
</body>
</html>
