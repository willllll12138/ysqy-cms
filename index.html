<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>易饰乾园素材库 · 文案资产系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2;
            --card-bg: #FFFFFF;
            --ink: #1a1815;
            --ink-light: #5c574f;
            --gold: #b8832a;
            --gold-pale: #f7f0e0;
            --border: rgba(0,0,0,0.06);
            --border-strong: rgba(0,0,0,0.12);
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-full: 50px;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.07);
            --transition: 0.3s cubic-bezier(0.23,1,0.32,1);
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Noto Sans SC', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); font-family:var(--font-sans); color:var(--ink); line-height:1.6; min-height:100vh; }
        body::before { content:''; position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--gold),#8b3a3a,#5a6b4d); z-index:1000; }
        .container { max-width:960px; margin:0 auto; padding:0 24px; }
        .hero { text-align:center; padding:72px 0 48px; }
        .hero-title { font-family:var(--font-serif); font-size:2.8rem; font-weight:900; }
        .module-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; padding-bottom:60px; }
        .module-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:32px 26px; cursor:pointer; transition:var(--transition); border:1px solid var(--border); box-shadow:var(--shadow-sm); }
        .module-card:hover { transform:translateY(-6px); box-shadow:0 20px 40px rgba(0,0,0,0.08); }
        .sub-header { display:flex; align-items:center; justify-content:space-between; padding:24px 0 16px; position:sticky; top:3px; background:var(--bg); z-index:90; border-bottom:1px solid var(--border); }
        .angle-bar,.cat-tabs { display:flex; gap:8px; padding:16px 0; flex-wrap:wrap; }
        .angle-pill,.cat-tab { padding:7px 18px; border-radius:50px; background:var(--card-bg); border:1.5px solid var(--border); cursor:pointer; font-size:0.8rem; }
        .angle-pill.active,.cat-tab.active { background:var(--ink); color:#fff; }
        .card-grid,.media-card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; padding:10px 0 50px; }
        .copy-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:28px 24px; transition:var(--transition); border:1px solid var(--border); box-shadow:var(--shadow-sm); }
        .copy-text { font-size:0.92rem; font-weight:300; line-height:1.9; white-space:pre-wrap; max-height:11.4em; overflow:hidden; }
        .copy-text.expanded { max-height:none; }
        .expand-btn { color:var(--gold); cursor:pointer; font-size:0.8rem; }
        .media-card { background:var(--card-bg); border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:var(--transition); cursor:pointer; }
        .media-card:hover { transform:translateY(-4px); }
        .media-card-image { width:100%; height:240px; background:#f0ede5; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:zoom-in; }
        .media-card-image img { width:100%; height:100%; object-fit:cover; }
        .media-card-body { padding:20px; }
        .media-card-body h3 { font-size:1.15rem; font-weight:700; margin-bottom:8px; }
        .media-card-body .desc { font-size:0.85rem; color:var(--ink-light); line-height:1.7; }
        .copy-btn { cursor:pointer; color:#888; padding:4px 8px; border-radius:6px; }
        .copy-btn:hover { color:var(--gold); background:var(--gold-pale); }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 24px; border-radius:30px; font-size:0.8rem; opacity:0; transition:0.3s; z-index:999; }
        .toast.show { opacity:1; }
        .empty-state { text-align:center; padding:60px 20px; color:#ccc; }
        /* 弹窗分隔线 */
        .detail-meta { display:flex; gap:12px; align-items:center; margin:12px 0 20px; color:var(--ink-light); font-size:0.8rem; }
        .detail-meta .badge { background:var(--gold-pale); color:var(--gold); padding:2px 10px; border-radius:20px; font-size:0.7rem; }
        .detail-divider { border:none; border-top:1px solid var(--border); margin:20px 0; }
    </style>
</head>
<body>
    <div id="homeView"><div class="container"><header class="hero"><h1 class="hero-title">易饰乾园素材库</h1></header><nav class="module-grid" id="moduleGrid"></nav></div></div>
    <div id="subView" style="display:none;"><div class="container"><div class="sub-header"><div><button class="btn-back" onclick="goHome()">← 返回首页</button><h2 class="sub-title" id="subTitle"></h2></div><div><input type="text" id="searchInput" placeholder="搜索…" oninput="doSearch()"></div></div><div class="angle-bar" id="angleBar"></div><div class="cat-tabs" id="catTabs"></div><div class="card-grid" id="cardGrid"></div><div class="media-card-grid" id="mediaCardGrid"></div><div class="empty-state" id="emptyState">暂无内容</div></div></div>
    <a href="admin.html" class="admin-float" style="position:fixed;bottom:28px;right:28px;width:56px;height:56px;background:var(--ink);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;">⚙</a>
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const DATA_KEY = 'ysqy_data_v3';
            const DEFAULT_DATA = {
                modules: ['朋友圈','客户见证','课程卖点'],
                angles: ['数字冲击','对话还原','情绪唤醒'],
                testimonialCategories: ['文昌','沙龙','成交'],
                courseCategories: ['核心价值','课程亮点'],
                posts: [ { id:1, module:'朋友圈', angle:'数字冲击', text:'同样做室内设计，收入差距能有10倍\n靠颜感做方案的，改稿改到怀疑人生\n靠五行色彩做方案的，签单当天就定', time:1715000000000 } ],
                testimonials: [ { id:101, module:'客户见证', category:'成交', imageUrl:'', videoUrl:'', title:'林女士 · 软装设计师', description:'学了五行色彩后，第一个月签单率提升40%。客户说“你懂我”，这种感觉太好了。', clientName:'林女士', date:'2024-05-15' } ],
                courses: [ { id:201, module:'课程卖点', category:'核心价值', imageUrl:'', videoUrl:'', title:'五行色彩诊断系统', description:'一套让设计师秒懂客户的底层工具', date:'2024-05-01' } ]
            };
            let db = JSON.parse(localStorage.getItem(DATA_KEY) || 'null') || DEFAULT_DATA;
            if (!db.modules) db = JSON.parse(JSON.stringify(DEFAULT_DATA));
            localStorage.setItem(DATA_KEY, JSON.stringify(db));

            let currentModule=null, currentAngle='全部', currentCategory='全部', searchQuery='';

            function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }
            window.handleCopy = function(btn) {
                const text = btn.getAttribute('data-copy');
                if (!text) return;
                navigator.clipboard.writeText(text).then(() => toast('已复制 ✓'));
            };

            function renderHome() {
                document.getElementById('moduleGrid').innerHTML = db.modules.map(m => `<div class="module-card" onclick="openModule('${m}')"><h3>${m}</h3></div>`).join('');
            }

            window.openModule = function(m) {
                currentModule=m; currentAngle='全部'; currentCategory='全部'; searchQuery='';
                document.getElementById('homeView').style.display='none';
                document.getElementById('subView').style.display='block';
                document.getElementById('subTitle').textContent=m;
                renderSubPage();
            };
            window.goHome = function() { document.getElementById('subView').style.display='none'; document.getElementById('homeView').style.display='block'; };

            function renderSubPage() {
                if (!currentModule) return;
                document.getElementById('angleBar').style.display='none';
                document.getElementById('catTabs').style.display='none';
                document.getElementById('cardGrid').style.display='none';
                document.getElementById('mediaCardGrid').style.display='none';
                if (currentModule==='朋友圈') { document.getElementById('angleBar').style.display='flex'; document.getElementById('cardGrid').style.display='grid'; renderMoments(); }
                else if (currentModule==='客户见证') { document.getElementById('catTabs').style.display='flex'; document.getElementById('mediaCardGrid').style.display='grid'; renderWitness(); }
                else if (currentModule==='课程卖点') { document.getElementById('catTabs').style.display='flex'; document.getElementById('mediaCardGrid').style.display='grid'; renderCourse(); }
            }

            function renderMoments() { /* 省略与之前相同 */ }

            function renderWitness() {
                document.getElementById('catTabs').innerHTML = ['全部',...db.testimonialCategories].map(c => `<span class="cat-tab ${currentCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</span>`).join('');
                let filtered = db.testimonials.filter(t=>t.module==='客户见证');
                if (currentCategory!=='全部') filtered = filtered.filter(t=>t.category===currentCategory);
                if (searchQuery) filtered = filtered.filter(t=>t.title.includes(searchQuery)||t.description.includes(searchQuery));
                const grid = document.getElementById('mediaCardGrid');
                if (!filtered.length) { grid.innerHTML='<div class="empty-state">暂无见证</div>'; return; }
                grid.innerHTML = filtered.map(t => {
                    const copyText = (t.title + '\n' + t.description).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
                    return `<div class="media-card" onclick="openDetail('testimonial',${t.id})">
                        <div class="media-card-image" onclick="event.stopPropagation()">${t.imageUrl?`<img src="${t.imageUrl}">`:'<i class="fa-solid fa-image" style="font-size:3rem;color:#ccc;"></i>'}</div>
                        <div class="media-card-body">
                            <h3>${t.title}</h3>
                            <div class="desc">${t.description}</div>
                            <div class="media-card-footer" style="display:flex;justify-content:space-between;margin-top:10px;">
                                <span class="category-badge" style="background:var(--gold-pale);color:var(--gold);padding:2px 10px;border-radius:20px;font-size:0.65rem;">${t.category}</span>
                                <span style="font-size:0.7rem;color:#aaa;">${t.date||''} · ${t.clientName||''}</span>
                            </div>
                            <span class="copy-btn" data-copy="${copyText}" onclick="event.stopPropagation();handleCopy(this)"><i class="fa-regular fa-clone"></i> 复制</span>
                        </div>
                    </div>`;
                }).join('');
            }

            function renderCourse() { /* 类似见证 */ }

            window.openDetail = function(type, id) {
                let item = type==='testimonial' ? db.testimonials.find(t=>t.id===id) : db.courses.find(c=>c.id===id);
                if (!item) return;
                const copyText = (item.title + '\n' + item.description).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
                const detailHtml = `
                    <div style="background:#fff;border-radius:var(--radius-lg);padding:28px;max-width:600px;margin:0 auto;">
                        ${item.imageUrl ? `<img src="${item.imageUrl}" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:16px;">` : ''}
                        <h2 style="font-size:1.4rem;margin-bottom:8px;">${item.title}</h2>
                        <div class="detail-meta">
                            <span class="badge">${item.category||''}</span>
                            <span>${item.date||''}</span>
                            <span>${item.clientName||''}</span>
                        </div>
                        <hr class="detail-divider">
                        <p style="white-space:pre-wrap;line-height:1.8;font-size:0.95rem;color:var(--ink-light);">${item.description}</p>
                        <button class="copy-btn" data-copy="${copyText}" onclick="handleCopy(this)" style="margin-top:20px;"><i class="fa-regular fa-clone"></i> 复制文案</button>
                    </div>
                `;
                const overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;';
                overlay.innerHTML = detailHtml;
                overlay.onclick = (e) => { if (e.target===overlay) overlay.remove(); };
                document.body.appendChild(overlay);
            };

            window.setCategory = function(c) { currentCategory=c; renderSubPage(); };
            window.doSearch = function() { searchQuery=document.getElementById('searchInput').value.trim(); renderSubPage(); };
            renderHome();
        })();
    </script>
</body>
</html>
