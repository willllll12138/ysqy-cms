<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>易饰乾园素材库 · 文案资产系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2; --card-bg: #FFFFFF; --ink: #1a1815; --ink-light: #5c574f;
            --gold: #b8832a; --gold-pale: #f7f0e0; --border: rgba(0,0,0,0.06);
            --radius-sm: 10px; --radius-md: 18px; --radius-lg: 24px; --radius-full: 50px;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.04); --shadow-md: 0 8px 30px rgba(0,0,0,0.07);
            --transition: 0.2s ease;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);font-family:'Noto Sans SC',sans-serif;color:var(--ink);}
        .container{max-width:960px;margin:0 auto;padding:0 24px;}
        .hero{text-align:center;padding:60px 0 40px;}
        .hero-title{font-family:'Noto Serif SC',serif;font-size:2.5rem;}
        .module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
        .module-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:28px 20px;cursor:pointer;transition:var(--transition);border:1px solid var(--border);box-shadow:var(--shadow-sm);position:relative;}
        .module-card:hover{transform:translateY(-2px);}
        .module-card.locked::after{content:'🔒';position:absolute;top:8px;right:12px;font-size:1rem;}
        .sub-header{display:flex;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border);}
        .angle-bar,.cat-tabs{display:flex;gap:8px;padding:16px 0;flex-wrap:wrap;}
        .angle-pill,.cat-tab{padding:6px 16px;border-radius:20px;background:var(--card-bg);border:1px solid var(--border);cursor:pointer;font-size:0.8rem;}
        .angle-pill.active,.cat-tab.active{background:var(--ink);color:#fff;}
        .card-grid,.media-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px 0;}
        .copy-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border);}
        .copy-text{font-size:0.9rem;line-height:1.8;white-space:pre-wrap;max-height:10em;overflow:hidden;}
        .copy-text.expanded{max-height:none;}
        .media-card{background:var(--card-bg);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);cursor:pointer;}
        .media-card-image{height:200px;background:#f0ede5;display:flex;align-items:center;justify-content:center;}
        .media-card-image img{width:100%;height:100%;object-fit:cover;}
        .media-card-body{padding:16px;}
        .copy-btn{cursor:pointer;color:#888;}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 20px;border-radius:20px;font-size:0.8rem;opacity:0;z-index:999;}
        .toast.show{opacity:1;}
        .empty-state{text-align:center;color:#ccc;padding:40px;}
    </style>
</head>
<body>
    <div id="homeView"><div class="container"><header class="hero"><h1 class="hero-title">易饰乾园素材库</h1></header><nav class="module-grid" id="moduleGrid"></nav></div></div>
    <div id="subView" style="display:none;"><div class="container"><div class="sub-header"><button onclick="goHome()">← 返回</button><h2 id="subTitle"></h2><div><button class="sort-btn" onclick="toggleSort()">↓</button><input type="text" id="searchInput" placeholder="搜索…" oninput="doSearch()"></div></div><div class="angle-bar" id="angleBar"></div><div class="cat-tabs" id="catTabs"></div><div class="card-grid" id="cardGrid"></div><div class="media-card-grid" id="mediaCardGrid"></div><div class="empty-state">暂无内容</div></div></div>
    <a href="admin.html" style="position:fixed;bottom:20px;right:20px;width:48px;height:48px;background:var(--ink);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;">⚙</a>
    <div class="toast" id="toast"></div>
    <div id="lockModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:2500;">
        <div style="background:#fff;border-radius:24px;padding:32px;max-width:360px;width:90%;text-align:center;">
            <h3>🔒 此模块已锁定</h3>
            <input type="password" id="lockPwdInput" placeholder="请输入访问密码" style="width:100%;padding:12px;border-radius:30px;border:1px solid #ddd;margin:16px 0;" onkeydown="if(event.key==='Enter')unlock()">
            <button onclick="unlock()">解锁</button>
            <button onclick="document.getElementById('lockModal').style.display='none'">取消</button>
            <p id="lockError" style="color:#c33;font-size:0.8rem;"></p>
        </div>
    </div>

    <script>
        (function() {
            const BIN_ID = '6a02eef4250b1311c33a8e0d';
            const API_KEY = '$2a$10$ZT.KNtcxFkJRschmg1TdreI.6z4RU2lYAR/qWubLdAqbAWNb80oRa';
            const USE_CLOUD = true;
            const DATA_KEY = 'ysqy_data_v3';
            const LOCK_PWD_KEY = 'ysqy_module_pwd';
            const DEFAULT_LOCK_PWD = 'zheshimima';
            let pendingLockedModule = null;
            let sortOrder = 'desc';

            function getLockPwd() { return localStorage.getItem(LOCK_PWD_KEY) || DEFAULT_LOCK_PWD; }

            // 数据结构
            let db = {
                modules: [],          // 模块名称数组
                angles: [],           // 朋友圈专用角度（同步自后台模块pyq的categories）
                contents: [],         // 所有内容
                _modules: []          // 原始模块对象数组（包含categories, locked等）
            };

            async function loadData() {
                let raw;
                if (USE_CLOUD) {
                    try {
                        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
                        if (res.ok) { const json = await res.json(); raw = json.record; } else raw = null;
                    } catch(e) { raw = null; }
                }
                if (!raw) {
                    raw = JSON.parse(localStorage.getItem(DATA_KEY) || 'null');
                }
                processData(raw || {});
            }

            function processData(data) {
                // 确保_modules存在且是数组
                const _modules = data.modules || [];
                // 提取模块名称
                const moduleNames = _modules.filter(m => m && m.id && m.name).map(m => m.name);
                // 获取朋友圈模块对象
                const pyqModule = _modules.find(m => m.id === 'pyq') || {};
                const angles = pyqModule.categories || ['数字冲击','对话还原','情绪唤醒'];
                // 提取内容
                const contents = (data.contents || []).map(c => {
                    if (!c.module) {
                        const mod = _modules.find(m => m.id === c.moduleId);
                        c.module = mod ? mod.name : '';
                    }
                    return c;
                });
                db = {
                    modules: moduleNames.length ? moduleNames : ['朋友圈','客户见证','课程卖点'],
                    angles: angles,
                    contents: contents,
                    _modules: _modules
                };
                localStorage.setItem(DATA_KEY, JSON.stringify({ modules: _modules, contents }));
            }

            function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }

            // 首页渲染
            function renderHome() {
                const grid = document.getElementById('moduleGrid');
                grid.innerHTML = db.modules.map(m => {
                    const mod = db._modules.find(md => md.name === m);
                    const locked = mod?.locked || false;
                    return `<div class="module-card ${locked ? 'locked' : ''}" onclick="${locked ? `requirePwd('${m}')` : `openModule('${m}')`}">
                        <h3>${m}</h3>
                    </div>`;
                }).join('');
            }

            window.requirePwd = function(moduleName) {
                pendingLockedModule = moduleName;
                document.getElementById('lockPwdInput').value = '';
                document.getElementById('lockError').textContent = '';
                document.getElementById('lockModal').style.display = 'flex';
                document.getElementById('lockPwdInput').focus();
            };

            window.unlock = function() {
                const pwd = document.getElementById('lockPwdInput').value;
                if (pwd === getLockPwd()) {
                    document.getElementById('lockModal').style.display = 'none';
                    if (pendingLockedModule) {
                        openModule(pendingLockedModule);
                    }
                } else {
                    document.getElementById('lockError').textContent = '密码错误';
                }
            };

            window.openModule = function(m) {
                currentModule = m;
                currentAngle = '全部';
                currentCategory = '全部';
                searchQuery = '';
                document.getElementById('homeView').style.display = 'none';
                document.getElementById('subView').style.display = 'block';
                document.getElementById('subTitle').textContent = m;
                renderSubPage();
            };
            window.goHome = function() {
                document.getElementById('subView').style.display = 'none';
                document.getElementById('homeView').style.display = 'block';
            };

            let currentModule = null, currentAngle = '全部', currentCategory = '全部', searchQuery = '';

            function renderSubPage() {
                if (!currentModule) return;
                document.getElementById('angleBar').style.display = 'none';
                document.getElementById('catTabs').style.display = 'none';
                document.getElementById('cardGrid').style.display = 'none';
                document.getElementById('mediaCardGrid').style.display = 'none';

                if (currentModule === '朋友圈') {
                    document.getElementById('angleBar').style.display = 'flex';
                    document.getElementById('cardGrid').style.display = 'grid';
                    document.getElementById('angleBar').innerHTML = ['全部', ...db.angles].map(a => `<span class="angle-pill ${currentAngle===a?'active':''}" onclick="setAngle('${a}')">${a}</span>`).join('');
                    let items = db.contents.filter(c => c.module === '朋友圈' && c.angle);
                    if (currentAngle !== '全部') items = items.filter(c => c.angle === currentAngle);
                    if (searchQuery) items = items.filter(c => c.text.includes(searchQuery));
                    items = sortContents(items);
                    renderMoments(items);
                } else {
                    const mod = db._modules.find(m => m.name === currentModule);
                    const cats = mod?.categories || [];
                    if (cats.length > 0) {
                        document.getElementById('catTabs').style.display = 'flex';
                        document.getElementById('catTabs').innerHTML = ['全部', ...cats].map(c => `<span class="cat-tab ${currentCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</span>`).join('');
                    }
                    document.getElementById('mediaCardGrid').style.display = 'grid';
                    let items = db.contents.filter(c => c.module === currentModule);
                    if (currentCategory !== '全部') items = items.filter(c => c.category === currentCategory);
                    if (searchQuery) items = items.filter(c => (c.title||'').includes(searchQuery) || (c.description||'').includes(searchQuery));
                    items = sortContents(items);
                    renderMediaCards(items);
                }
            }

            function sortContents(items) {
                return items.sort((a, b) => {
                    const timeA = a.time || a.id || 0;
                    const timeB = b.time || b.id || 0;
                    return sortOrder === 'desc' ? timeB - timeA : timeA - timeB;
                });
            }

            window.toggleSort = function() {
                sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
                document.querySelector('.sort-btn').textContent = sortOrder === 'desc' ? '↓' : '↑';
                renderSubPage();
            };

            function renderMoments(items) {
                const grid = document.getElementById('cardGrid');
                if (!items.length) { grid.innerHTML = '<div class="empty-state">暂无文案</div>'; return; }
                grid.innerHTML = items.map(p => {
                    const text = (p.text||'').split('\n').map(l=>l.trim()).join('\n');
                    const truncated = text.split('\n').length > 6;
                    const display = truncated ? text.split('\n').slice(0,6).join('<br>') + '<span class="expand-btn" onclick="this.parentElement.classList.toggle(\'expanded\')"> 展开全文</span>' : text.replace(/\n/g,'<br>');
                    return `<div class="copy-card"><div class="copy-text ${truncated?'':'expanded'}">${display}</div><span># ${p.angle}</span></div>`;
                }).join('');
            }

            function renderMediaCards(items) {
                const grid = document.getElementById('mediaCardGrid');
                if (!items.length) { grid.innerHTML = '<div class="empty-state">暂无内容</div>'; return; }
                let html = '';
                items.forEach(item => {
                    const images = (item.imageUrl||'').split(',').map(u=>u.trim()).filter(u=>u);
                    if (images.length) {
                        images.forEach(img => {
                            html += `<div class="media-card"><div class="media-card-image"><img src="${img}" onerror="this.parentElement.innerHTML='<i class=\\'fa-solid fa-image\\'></i>'"></div><div class="media-card-body"><h4>${item.title||''}</h4><p>${item.description||''}</p></div></div>`;
                        });
                    } else {
                        html += `<div class="media-card"><div class="media-card-image"><i class="fa-solid fa-image"></i></div><div class="media-card-body"><h4>${item.title||''}</h4><p>${item.description||''}</p></div></div>`;
                    }
                });
                grid.innerHTML = html;
            }

            window.setAngle = function(a) { currentAngle = a; renderSubPage(); };
            window.setCategory = function(c) { currentCategory = c; renderSubPage(); };
            window.doSearch = function() { searchQuery = document.getElementById('searchInput').value.trim(); renderSubPage(); };

            loadData().then(() => {
                renderHome();
            });
        })();
    </script>
</body>
</html>
