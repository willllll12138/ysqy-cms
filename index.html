<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>易饰乾园素材库 · 文案资产系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2; --card-bg: #FFFFFF; --ink: #1a1815; --ink-light: #5c574f;
            --gold: #b8832a; --gold-pale: #f7f0e0; --border: rgba(0,0,0,0.06);
            --radius-lg: 24px; --radius-full: 50px; --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);font-family:'Noto Sans SC',sans-serif;color:var(--ink);}
        .container{max-width:960px;margin:0 auto;padding:0 24px;}
        .hero{text-align:center;padding:72px 0 48px;}
        .hero-title{font-family:'Noto Serif SC',serif;font-size:2.5rem;}
        .module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;padding-bottom:60px;}
        .module-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:24px;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow-sm);text-align:center;}
        .module-card:hover{transform:translateY(-3px);}
        .sub-header{display:flex;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border);}
        .angle-bar,.cat-tabs{display:flex;gap:8px;padding:16px 0;}
        .angle-pill,.cat-tab{padding:6px 16px;border-radius:20px;background:var(--card-bg);border:1px solid var(--border);cursor:pointer;font-size:0.8rem;}
        .angle-pill.active,.cat-tab.active{background:var(--ink);color:#fff;}
        .card-grid,.media-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px 0;}
        .copy-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border);}
        .copy-text{font-size:0.9rem;line-height:1.8;white-space:pre-wrap;max-height:10em;overflow:hidden;}
        .copy-text.expanded{max-height:none;}
        .media-card{background:var(--card-bg);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);cursor:pointer;}
        .media-card-image{position:relative;width:100%;height:200px;background:#f0ede5;display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;}
        .media-card-image img{height:100%;width:auto;max-width:none;scroll-snap-align:start;flex-shrink:0;}
        .media-card-body{padding:16px;}
        .copy-btn{cursor:pointer;color:#888;font-size:0.8rem;}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 20px;border-radius:20px;font-size:0.8rem;opacity:0;z-index:999;}
        .toast.show{opacity:1;}
        .empty-state{text-align:center;color:#ccc;padding:40px;}
    </style>
</head>
<body>
    <div id="homeView"><div class="container"><header class="hero"><h1 class="hero-title">易饰乾园素材库</h1></header><nav class="module-grid" id="moduleGrid"></nav></div></div>
    <div id="subView" style="display:none;"><div class="container"><div class="sub-header"><button onclick="goHome()">← 返回</button><h2 id="subTitle"></h2><input type="text" id="searchInput" placeholder="搜索…" oninput="doSearch()"></div><div class="angle-bar" id="angleBar"></div><div class="cat-tabs" id="catTabs"></div><div class="card-grid" id="cardGrid"></div><div class="media-card-grid" id="mediaCardGrid"></div><div class="empty-state">暂无内容</div></div></div>
    <a href="admin.html" style="position:fixed;bottom:20px;right:20px;width:50px;height:50px;background:var(--ink);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;">⚙</a>
    <div class="toast" id="toast"></div>
    <script>
        (function() {
            const JSONBIN_BIN_ID = '6a02eef4250b1311c33a8e0d';
            const JSONBIN_API_KEY = '$2a$10$ZT.KNtcxFkJRschmg1TdreI.6z4RU2lYAR/qWubLdAqbAWNb80oRa';
            const USE_CLOUD = true;
            const KEY = 'ysqy_data_v3';
            let db = { modules: [], angles: [], testimonialCategories: [], courseCategories: [], posts: [], testimonials: [], courses: [] };

            async function loadData() {
                if (USE_CLOUD) {
                    try {
                        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, { headers: { 'X-Master-Key': JSONBIN_API_KEY } });
                        if (res.ok) { const json = await res.json(); db = normalizeData(json.record); localStorage.setItem(KEY, JSON.stringify(db)); return; }
                    } catch(e) {}
                }
                db = normalizeData(JSON.parse(localStorage.getItem(KEY) || 'null'));
            }

            function normalizeData(data) {
                if (!data || !data.modules) return { modules: ['朋友圈','客户见证','课程卖点'], angles: ['数字冲击','对话还原'], testimonialCategories: ['文昌','沙龙'], courseCategories: ['核心价值'], posts: [], testimonials: [], courses: [] };
                if (data.modules.length && typeof data.modules[0] === 'object') {
                    const modules = data.modules.filter(m => m && m.id && m.name).map(m => m.name);
                    const angles = [], testCats = [], courseCats = [], posts = [], testimonials = [], courses = [];
                    (data.contents || []).forEach(c => {
                        const mod = data.modules.find(m => m.id === c.moduleId);
                        if (!mod) return;
                        if (mod.type === 'moments') { posts.push({ ...c, module: mod.name }); if (c.angle && !angles.includes(c.angle)) angles.push(c.angle); }
                        else if (mod.type === 'testimonial') { testimonials.push({ ...c, module: mod.name }); if (c.category && !testCats.includes(c.category)) testCats.push(c.category); }
                        else if (mod.type === 'course') { courses.push({ ...c, module: mod.name }); if (c.category && !courseCats.includes(c.category)) courseCats.push(c.category); }
                    });
                    return { modules: modules.length ? modules : ['朋友圈','客户见证','课程卖点'], angles, testimonialCategories: testCats, courseCategories: courseCats, posts, testimonials, courses };
                }
                data.modules = data.modules.filter(m => typeof m === 'string');
                return data;
            }

            let curModule = null, curAngle = '全部', curCat = '全部', query = '';
            function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }
            function renderHome() { document.getElementById('moduleGrid').innerHTML = db.modules.map(m => `<div class="module-card" onclick="openModule('${m}')"><h3>${m}</h3></div>`).join(''); }
            window.openModule = function(m) { curModule=m; curAngle='全部'; curCat='全部'; query=''; document.getElementById('homeView').style.display='none'; document.getElementById('subView').style.display='block'; document.getElementById('subTitle').textContent=m; renderSub(); };
            window.goHome = function() { document.getElementById('subView').style.display='none'; document.getElementById('homeView').style.display='block'; };
            function renderSub() {
                document.getElementById('angleBar').style.display='none';
                document.getElementById('catTabs').style.display='none';
                document.getElementById('cardGrid').style.display='none';
                document.getElementById('mediaCardGrid').style.display='none';
                if (curModule === '朋友圈') { document.getElementById('angleBar').style.display='flex'; document.getElementById('cardGrid').style.display='grid'; renderMoments(); }
                else if (curModule === '客户见证' || curModule === '课程卖点') { document.getElementById('catTabs').style.display='flex'; document.getElementById('mediaCardGrid').style.display='grid'; renderMediaCards(curModule); }
                else { document.getElementById('mediaCardGrid').style.display='grid'; renderGenericCards(); }
            }
            function renderMoments() {
                document.getElementById('angleBar').innerHTML = ['全部', ...db.angles].map(a => `<span class="angle-pill ${curAngle===a?'active':''}" onclick="setAngle('${a}')">${a}</span>`).join('');
                let filtered = db.posts.filter(p => p.module === '朋友圈');
                if (curAngle !== '全部') filtered = filtered.filter(p => p.angle === curAngle);
                if (query) filtered = filtered.filter(p => p.text.includes(query));
                const grid = document.getElementById('cardGrid');
                if (!filtered.length) { grid.innerHTML = '<div class="empty-state">暂无文案</div>'; return; }
                grid.innerHTML = filtered.map(p => `<div class="copy-card"><div class="copy-text ${p.text.split('\n').length>6?'':' expanded'}">${p.text.split('\n').slice(0,6).join('<br>')}${p.text.split('\n').length>6?`<span class="expand-btn" onclick="this.parentElement.classList.toggle('expanded')">展开全文</span>`:''}</div></div>`).join('');
            }
            function renderMediaCards(type) {
                const cats = type === '客户见证' ? db.testimonialCategories : db.courseCategories;
                document.getElementById('catTabs').innerHTML = ['全部', ...cats].map(c => `<span class="cat-tab ${curCat===c?'active':''}" onclick="setCat('${c}')">${c}</span>`).join('');
                let items = type === '客户见证' ? db.testimonials : db.courses;
                if (curCat !== '全部') items = items.filter(i => i.category === curCat);
                if (query) items = items.filter(i => (i.title||'').includes(query) || (i.description||'').includes(query));
                const grid = document.getElementById('mediaCardGrid');
                if (!items.length) { grid.innerHTML = '<div class="empty-state">暂无内容</div>'; return; }
                grid.innerHTML = items.map(i => {
                    let imagesHtml = '';
                    if (i.imageUrl) {
                        const urls = i.imageUrl.split(',').map(u => u.trim());
                        imagesHtml = urls.map(u => `<img src="${u}" onerror="this.style.display='none'">`).join('');
                    }
                    return `<div class="media-card">
                        <div class="media-card-image">${imagesHtml || '<i class="fa-solid fa-image" style="font-size:3rem;color:#ccc;"></i>'}</div>
                        <div class="media-card-body"><h4>${i.title||''}</h4><p>${i.description||''}</p></div>
                    </div>`;
                }).join('');
            }
            function renderGenericCards() {
                const contents = [...db.posts.filter(p=>p.module===curModule), ...db.testimonials.filter(t=>t.module===curModule), ...db.courses.filter(c=>c.module===curModule)];
                const grid = document.getElementById('mediaCardGrid');
                if (!contents.length) { grid.innerHTML = '<div class="empty-state">暂无内容</div>'; return; }
                grid.innerHTML = contents.map(c => {
                    let imagesHtml = '';
                    if (c.imageUrl) {
                        const urls = c.imageUrl.split(',').map(u => u.trim());
                        imagesHtml = urls.map(u => `<img src="${u}">`).join('');
                    }
                    return `<div class="media-card">
                        <div class="media-card-image">${imagesHtml || '<i class="fa-solid fa-image"></i>'}</div>
                        <div class="media-card-body"><h4>${c.title||''}</h4><p>${c.description||c.text||''}</p></div>
                    </div>`;
                }).join('');
            }
            window.setAngle = function(a) { curAngle=a; renderSub(); };
            window.setCat = function(c) { curCat=c; renderSub(); };
            window.doSearch = function() { query=document.getElementById('searchInput').value.trim(); renderSub(); };
            loadData().then(() => { renderHome(); });
        })();
    </script>
</body>
</html>
