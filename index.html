<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>易饰乾园素材库 · 文案资产系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2; --card-bg: #FFFFFF; --ink: #1a1815; --ink-light: #5c574f;
            --gold: #b8832a; --gold-pale: #f7f0e0; --border: rgba(0,0,0,0.06);
            --radius-lg: 24px; --radius-full: 50px; --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); font-family:'Noto Sans SC',sans-serif; color:var(--ink); }
        .container { max-width:960px; margin:0 auto; padding:0 24px; }
        .hero { text-align:center; padding:60px 0 40px; }
        .hero-title { font-family:'Noto Serif SC',serif; font-size:2.5rem; }
        .module-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; padding-bottom:40px; }
        .module-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:28px 20px; cursor:pointer; border:1px solid var(--border); box-shadow:var(--shadow-sm); position:relative; }
        .module-card:hover { transform:translateY(-2px); }
        .module-card.locked::after { content:'🔒'; position:absolute; top:8px; right:12px; font-size:1rem; }
        .sub-header { display:flex; justify-content:space-between; padding:20px 0; border-bottom:1px solid var(--border); }
        .angle-bar,.cat-tabs { display:flex; gap:8px; padding:16px 0; }
        .angle-pill,.cat-tab { padding:6px 16px; border-radius:20px; background:var(--card-bg); border:1px solid var(--border); cursor:pointer; font-size:0.8rem; }
        .angle-pill.active,.cat-tab.active { background:var(--ink); color:#fff; }
        .card-grid,.media-card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; padding:20px 0; }
        .copy-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:20px; border:1px solid var(--border); }
        .copy-text { font-size:0.9rem; line-height:1.8; white-space:pre-wrap; max-height:10em; overflow:hidden; }
        .copy-text.expanded { max-height:none; }
        .media-card { background:var(--card-bg); border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--border); cursor:pointer; }
        .media-card-image { height:200px; background:#f0ede5; display:flex; align-items:center; justify-content:center; }
        .media-card-image img { width:100%; height:100%; object-fit:cover; }
        .media-card-body { padding:16px; }
        .copy-btn { cursor:pointer; color:#888; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:8px 20px; border-radius:20px; font-size:0.8rem; opacity:0; z-index:999; }
        .toast.show { opacity:1; }
        .empty-state { text-align:center; color:#ccc; padding:40px; }
    </style>
</head>
<body>
    <div id="homeView"><div class="container"><header class="hero"><h1 class="hero-title">易饰乾园素材库</h1></header>
        <nav class="module-grid" id="moduleGrid"></nav>
    </div></div>
    <div id="subView" style="display:none;"><div class="container">
        <div class="sub-header"><button onclick="goHome()">← 返回</button><h2 id="subTitle"></h2><input type="text" id="searchInput" placeholder="搜索…" oninput="doSearch()"></div>
        <div class="angle-bar" id="angleBar"></div>
        <div class="cat-tabs" id="catTabs"></div>
        <div class="card-grid" id="cardGrid"></div>
        <div class="media-card-grid" id="mediaCardGrid"></div>
        <div class="empty-state">暂无内容</div>
    </div></div>
    <a href="admin.html" style="position:fixed;bottom:20px;right:20px;width:48px;height:48px;background:var(--ink);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;">⚙</a>
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ========== OSS 数据源 ==========
            const DATA_URL = 'https://qiyue111.oss-cn-beijing.aliyuncs.com/ysqysck/ysqy_data.json';

            const CACHE_KEY = 'ysqy_data_cache';
            const VERSION_KEY = 'ysqy_data_version';
            const DEFAULT_ANGLES = ['数字冲击','对话还原','情绪唤醒','场景反差','旁观者视角','预言式','时间轴','选择题','内幕揭秘','反常识','学员故事','身体感知','追问式','画面描写'];
            const LOCK_PWD_KEY = 'ysqy_module_pwd';
            const DEFAULT_LOCK_PWD = 'zheshimima';
            const RESET_CODE = 'ysqy_reset';
            let pendingLockedModule = null;
            let sortOrder = 'desc';

            let db = { modules: [], angles: [], contents: [], _modules: [] };

            function getLocalVersion() { return parseInt(localStorage.getItem(VERSION_KEY) || '0'); }
            function getLocalCache() { const cache = localStorage.getItem(CACHE_KEY); if(cache) { try { return JSON.parse(cache); } catch(e) {} } return null; }
            function setLocalCache(data) { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }
            function setLocalVersion(ver) { localStorage.setItem(VERSION_KEY, ver.toString()); }

            async function loadRemoteData() {
                const res = await fetch(DATA_URL, { cache: 'no-cache' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            }

            function normalizeData(data) {
                if (!data || !data.modules) return createDefaultData();
                const _modules = data.modules;
                let modules = [];
                if (_modules.length && typeof _modules[0] === 'object') modules = _modules.filter(m => m && m.id && m.name).map(m => m.name);
                else if (_modules.length && typeof _modules[0] === 'string') modules = _modules.filter(m => typeof m === 'string');
                if (modules.length === 0) modules = ['朋友圈','客户见证','课程卖点'];
                const angles = data.angles || DEFAULT_ANGLES;
                const contents = (data.contents || []).map(c => { if (!c.module) { const mod = _modules.find(m => m.id === c.moduleId); c.module = mod ? mod.name : ''; } return c; });
                return { modules, angles, contents, _modules };
            }

            function createDefaultData() {
                return { modules: ['朋友圈','客户见证','课程卖点'], angles: DEFAULT_ANGLES, contents: [], _modules: [
                    { id:'pyq', name:'朋友圈', type:'moments', categories:['数字冲击','对话还原','情绪唤醒'], locked: false },
                    { id:'witness', name:'客户见证', type:'testimonial', categories:['文昌','沙龙','成交'], locked: false },
                    { id:'course', name:'课程卖点', type:'course', categories:['核心价值','课程亮点'], locked: false }
                ]};
            }

            let currentModule = null, currentAngle = '全部', currentCategory = '全部', searchQuery = '';

            function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }
            window.handleCopy = function(btn) { const text=btn.getAttribute('data-copy'); if(!text)return; navigator.clipboard.writeText(text).then(()=>toast('已复制 ✓')); };

            function renderHome() {
                const grid = document.getElementById('moduleGrid');
                const icons = { '朋友圈':'fa-pen-to-square', '客户见证':'fa-comments', '课程卖点':'fa-graduation-cap' };
                grid.innerHTML = db.modules.map(m => {
                    const mod = db._modules.find(md => md.name === m);
                    const locked = mod?.locked || false;
                    return `<div class="module-card ${locked ? 'locked' : ''}" onclick="${locked ? `showLockModal('${m}')` : `openModule('${m}')`}"><div class="module-card-icon"><i class="fa-solid ${icons[m] || 'fa-folder'}"></i></div><div class="module-card-title">${m}</div></div>`;
                }).join('');
            }

            window.showLockModal = function(moduleName) {
                pendingLockedModule = moduleName;
                document.getElementById('lockPwdInput').value = '';
                document.getElementById('lockError').textContent = '';
                document.getElementById('lockModal').style.display = 'flex';
                document.getElementById('lockPwdInput').focus();
            };
            window.closeLockModal = function() { document.getElementById('lockModal').style.display = 'none'; pendingLockedModule = null; };
            window.verifyLockPwd = function() {
                if (document.getElementById('lockPwdInput').value === (localStorage.getItem(LOCK_PWD_KEY) || DEFAULT_LOCK_PWD)) {
                    const target = pendingLockedModule;
                    closeLockModal();
                    if (target) openModule(target);
                } else document.getElementById('lockError').textContent = '密码错误';
            };
            window.showForgotLockPwd = function() {
                const code = prompt('请输入重置暗号');
                if (code === RESET_CODE) { localStorage.removeItem(LOCK_PWD_KEY); toast('密码已重置为默认密码'); closeLockModal(); }
                else if (code !== null) alert('暗号错误');
            };

            window.openModule = function(m) { currentModule=m; currentAngle='全部'; currentCategory='全部'; searchQuery=''; document.getElementById('homeView').style.display='none'; document.getElementById('subView').style.display='block'; document.getElementById('subTitle').textContent=m; renderSubPage(); };
            window.goHome = function() { document.getElementById('subView').style.display='none'; document.getElementById('homeView').style.display='block'; };

            window.toggleSortOrder = function() { sortOrder = sortOrder === 'desc' ? 'asc' : 'desc'; renderSubPage(); };

            function renderSubPage() {
                if (!currentModule) return;
                document.getElementById('angleBar').style.display='none';
                document.getElementById('catTabs').style.display='none';
                document.getElementById('cardGrid').style.display='none';
                document.getElementById('mediaCardGrid').style.display='none';
                const mod = db._modules.find(m => m.name === currentModule);
                const cats = mod?.categories || [];
                if (currentModule === '朋友圈') {
                    document.getElementById('angleBar').style.display='flex';
                    document.getElementById('cardGrid').style.display='grid';
                    document.getElementById('angleBar').innerHTML = ['全部', ...db.angles].map(a => `<span class="angle-pill ${currentAngle===a?'active':''}" onclick="setAngle('${a}')">${a}</span>`).join('');
                    let items = db.contents.filter(c => c.module === '朋友圈' && c.angle);
                    if (currentAngle !== '全部') items = items.filter(c => c.angle === currentAngle);
                    if (searchQuery) items = items.filter(c => c.text.includes(searchQuery));
                    items = sortContents(items);
                    renderMoments(items);
                } else {
                    if (cats.length > 0) { document.getElementById('catTabs').style.display='flex'; document.getElementById('catTabs').innerHTML = ['全部', ...cats].map(c => `<span class="cat-tab ${currentCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</span>`).join(''); }
                    document.getElementById('mediaCardGrid').style.display='grid';
                    let items = db.contents.filter(c => c.module === currentModule);
                    if (currentCategory !== '全部') items = items.filter(c => c.category === currentCategory);
                    if (searchQuery) items = items.filter(c => (c.title||'').includes(searchQuery) || (c.description||c.text||'').includes(searchQuery));
                    items = sortContents(items);
                    renderMediaCards(items);
                }
            }

            function sortContents(items) { return items.sort((a,b) => { const tA = a.time || a.id || 0, tB = b.time || b.id || 0; return sortOrder === 'desc' ? tB - tA : tA - tB; }); }
            function renderMoments(items) {
                const grid = document.getElementById('cardGrid');
                if (!items.length) { grid.innerHTML = '<div class="empty-state">暂无文案</div>'; return; }
                grid.innerHTML = items.map(p => {
                    const text = (p.text||'').split('\n').map(l=>l.trim()).join('\n');
                    const truncated = text.split('\n').length > 6;
                    const display = truncated ? text.split('\n').slice(0,6).join('<br>') + '<span class="expand-btn" onclick="this.parentElement.classList.toggle(\'expanded\')"> 展开全文</span>' : text.replace(/\n/g,'<br>');
                    return `<div class="copy-card"><div class="copy-text ${truncated?'':'expanded'}">${display}</div><div class="card-meta"><span># ${p.angle}</span><span class="copy-btn" data-copy="${text.replace(/"/g,'&quot;')}" onclick="event.stopPropagation();handleCopy(this)"><i class="fa-regular fa-clone"></i> 复制</span></div></div>`;
                }).join('');
            }
            function renderMediaCards(items) {
                const grid = document.getElementById('mediaCardGrid');
                if (!items.length) { grid.innerHTML = '<div class="empty-state">暂无内容</div>'; return; }
                let html = '';
                items.forEach(item => {
                    const copyText = ((item.title||'') + '\n' + (item.description||item.text||'')).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
                    const images = (item.imageUrl||'').split(',').map(u=>u.trim()).filter(u=>u);
                    const jumpLink = item.jumpUrl || '';
                    const clickAction = jumpLink ? `window.open('${jumpLink}', '_blank')` : `openLightbox('${images[0]||''}','')`;
                    if (images.length) images.forEach(img => { html += `<div class="media-card"><div class="media-card-image" onclick="event.stopPropagation();${clickAction}"><img src="${img}" loading="lazy"></div><div class="media-card-body"><h3>${item.title||''}</h3><div class="desc">${item.description||''}</div><span>${item.date||''}</span></div></div>`; });
                    else html += `<div class="media-card"><div class="media-card-image" onclick="event.stopPropagation();${jumpLink ? `window.open('${jumpLink}', '_blank')` : ''}"><i class="fa-solid fa-image"></i></div><div class="media-card-body"><h3>${item.title||''}</h3><div class="desc">${item.description||''}</div><span>${item.date||''}</span></div></div>`;
                });
                grid.innerHTML = html;
            }

            window.setAngle = function(a) { currentAngle=a; renderSubPage(); };
            window.setCategory = function(c) { currentCategory=c; renderSubPage(); };
            window.doSearch = function() { searchQuery=document.getElementById('searchInput').value.trim(); renderSubPage(); };

            async function loadData() {
                const localCache = getLocalCache();
                if (localCache) { db = localCache; renderHome(); }
                try {
                    const remoteData = await loadRemoteData();
                    const remoteVersion = remoteData.version || 0;
                    const localVersion = getLocalVersion();
                    if (remoteVersion > localVersion || !localCache) {
                        db = normalizeData(remoteData);
                        setLocalCache(db);
                        setLocalVersion(remoteVersion);
                        renderHome();
                        if (currentModule) renderSubPage();
                    }
                } catch (e) {
                    console.error('OSS 加载失败:', e);
                    if (!localCache) { db = createDefaultData(); renderHome(); }
                }
            }

            loadData();
        })();
    </script>
</body>
</html>
