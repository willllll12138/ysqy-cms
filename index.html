<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园 · 发圈文案库</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --ink: #0e0b08;
  --gold: #b8832a;
  --gold2: #d4a84b;
  --goldl: #f2dfa0;
  --cream: #f9f4ec;
  --mist: #ddd4c0;
  --char: #2a2318;
  --rust: #7a3520;
  --sage: #4a6040;
  --steel: #3a4a5a;
  --rose: #7a3040;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--cream);
  font-family:'Noto Sans SC',sans-serif;
  color:var(--ink);
  min-height:100vh;
}

/* HERO */
.hero{
  background:var(--ink);
  padding:56px 32px 44px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 25% 60%,rgba(184,131,42,.15) 0%,transparent 55%),
              radial-gradient(ellipse at 80% 20%,rgba(184,131,42,.08) 0%,transparent 50%);
}
.hero::after{
  content:'';
  position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.hero-eyebrow{
  font-size:.6rem;letter-spacing:.45em;color:var(--gold);
  margin-bottom:20px;display:flex;align-items:center;
  justify-content:center;gap:16px;position:relative;
}
.hero-eyebrow::before,.hero-eyebrow::after{
  content:'';width:32px;height:1px;background:rgba(184,131,42,.35);
}
.hero h1{
  font-family:'Noto Serif SC',serif;
  font-size:clamp(1.5rem,4vw,2.2rem);
  font-weight:900;color:#fff;
  letter-spacing:.1em;line-height:1.25;position:relative;
}
.hero h1 em{color:var(--gold2);font-style:normal;}
.hero-desc{
  margin-top:12px;font-size:.72rem;
  color:rgba(255,255,255,.38);letter-spacing:.22em;position:relative;
}
.hero-stats{
  margin-top:32px;display:flex;justify-content:center;gap:44px;position:relative;
}
.stat-num{
  font-family:'Noto Serif SC',serif;font-size:1.9rem;font-weight:700;
  color:var(--gold2);line-height:1;
}
.stat-label{font-size:.58rem;color:rgba(255,255,255,.35);letter-spacing:.2em;margin-top:5px;}

/* LEGEND TABS */
.legend-wrap{
  background:var(--char);
  position:sticky;top:0;z-index:100;
  overflow-x:auto;scrollbar-width:none;
}
.legend-wrap::-webkit-scrollbar{display:none;}
.legend{
  display:flex;padding:0 20px;min-width:max-content;
}
.leg-btn{
  flex-shrink:0;padding:13px 16px;
  font-size:.65rem;letter-spacing:.12em;
  color:rgba(255,255,255,.38);cursor:pointer;
  border:none;border-bottom:2px solid transparent;
  background:none;font-family:inherit;
  transition:all .18s;white-space:nowrap;
}
.leg-btn:hover{color:rgba(255,255,255,.7);}
.leg-btn.on{color:var(--gold2);border-bottom-color:var(--gold2);}

/* TOOLBAR */
.toolbar{
  max-width:1160px;margin:32px auto 20px;
  padding:0 22px;display:flex;gap:10px;align-items:center;
}
.search{
  flex:1;padding:9px 16px;
  border:1px solid var(--mist);background:white;
  font-size:.8rem;font-family:inherit;color:var(--ink);
  outline:none;transition:border-color .2s;
}
.search:focus{border-color:var(--gold);}
.search::placeholder{color:#ccc;}
.btn-top{
  padding:9px 16px;font-size:.65rem;letter-spacing:.13em;
  cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:all .2s;border:1px solid var(--mist);
  background:white;color:#888;
}
.btn-top:hover{border-color:var(--gold);color:var(--gold);}
.btn-copy-all{
  padding:9px 18px;background:var(--ink);color:var(--gold2);
  border:none;font-size:.65rem;letter-spacing:.14em;
  cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:background .2s;
}
.btn-copy-all:hover{background:var(--char);}

/* LOADING */
.loading{
  text-align:center;padding:80px 24px;color:#bbb;
  font-size:.85rem;letter-spacing:.15em;
  grid-column:1/-1;
}
.loading-spinner{
  width:32px;height:32px;border:2px solid var(--mist);
  border-top-color:var(--gold);border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* GRID */
.grid{
  max-width:1160px;margin:0 auto;
  padding:0 22px 80px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:14px;
}

/* CARD */
.card{
  background:white;border:1px solid var(--mist);
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
  animation:fadeUp .3s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.09);}

.card-stripe{height:3px;}
.s-gold .card-stripe{background:linear-gradient(90deg,var(--gold),var(--goldl));}
.s-rust .card-stripe{background:linear-gradient(90deg,var(--rust),#c06040);}
.s-sage .card-stripe{background:linear-gradient(90deg,var(--sage),#7a9a70);}
.s-steel .card-stripe{background:linear-gradient(90deg,var(--steel),#6a8aaa);}
.s-rose .card-stripe{background:linear-gradient(90deg,var(--rose),#b06080);}
.s-char .card-stripe{background:linear-gradient(90deg,var(--char),#6a6050);}

.card-head{
  padding:16px 18px 0;
  display:flex;align-items:center;justify-content:space-between;
}
.card-angle{
  font-size:.55rem;letter-spacing:.18em;font-weight:500;padding:3px 8px;
}
.s-gold .card-angle{color:var(--gold);background:#fdf7ec;}
.s-rust .card-angle{color:var(--rust);background:#fdf0ec;}
.s-sage .card-angle{color:var(--sage);background:#eff5ef;}
.s-steel .card-angle{color:var(--steel);background:#eff3f7;}
.s-rose .card-angle{color:var(--rose);background:#fdeef2;}
.s-char .card-angle{color:var(--char);background:#f2f0ec;}

.card-no{
  font-family:'Noto Serif SC',serif;
  font-size:.7rem;font-weight:700;color:var(--mist);
}
.card-body{
  padding:14px 18px 4px;
  font-size:.875rem;line-height:2.1;
  font-weight:300;color:var(--char);letter-spacing:.025em;
}
.card-foot{
  padding:10px 18px 14px;
  display:flex;align-items:center;justify-content:space-between;
}
.card-struct{font-size:.55rem;color:#bbb;letter-spacing:.1em;}
.btn-copy{
  font-size:.58rem;letter-spacing:.1em;padding:3px 10px;
  border:1px solid var(--mist);background:none;color:#bbb;
  cursor:pointer;font-family:inherit;transition:all .18s;
}
.btn-copy:hover{border-color:var(--gold);color:var(--gold);}
.btn-copy.ok{border-color:var(--sage);color:var(--sage);}

.empty{
  text-align:center;padding:60px;color:#ccc;
  font-size:.85rem;letter-spacing:.12em;grid-column:1/-1;
}

/* TOAST */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:#fff;
  padding:8px 20px;font-size:.7rem;letter-spacing:.1em;
  opacity:0;transition:all .22s;pointer-events:none;z-index:999;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* FOOTER */
.footer{
  text-align:center;padding:20px;
  font-size:.6rem;color:#ccc;letter-spacing:.15em;
  border-top:1px solid var(--mist);
}
.footer a{color:var(--gold);text-decoration:none;}
.footer a:hover{text-decoration:underline;}

/* ERROR BANNER */
.error-banner{
  background:#fff3f0;border:1px solid #f0b0a0;
  padding:12px 20px;font-size:.75rem;color:var(--rust);
  letter-spacing:.08em;text-align:center;
  max-width:1160px;margin:16px auto 0;
}

@media(max-width:580px){
  .grid{grid-template-columns:1fr;padding:0 14px 60px;}
  .hero{padding:40px 18px 32px;}
  .hero-stats{gap:24px;}
  .toolbar{padding:0 14px;flex-wrap:wrap;}
}
</style>
</head>

// ── 状态 ──
let allData = [];
let curAngle = 'ALL';
let curQ = '';
let isLocalMode = false;

// ── 读取数据 ──
async function loadData() {
  // 若未配置 JSONBin，直接使用默认数据
  if (BIN_ID === 'JSONBIN_BIN_ID') {
    isLocalMode = true;
    allData = JSON.parse(localStorage.getItem('ysqy_posts') || 'null') || DEFAULT_DATA;
    updateCount();
    render();
    return;
  }
  try {
    const res = await fetch(`${BASE_URL}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    if (!res.ok) throw new Error('API错误 ' + res.status);
    const json = await res.json();
    allData = json.record.posts || DEFAULT_DATA;
  } catch(e) {
    showError('云端加载失败，已切换本地模式：' + e.message);
    allData = JSON.parse(localStorage.getItem('ysqy_posts') || 'null') || DEFAULT_DATA;
  }
  updateCount();
  render();
}

function updateCount() {
  document.getElementById('totalCount').textContent = allData.length;
}

// ── 渲染 ──
function render() {
  const grid = document.getElementById('grid');
  let list = allData;
  if (curAngle !== 'ALL') list = list.filter(d => d.angle === curAngle);
  if (curQ) list = list.filter(d =>
    d.text.includes(curQ) || d.angle.includes(curQ) || (d.struct||'').includes(curQ)
  );
  if (!list.length) {
    grid.innerHTML = '<div class="empty">暂无匹配文案</div>';
    return;
  }
  grid.innerHTML = list.map((d, i) => {
    const lines = d.text.split('\n').join('<br>');
    const escapedText = d.text.replace(/`/g,'\\`').replace(/\\/g,'\\\\');
    return `
    <div class="card ${d.scheme}" style="animation-delay:${i*0.04}s">
      <div class="card-stripe"></div>
      <div class="card-head">
        <span class="card-angle">${d.angle}</span>
        <span class="card-no">${d.no}</span>
      </div>
      <div class="card-body">${lines}</div>
      <div class="card-foot">
        <span class="card-struct">${d.struct||''}</span>
        <button class="btn-copy" onclick="cpOne(this,\`${escapedText}\`)">复制</button>
      </div>
    </div>`;
  }).join('');
}

function flt(angle, btn) {
  curAngle = angle;
  document.querySelectorAll('.leg-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function doSearch(v) { curQ = v.trim(); render(); }

function cpOne(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓';
    btn.classList.add('ok');
    toast('已复制 ✓');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('ok'); }, 1800);
  });
}
function copyAll() {
  const list = curAngle === 'ALL' ? allData : allData.filter(d => d.angle === curAngle);
  const all = list.map(d => `【${d.no} · ${d.angle}】\n${d.text}`).join('\n\n---\n\n');
  navigator.clipboard.writeText(all).then(() => toast(`已复制 ${list.length} 条文案 ✓`));
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2000);
}
function showError(msg) {
  const b = document.getElementById('errorBanner');
  b.style.display = 'block'; b.textContent = '⚠ ' + msg;
}

loadData();

// ── 监听 localStorage 变化（同浏览器跨标签页同步）──
window.addEventListener('storage', e => {
  if (e.key === 'ysqy_posts') {
    allData = JSON.parse(e.newValue) || DEFAULT_DATA;
    updateCount();
    render();
  }
});
</script>
