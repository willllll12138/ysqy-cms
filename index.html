<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园 · 文案资产库 v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-page: #F7F5F0;       /* 柔和米色底 */
            --bg-card: #FFFFFF;
            --primary-ink: #1D1D1F;   /* 苹果风墨黑 */
            --accent-terracotta: #C66A4E; /* 陶土色 (活力) */
            --soft-sage: #849688;     /* 鼠尾草绿 (简约) */
            --border-color: rgba(0,0,0,0.06);
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Noto Sans SC', sans-serif;
            --transition-smooth: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* --- 基础样式优化 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-page); 
            font-family: var(--font-sans); 
            color: var(--primary-ink);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- 丝滑动效 --- */
        .fade-in-up {
            animation: fadeInUp 0.8s var(--transition-smooth) forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 导航与模块切换 (类似17yongai) --- */
        .app-header {
            padding: 80px 40px 40px;
            text-align: center;
        }

        .main-title {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }

        .module-tabs {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .module-tab {
            padding: 15px 0;
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
            opacity: 0.4;
            transition: var(--transition-smooth);
        }
        .module-tab.active {
            opacity: 1;
            font-weight: 500;
        }
        .module-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 2px;
            background: var(--primary-ink);
        }

        /* --- 角度过滤 (Pills样式) --- */
        .angle-bar {
            display: flex;
            gap: 12px;
            padding: 20px 40px;
            overflow-x: auto;
            scrollbar-width: none;
            position: sticky;
            top: 0;
            background: rgba(247, 245, 240, 0.8);
            backdrop-filter: blur(20px);
            z-index: 90;
        }
        .angle-bar::-webkit-scrollbar { display: none; }

        .angle-pill {
            padding: 8px 24px;
            border-radius: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
        }
        .angle-pill.active {
            background: var(--primary-ink);
            color: white;
            border-color: var(--primary-ink);
        }

        /* --- 文案卡片网格 --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        .copy-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 35px;
            transition: var(--transition-smooth);
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .copy-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.06);
            border-color: var(--border-color);
        }

        .copy-text {
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.8;
            margin-bottom: 25px;
            white-space: pre-wrap;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #999;
        }

        /* --- 后台管理抽屉 --- */
        .drawer {
            position: fixed;
            right: -100%; top: 0; width: 480px; height: 100vh;
            background: white; z-index: 1000; padding: 50px;
            box-shadow: -20px 0 60px rgba(0,0,0,0.1);
            transition: var(--transition-smooth);
            overflow-y: auto;
        }
        .drawer.open { right: 0; }

        .admin-btn {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--primary-ink); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .manage-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #EEE;
        }

        input, textarea, select {
            width: 100%; padding: 15px; margin-top: 8px; margin-bottom: 20px;
            border: 1px solid #EEE; border-radius: 12px; font-family: inherit;
        }
        .btn-action {
            padding: 15px; width: 100%; border: none; border-radius: 12px;
            background: var(--primary-ink); color: white; cursor: pointer; font-weight: 500;
        }

        .tag-manager {
            display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px;
        }
        .tag-item {
            background: #F0F0F0; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem;
            display: flex; align-items: center; gap: 5px;
        }
        .tag-item i { cursor: pointer; color: #CC0000; }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .drawer { width: 100%; }
            .main-title { font-size: 2.2rem; }
            .card-grid { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="admin-btn" onclick="toggleDrawer()"><i class="fa-solid fa-sliders"></i></div>

    <header class="app-header">
        <div class="hero-sub" style="letter-spacing: 0.4em; font-size: 0.8rem; opacity: 0.5; margin-bottom: 10px;">YISHI QIANYUAN</div>
        <h1 class="main-title">易饰乾园</h1>
        <p style="opacity: 0.6; font-weight: 300;">极简文案资产 · 驱动品牌生长</p>
        
        <div class="module-tabs" id="module-tabs">
            </div>
    </header>

    <div class="angle-bar" id="angle-bar">
        </div>

    <main class="card-grid" id="card-grid">
        </main>

    <div class="drawer" id="admin-drawer">
        <i class="fa-solid fa-xmark" style="position:absolute; top:30px; left:30px; cursor:pointer;" onclick="toggleDrawer()"></i>
        <h2 style="font-family: var(--font-serif); margin-bottom: 30px;">库管理中心</h2>

        <div id="admin-auth">
            <p style="margin-bottom: 10px; font-size: 0.9rem; opacity: 0.6;">身份校验</p>
            <input type="password" id="admin-pwd" placeholder="输入进入密码...">
            <button class="btn-action" onclick="verifyAdmin()">进入管理</button>
        </div>

        <div id="admin-content" style="display: none;">
            <div class="manage-section">
                <h3><i class="fa-solid fa-plus-circle"></i> 发布新文案</h3>
                <select id="new-module"></select>
                <select id="new-angle"></select>
                <textarea id="new-text" placeholder="在这里输入文案正文..." rows="6"></textarea>
                <button class="btn-action" onclick="publishCopy()">立即同步发布</button>
            </div>

            <div class="manage-section">
                <h3><i class="fa-solid fa-tags"></i> 模块/角度管理</h3>
                <p style="font-size: 0.8rem; margin: 15px 0 5px;">管理“模块”（顶部大类）：</p>
                <div class="tag-manager" id="module-manager"></div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="add-module-input" placeholder="新模块名..." style="margin-bottom:0">
                    <button onclick="addTag('modules')" style="padding:10px; border-radius:12px; border:1px solid #CCC; background:none;">添加</button>
                </div>

                <p style="font-size: 0.8rem; margin: 15px 0 5px;">管理“角度”（二级筛选）：</p>
                <div class="tag-manager" id="angle-manager"></div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="add-angle-input" placeholder="新角度名..." style="margin-bottom:0">
                    <button onclick="addTag('angles')" style="padding:10px; border-radius:12px; border:1px solid #CCC; background:none;">添加</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 初始化配置 (请替换为您自己的 JSONBin 凭证) ---
        const BIN_ID = 'YOUR_BIN_ID'; 
        const MASTER_KEY = 'YOUR_MASTER_KEY';
        const ACCESS_PWD = 'ysqy_admin_pwd'; // 管理密码

        let db = {
            modules: ["朋友圈", "课程手册", "品牌故事"],
            angles: ["数字冲击", "对话还原", "情绪唤醒", "场景反差"],
            posts: []
        };

        let currentModule = "朋友圈";
        let currentAngle = "全部";

        // --- 核心功能：数据交互 ---
        async function loadData() {
            if(BIN_ID === 'YOUR_BIN_ID') {
                // 本地演示数据
                renderAll();
                return;
            }
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                db = data.record;
                renderAll();
            } catch(e) { console.error("加载失败", e); }
        }

        async function syncToCloud() {
            if(BIN_ID === 'YOUR_BIN_ID') return alert("请先在代码中配置您的 JSONBin ID");
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                    body: JSON.stringify(db)
                });
                renderAll();
            } catch(e) { alert("同步失败"); }
        }

        // --- 核心功能：渲染 ---
        function renderAll() {
            renderModules();
            renderAngles();
            renderCards();
            renderManager(); // 管理界面的标签
        }

        function renderModules() {
            const container = document.getElementById('module-tabs');
            container.innerHTML = db.modules.map(m => `
                <div class="module-tab ${currentModule === m ? 'active' : ''}" onclick="setModule('${m}')">${m}</div>
            `).join('');

            // 更新发布下拉框
            document.getElementById('new-module').innerHTML = db.modules.map(m => `<option value="${m}">${m}</option>`).join('');
        }

        function renderAngles() {
            const container = document.getElementById('angle-bar');
            const list = ["全部", ...db.angles];
            container.innerHTML = list.map(a => `
                <div class="angle-pill ${currentAngle === a ? 'active' : ''}" onclick="setAngle('${a}')">${a}</div>
            `).join('');

            // 更新发布下拉框
            document.getElementById('new-angle').innerHTML = db.angles.map(a => `<option value="${a}">${a}</option>`).join('');
        }

        function renderCards() {
            const container = document.getElementById('card-grid');
            let filtered = db.posts.filter(p => p.module === currentModule);
            if(currentAngle !== "全部") filtered = filtered.filter(p => p.angle === currentAngle);

            if(filtered.length === 0) {
                container.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:100px; opacity:0.3;">暂无此类文案，点击右下角发布</p>`;
                return;
            }

            container.innerHTML = filtered.map((p, i) => `
                <div class="copy-card fade-in-up" style="animation-delay: ${i*0.1}s">
                    <div class="copy-text">${p.text}</div>
                    <div class="card-meta">
                        <span># ${p.angle}</span>
                        <i class="fa-regular fa-clone" style="cursor:pointer; font-size:1rem;" onclick="copyMe('${p.text.replace(/\n/g, '\\n')}')"></i>
                    </div>
                </div>
            `).join('');
        }

        function renderManager() {
            document.getElementById('module-manager').innerHTML = db.modules.map(m => `
                <div class="tag-item">${m} <i class="fa-solid fa-circle-xmark" onclick="removeTag('modules', '${m}')"></i></div>
            `).join('');
            document.getElementById('angle-manager').innerHTML = db.angles.map(a => `
                <div class="tag-item">${a} <i class="fa-solid fa-circle-xmark" onclick="removeTag('angles', '${a}')"></i></div>
            `).join('');
        }

        // --- 逻辑控制 ---
        function setModule(m) { currentModule = m; currentAngle = "全部"; renderAll(); }
        function setAngle(a) { currentAngle = a; renderAll(); }

        function toggleDrawer() { document.getElementById('admin-drawer').classList.toggle('open'); }

        function verifyAdmin() {
            if(document.getElementById('admin-pwd').value === ACCESS_PWD) {
                document.getElementById('admin-auth').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
            } else { alert("密码错误"); }
        }

        function publishCopy() {
            const text = document.getElementById('new-text').value;
            const module = document.getElementById('new-module').value;
            const angle = document.getElementById('new-angle').value;
            if(!text) return;
            db.posts.unshift({ text, module, angle, time: new Date().getTime() });
            syncToCloud();
            document.getElementById('new-text').value = "";
            alert("发布成功并已同步云端");
        }

        function addTag(type) {
            const input = document.getElementById(`add-${type.slice(0,-1)}-input`);
            if(!input.value) return;
            db[type].push(input.value);
            input.value = "";
            syncToCloud();
        }

        function removeTag(type, val) {
            if(!confirm(`确定删除“${val}”吗？这可能影响已有文案的显示`)) return;
            db[type] = db[type].filter(item => item !== val);
            syncToCloud();
        }

        function copyMe(text) {
            navigator.clipboard.writeText(text.replace(/\\n/g, '\n')).then(() => alert("已复制到剪贴板"));
        }

        window.onload = loadData;
    </script>
</body>
</html>
