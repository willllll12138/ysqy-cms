<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园 · 发圈文案库</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --bg: #0f0f0f;
  --card: #1a1a1a;
  --text: #e8d9c0;
  --gold: #C66A4E;
  --gold2: #d4a84b;
}

* {margin:0;padding:0;box-sizing:border-box;}
body {
  background: var(--bg);
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--text);
  min-height: 100vh;
}

/* HERO */
.hero{
  background: #111;
  padding: 90px 32px 60px;
  text-align:center;
  position:relative;
}
.hero h1{
  font-family:'Noto Serif SC',serif;
  font-size:clamp(2.6rem,8vw,4.2rem);
  font-weight:900;
  letter-spacing:.1em;
  color:#fff;
}
.hero h1 em{color:var(--gold2);}
.hero-desc{
  margin-top:16px;font-size:1.05rem;color:#aaa;letter-spacing:.25em;
}

/* TABS */
.legend-wrap{
  background:#151515;
  position:sticky;top:0;z-index:100;
  overflow-x:auto;
  border-bottom:1px solid #222;
}
.legend{
  display:flex;padding:0 20px;
}
.leg-btn{
  padding:18px 24px;
  font-size:1rem;
  color:#888;
  cursor:pointer;
  border:none;
  background:none;
  white-space:nowrap;
  transition:all .3s;
}
.leg-btn.on{
  color:var(--gold);
  border-bottom:3px solid var(--gold);
}

/* GRID */
.grid{
  max-width:1280px;
  margin:40px auto;
  padding:0 22px 100px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:28px;
}

.card{
  background:var(--card);
  border:1px solid #333;
  border-radius:12px;
  overflow:hidden;
  transition:all .5s cubic-bezier(0.23,1,0.32,1);
}
.card:hover{
  transform:translateY(-16px);
  border-color:var(--gold);
  box-shadow:0 40px 80px rgba(198,106,78,0.18);
}

.card-stripe{height:4px;}
.s-gold .card-stripe{background:linear-gradient(90deg,var(--gold),var(--gold2));}
.s-rust .card-stripe{background:linear-gradient(90deg,#c55,#e88);}
.s-sage .card-stripe{background:linear-gradient(90deg,#6a8,#8b9);}
.s-steel .card-stripe{background:linear-gradient(90deg,#557,#88a);}
.s-rose .card-stripe{background:linear-gradient(90deg,#a57,#d79);}
.s-char .card-stripe{background:linear-gradient(90deg,#555,#888);}

.card-head{
  padding:18px 24px 10px;
  display:flex;justify-content:space-between;
}
.card-angle{font-size:0.85rem;letter-spacing:0.1em;padding:4px 12px;border-radius:6px;}
.s-gold .card-angle{background:rgba(198,106,78,0.2);color:var(--gold);}
.card-no{font-family:'Noto Serif SC',serif;color:#666;}

.card-body{
  padding:8px 24px 20px;
  font-size:1.05rem;
  line-height:1.95;
  color:#ddd;
}
.card-foot{
  padding:14px 24px;
  border-top:1px solid #222;
  display:flex;justify-content:space-between;align-items:center;
  color:#888;
}
.btn-copy{
  padding:8px 20px;
  border:1px solid #555;
  background:transparent;
  color:#bbb;
  cursor:pointer;
  border-radius:6px;
}
.btn-copy:hover{
  border-color:var(--gold);
  color:var(--gold);
}

.toast{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
  background:#1f1f1f;border:1px solid var(--gold);color:var(--gold2);
  padding:14px 32px;border-radius:8px;opacity:0;transition:.3s;z-index:999;
}
.toast.on{opacity:1;}
</style>
</head>

<div class="hero
