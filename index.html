<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园 · 文案资产库</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F7F5F0;
            --card: #FFFFFF;
            --ink: #1D1D1F;
            --terracotta: #C66A4E;
            --sage: #849688;
            --border: rgba(0,0,0,0.08);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--ink);
            line-height: 1.8;
            overflow-x: hidden;
        }
        .header {
            padding: 120px 40px 60px;
            text-align: center;
            background: linear-gradient(to bottom, #F7F5F0, rgba(247,245,240,0.95));
        }
        .title {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(2.8rem, 8vw, 4.5rem);
            letter-spacing: 0.12em;
            margin-bottom: 12px;
        }
        .subtitle { opacity: 0.65; font-weight: 300; font-size: 1.1rem; }

        .tabs {
            display: flex; justify-content: center; gap: 40px; margin: 50px 0 30px;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 12px 0;
            font-size: 1.15rem;
            cursor: pointer;
            position: relative;
            opacity: 0.5;
            transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
        }
        .tab.active { opacity: 1; font-weight: 500; }
        .tab.active::after {
            content:''; position:absolute; bottom:-1px; left:0; width:100%; height:3px;
            background: var(--ink);
        }

        .angle-bar {
            display: flex; gap: 12px; padding: 20px 40px; overflow-x: auto;
            background: rgba(247,245,240,0.95); backdrop-filter: blur(12px);
            position: sticky; top:0; z-index: 100;
        }
        .pill {
            padding: 10px 28px; border-radius: 50px; background: white;
            border: 1px solid var(--border); white-space: nowrap; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
        }
        .pill.active {
            background: var(--ink); color: white; border-color: var(--ink);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 32px;
            padding: 40px;
        }
        .card {
            background: var(--card);
            border-radius: 28px;
            padding: 42px 36px;
            transition: all 0.6s cubic-bezier(0.23,1,0.32,1);
            border: 1px solid transparent;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }
        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 40px 80px rgba(0,0,0,0.1);
            border-color: var(--border);
        }
        .copy-text {
            font-size: 1.15rem;
            line-height: 1.85;
            margin-bottom: 28px;
            white-space: pre-wrap;
        }
        .meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85rem; color: #888;
        }

        .admin-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 68px; height: 68px; background: var(--ink); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; cursor: pointer; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            z-index: 999;
        }

        @media (max-width: 768px) {
            .grid { padding: 20px; gap: 24px; }
            .card { padding: 32px 24px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div style="letter-spacing:0.4em; font-size:0.85rem; opacity:0.6; margin-bottom:8px;">YISHI QIANYUAN</div>
    <h1 class="title">易饰乾园</h1>
    <p class="subtitle">极简文案资产库 · 驱动品牌自然生长</p>

    <div class="tabs" id="module-tabs"></div>
</div>

<div class="angle-bar" id="angle-bar"></div>

<main class="grid" id="card-grid"></main>

<div class="admin-btn" onclick="window.open('admin.html','_blank')">
    <i class="fa-solid fa-sliders"></i>
</div>

<script>
// === 配置区 ===
const BIN_ID = 'YOUR_BIN_ID';           // ← 改成你的 JSONBin ID
const MASTER_KEY = 'YOUR_MASTER_KEY';

let db = {
    modules: ["朋友圈", "课程手册", "品牌故事"],
    angles: ["数字冲击", "对话还原", "情绪唤醒", "场景反差"],
    posts: []
};

let currentModule = "朋友圈";
let currentAngle = "全部";

// 加载 & 渲染（同之前逻辑，略微精简）
async function loadData() { /* ... 同你原来的 loadData ... */ renderAll(); }

function renderAll() {
    renderModules();
    renderAngles();
    renderCards();
}

function renderModules() { /* ... */ }
function renderAngles() { /* ... */ }

function renderCards() {
    const container = document.getElementById('card-grid');
    let filtered = db.posts.filter(p => p.module === currentModule);
    if (currentAngle !== "全部") filtered = filtered.filter(p => p.angle === currentAngle);

    container.innerHTML = filtered.length ? filtered.map((p,i) => `
        <div class="card">
            <div class="copy-text">${p.text}</div>
            <div class="meta">
                <span>#${p.angle}</span>
                <i class="fa-regular fa-clone" onclick="copyText('${p.text.replace(/\n/g,'\\n')}')"></i>
            </div>
        </div>
    `).join('') : `<p style="grid-column:1/-1;text-align:center;padding:120px 20px;opacity:0.4;font-size:1.1rem;">暂无文案，前往后台发布</p>`;
}

function copyText(t) {
    navigator.clipboard.writeText(t.replace(/\\n/g,'\n'));
    alert('已复制到剪贴板');
}

// 切换
function setModule(m){ currentModule=m; currentAngle="全部"; renderAll(); }
function setAngle(a){ currentAngle=a; renderAll(); }

window.onload = loadData;
</script>
</body>
</html>
