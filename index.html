<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园素材库</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --bg: #F7F5F0;
  --ink: #1D1D1F;
  --gold: #C66A4E;
}

* {margin:0;padding:0;box-sizing:border-box;}
body {font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);}

.hero {
  height: 100vh;
  background: linear-gradient(rgba(29,29,31,0.45), rgba(29,29,31,0.45)), url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=2000') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  position: relative;
}
.hero-content h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(3.2rem, 9vw, 6rem);
  margin-bottom: 16px;
  letter-spacing: 0.05em;
}
.hero-content p { font-size: 1.35rem; opacity: 0.95; }

.modules {
  max-width: 1280px;
  margin: -80px auto 100px;
  padding: 0 40px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
  gap: 32px;
}
.module-card {
  background: white;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.1);
  transition: all 0.5s;
  cursor: pointer;
}
.module-card:hover {
  transform: translateY(-20px);
  box-shadow: 0 30px 70px rgba(198,106,78,0.2);
}
.module-card img {
  width: 100%;
  height: 260px;
  object-fit: cover;
}
.module-info {
  padding: 28px;
}
.module-info h3 {
  font-size: 1.65rem;
  margin-bottom: 8px;
}
.module-info p {
  color: #666;
  line-height: 1.7;
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <h1>易饰乾园素材库</h1>
    <p>极简文案资产 · 驱动品牌自然生长</p>
  </div>
</div>

<div class="modules">
  <div class="module-card" onclick="location.href='friends.html'">
    <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?w=800" alt="朋友圈">
    <div class="module-info">
      <h3>朋友圈</h3>
      <p>高转化发圈文案库</p>
    </div>
  </div>
  
  <div class="module-card" onclick="location.href='testimonials.html'">
    <img src="https://images.unsplash.com/photo-1551836022-d5d88e9218df?w=800" alt="客户见证">
    <div class="module-info">
      <h3>客户见证</h3>
      <p>真实案例 · 信任背书</p>
    </div>
  </div>
  
  <div class="module-card" onclick="location.href='course.html'">
    <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=800" alt="课程卖点">
    <div class="module-info">
      <h3>课程卖点</h3>
      <p>核心价值 · 转化文案</p>
    </div>
  </div>
</div>

</body>
</html>
