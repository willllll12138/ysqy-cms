<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园 · 后台管理 V5</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2; --card-bg: #FFFFFF; --ink: #1a1815; --ink-light: #5c574f;
            --gold: #b8832a; --gold-pale: #f7f0e0; --border: rgba(0,0,0,0.06);
            --radius-sm: 10px; --radius-md: 18px; --radius-lg: 24px; --radius-full: 50px;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.04); --shadow-md: 0 8px 30px rgba(0,0,0,0.07);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);font-family:'Noto Sans SC',sans-serif;color:var(--ink);}
        .container{max-width:1000px;margin:0 auto;padding:0 24px;}
        .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .login-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:48px 36px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.08);}
        .login-card .hero-tag{display:inline-block;font-size:0.7rem;letter-spacing:0.35em;color:var(--gold);background:var(--gold-pale);padding:6px 18px;border-radius:var(--radius-full);margin-bottom:16px;}
        .login-card h1{font-family:'Noto Serif SC',serif;font-size:1.8rem;margin-bottom:12px;}
        .login-card .sub{font-size:0.8rem;color:var(--ink-light);margin-bottom:24px;}
        .login-card input{width:100%;padding:14px 18px;border:1.5px solid var(--border);border-radius:var(--radius-full);text-align:center;font-size:1rem;outline:none;margin-bottom:16px;background:var(--bg);}
        .btn{background:var(--ink);color:#fff;border:none;padding:12px 24px;border-radius:var(--radius-full);cursor:pointer;font-weight:500;font-family:inherit;}
        .btn:hover{background:#2b2b2b;}
        .btn-outline{background:transparent;color:var(--ink);border:1.5px solid #ccc;padding:8px 16px;border-radius:var(--radius-full);cursor:pointer;font-size:0.75rem;font-family:inherit;}
        .btn-outline:hover{background:#f5f5f5;}
        .admin-header{display:flex;justify-content:space-between;padding:32px 0 24px;flex-wrap:wrap;gap:12px;}
        .panel-grid{display:grid;grid-template-columns:240px 1fr;gap:20px;}
        .module-sidebar{background:var(--card-bg);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border);}
        .module-item{display:flex;justify-content:space-between;padding:10px 12px;border-radius:var(--radius-md);cursor:pointer;font-size:0.9rem;}
        .module-item.active{background:var(--gold-pale);}
        .content-panel{background:var(--card-bg);border-radius:var(--radius-lg);padding:28px;border:1px solid var(--border);}
        input[type="text"],input[type="url"],input[type="date"],select{border-radius:30px!important;padding:12px 18px;border:1.5px solid #e0dbd0;font-family:inherit;font-size:0.85rem;background:#fdfdfb;outline:none;width:100%;margin-bottom:8px;}
        textarea{border-radius:25px!important;padding:14px 18px;min-height:150px;border:1.5px solid #e0dbd0;font-family:inherit;font-size:0.85rem;background:#fdfdfb;outline:none;width:100%;resize:vertical;}
        .tag-list{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px;}
        .tag-item{background:#f0ede5;padding:6px 14px;border-radius:var(--radius-full);font-size:0.8rem;display:flex;align-items:center;gap:6px;}
        .tag-item i{cursor:pointer;color:#b33;}
        .admin-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:16px;}
        .admin-card{background:#fff;border-radius:var(--radius-lg);padding:18px;border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;transition:0.2s;}
        .admin-card:hover{box-shadow:var(--shadow-md);}
        .admin-card .preview-title{font-weight:600;font-size:0.9rem;color:var(--ink);margin-bottom:4px;}
        .admin-card .preview-text{font-size:0.82rem;color:var(--ink-light);line-height:1.6;white-space:pre-wrap;min-height:6em;max-height:10em;overflow-y:auto;}
        .admin-card .card-meta{display:flex;justify-content:space-between;align-items:center;font-size:0.65rem;color:#aaa;margin-top:4px;}
        .admin-card .card-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;}
        .admin-card .card-actions i{cursor:pointer;color:#888;padding:4px;border-radius:6px;}
        .admin-card .card-actions i:hover{color:var(--gold);background:var(--gold-pale);}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 24px;border-radius:30px;font-size:0.8rem;opacity:0;transition:0.3s;z-index:3000;}
        .toast.show{opacity:1;}
    </style>
</head>
<body>
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <div class="hero-tag">ADMIN PANEL</div>
        <h1>易饰乾园 · 后台</h1>
        <p class="sub">文案资产管理系统</p>
        <input type="password" id="pwdInput" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')login()">
        <button class="btn" onclick="login()">进入后台</button>
        <div style="margin-top:10px;font-size:0.8rem;"><a href="index.html">← 返回前台</a></div>
    </div>
</div>

<div id="adminMain" style="display:none;">
    <div class="container">
        <div class="admin-header">
            <h1>⚙️ 库管理中心</h1>
            <div style="display:flex;gap:8px;">
                <a href="index.html" class="btn-outline">← 前台</a>
                <button class="btn-outline" onclick="exportData()">📤 导出</button>
                <label class="btn-outline" style="cursor:pointer;">📥 导入<input type="file" id="importFile" hidden onchange="importData(this)"></label>
            </div>
        </div>
        <div class="panel-grid">
            <div class="module-sidebar">
                <h3><i class="fa-solid fa-cubes"></i> 模块</h3>
                <div class="module-list" id="moduleList"></div>
                <button class="btn" onclick="addModule()" style="width:100%;margin-top:12px;">➕ 新增模块</button>
            </div>
            <div class="content-panel" id="contentPanel">← 选择模块</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
    const DATA_KEY = 'ysqy_data_v3';
    const DEFAULT_MODULES = [
        { id:'pyq', name:'朋友圈', type:'moments', categories:['数字冲击','对话还原','情绪唤醒'] },
        { id:'witness', name:'客户见证', type:'testimonial', categories:['文昌','沙龙','成交'] },
        { id:'course', name:'课程卖点', type:'course', categories:['核心价值','课程亮点'] }
    ];

    let raw = localStorage.getItem(DATA_KEY);
    let db = raw ? JSON.parse(raw) : { modules: JSON.parse(JSON.stringify(DEFAULT_MODULES)), contents: [] };
    if (!db.modules || !Array.isArray(db.modules)) db = { modules: JSON.parse(JSON.stringify(DEFAULT_MODULES)), contents: [] };
    if (!db.contents) db.contents = [];
    save();

    function save() { localStorage.setItem(DATA_KEY, JSON.stringify(db)); }
    function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

    window.login = function() {
        if (document.getElementById('pwdInput').value === 'ysqy798') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminMain').style.display = 'block';
            renderSidebar();
        } else toast('密码错误');
    };

    let currentModuleId = null;

    function renderSidebar() {
        const list = document.getElementById('moduleList');
        list.innerHTML = db.modules.map(m => `
            <div class="module-item ${currentModuleId===m.id?'active':''}" onclick="selectModule('${m.id}')">
                <span>${m.name}</span>
                <div class="actions" onclick="event.stopPropagation()">
                    <i class="fa-solid fa-pen" onclick="renameModule('${m.id}')"></i>
                    <i class="fa-solid fa-trash" onclick="deleteModule('${m.id}')"></i>
                </div>
            </div>
        `).join('');
        if (currentModuleId) renderContent();
    }

    window.selectModule = function(id) { currentModuleId = id; renderSidebar(); };

    function renderContent() {
        const mod = db.modules.find(m=>m.id===currentModuleId);
        if (!mod) return;
        const contents = db.contents.filter(c=>c.moduleId===currentModuleId);
        let html = `<h3>${mod.name} (${mod.type})</h3>`;
        html += `<div class="tag-list">${(mod.categories||[]).map(c=>`<span class="tag-item">${c} <i class="fa-solid fa-xmark" onclick="deleteCategory('${c}')"></i></span>`).join('')}</div>
        <div style="display:flex;gap:8px;"><input type="text" id="newCatInput" placeholder="新分类"><button class="btn" onclick="addCategory()">添加</button></div>`;

        if (mod.type === 'moments') {
            html += `<h4 style="margin-top:16px;">📝 发布文案</h4>
            <select id="pubAngle">${(mod.categories||[]).map(c=>`<option>${c}</option>`).join('')}</select>
            <textarea id="pubText" placeholder="文案内容，换行分段..."></textarea>
            <button class="btn" onclick="publish()">发布</button>`;
        } else {
            html += `<h4 style="margin-top:16px;">📝 新增内容</h4>
            <select id="pubCategory">${(mod.categories||[]).map(c=>`<option>${c}</option>`).join('')}</select>
            <input type="text" id="pubTitle" placeholder="标题">
            <input type="text" id="pubImage" placeholder="图片URL">
            <input type="text" id="pubVideo" placeholder="视频URL">
            <textarea id="pubDesc" placeholder="描述"></textarea>
            <input type="text" id="pubDate" placeholder="日期 (2024-05-15)">
            <button class="btn" onclick="publish()">保存</button>`;
        }

        html += `<h4 style="margin-top:20px;">已发布内容</h4>`;
        if (contents.length === 0) html += '<p style="color:#aaa;">暂无内容</p>';
        else {
            html += `<div class="admin-card-grid">`;
            contents.forEach(c => {
                const idx = db.contents.indexOf(c);
                let previewHtml = '';
                if (c.title) previewHtml += `<div class="preview-title">${c.title}</div>`;
                previewHtml += `<div class="preview-text">${c.text || c.description || ''}</div>`;
                html += `<div class="admin-card">
                    ${previewHtml}
                    <div class="card-meta"><span>${c.angle||c.category||''}</span><span>${c.date||''}</span></div>
                    <div class="card-actions">
                        <i class="fa-solid fa-arrow-up" onclick="moveContent(${idx},-1)"></i>
                        <i class="fa-solid fa-arrow-down" onclick="moveContent(${idx},1)"></i>
                        <i class="fa-solid fa-pen" onclick="editContent(${idx})"></i>
                        <i class="fa-solid fa-trash" onclick="deleteContent(${idx})"></i>
                    </div>
                </div>`;
            });
            html += `</div>`;
        }
        document.getElementById('contentPanel').innerHTML = html;
    }

    window.publish = function() {
        const mod = db.modules.find(m=>m.id===currentModuleId);
        const item = { id:Date.now(), moduleId:currentModuleId };
        if (mod.type === 'moments') {
            item.angle = document.getElementById('pubAngle').value;
            item.text = document.getElementById('pubText').value.trim();
            if (!item.text) return toast('内容不能为空');
            item.time = Date.now();
        } else {
            item.category = document.getElementById('pubCategory').value;
            item.title = document.getElementById('pubTitle').value.trim();
            item.description = document.getElementById('pubDesc').value.trim();
            if (!item.title || !item.description) return toast('标题和描述必填');
            item.imageUrl = document.getElementById('pubImage').value.trim();
            item.videoUrl = document.getElementById('pubVideo').value.trim();
            item.date = document.getElementById('pubDate').value.trim();
        }
        db.contents.unshift(item);
        save(); renderContent(); toast('已发布');
    };

    window.addCategory = function() {
        const val = document.getElementById('newCatInput').value.trim();
        if (!val) return;
        const mod = db.modules.find(m=>m.id===currentModuleId);
        if (mod.categories.includes(val)) return toast('已存在');
        mod.categories.push(val);
        save(); renderContent();
    };
    window.deleteCategory = function(val) {
        const mod = db.modules.find(m=>m.id===currentModuleId);
        mod.categories = mod.categories.filter(c=>c!==val);
        save(); renderContent();
    };
    window.moveContent = function(idx, dir) {
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= db.contents.length) return;
        [db.contents[idx], db.contents[newIdx]] = [db.contents[newIdx], db.contents[idx]];
        save(); renderContent();
    };
    window.deleteContent = function(idx) { if (confirm('删除？')) { db.contents.splice(idx,1); save(); renderContent(); } };
    window.editContent = function(idx) {
        const c = db.contents[idx];
        const mod = db.modules.find(m=>m.id===c.moduleId);
        let form = '';
        if (mod.type === 'moments') {
            form += `<select id="editAngle">${mod.categories.map(c=>`<option ${c===c.angle?'selected':''}>${c}</option>`).join('')}</select><textarea id="editText">${c.text}</textarea>`;
        } else {
            form += `<select id="editCat">${mod.categories.map(cat=>`<option ${cat===c.category?'selected':''}>${cat}</option>`).join('')}</select><input type="text" id="editTitle" value="${c.title||''}"><textarea id="editDesc">${c.description||''}</textarea>`;
        }
        const div = document.createElement('div');
        div.innerHTML = form + `<button class="btn" id="saveEditBtn">保存</button>`;
        document.getElementById('contentPanel').appendChild(div);
        document.getElementById('saveEditBtn').onclick = function() {
            if (mod.type === 'moments') {
                c.angle = document.getElementById('editAngle').value;
                c.text = document.getElementById('editText').value;
            } else {
                c.category = document.getElementById('editCat').value;
                c.title = document.getElementById('editTitle').value;
                c.description = document.getElementById('editDesc').value;
            }
            save(); renderContent(); toast('已更新');
        };
    };

    window.addModule = function() {
        const name = prompt('模块名称');
        if (name) {
            const type = prompt('类型 (moments / testimonial / course)', 'moments');
            db.modules.push({ id:'mod_'+Date.now(), name, type, categories:[] });
            save(); renderSidebar();
        }
    };
    window.renameModule = function(id) {
        const mod = db.modules.find(m=>m.id===id);
        const newName = prompt('新名称', mod.name);
        if (newName) { mod.name = newName; save(); renderSidebar(); }
    };
    window.deleteModule = function(id) {
        if (confirm('删除模块会清空其内容')) {
            db.modules = db.modules.filter(m=>m.id!==id);
            db.contents = db.contents.filter(c=>c.moduleId!==id);
            save(); renderSidebar();
        }
    };
    window.exportData = function() {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:'application/json'}));
        a.download = 'backup.json'; a.click();
    };
    window.importData = function(input) {
        const reader = new FileReader();
        reader.onload = e => {
            db = JSON.parse(e.target.result);
            save(); renderSidebar();
            document.getElementById('contentPanel').innerHTML = '← 选择模块';
        };
        reader.readAsText(input.files[0]);
    };
})();
</script>
</body>
</html>
