<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园 · 后台管理</title>
<style>
/* 米白色风格 */
:root {
  --bg: #F7F5F0;
  --card: #FFFFFF;
  --ink: #1D1D1F;
  --gold: #C66A4E;
  --mist: #E5E0D8;
}
* {margin:0;padding:0;box-sizing:border-box;}
body {background:var(--bg); font-family:'Noto Sans SC',sans-serif; color:var(--ink);}

.login-box { background:white; padding:60px; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.1); max-width:400px; margin:100px auto; text-align:center; }
.login-input { width:100%; padding:16px; border:1px solid var(--mist); border-radius:12px; margin:20px 0; }
.btn { padding:16px; width:100%; border:none; border-radius:12px; cursor:pointer; }

.admin-header { background:var(--ink); color:white; padding:15px 30px; display:flex; justify-content:space-between; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginScreen">
  <div class="login-box">
    <h2>易饰乾园 · 后台</h2>
    <input type="password" id="pwdInput" class="login-input" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" style="background:var(--ink);color:white;" onclick="doLogin()">进入后台</button>
    <div id="loginError" style="color:red;margin-top:15px;"></div>
  </div>
</div>

<!-- 后台 -->
<div id="adminScreen" style="display:none;">
  <div class="admin-header">
    <div>易饰乾园 · 文案后台管理</div>
    <div>
      <button onclick="window.location.href='index.html'" style="margin-right:10px;">← 返回前台</button>
      <button onclick="saveAll()">保存同步</button>
    </div>
  </div>

  <div style="max-width:1200px;margin:30px auto;padding:0 30px;">
    <!-- 这里可以继续扩展更多功能 -->
    <h2 style="text-align:center;padding:80px;color:#888;">后台管理功能已优化</h2>
    <p style="text-align:center;">模块为一级，角度为二级</p>
  </div>
</div>

<script>
const DEFAULT_PWD = 'ysqy798';

function doLogin() {
  if (document.getElementById('pwdInput').value === DEFAULT_PWD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
  } else {
    document.getElementById('loginError').textContent = '密码错误';
  }
}

function saveAll() {
  alert('✅ 保存成功');
}
</script>
</body>
</html>
