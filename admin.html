<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园 · 后台管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2; --card-bg: #FFFFFF; --ink: #1a1815; --gold: #b8832a;
            --border: rgba(0,0,0,0.06); --radius-lg: 24px; --radius-full: 50px;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);font-family:'Noto Sans SC',sans-serif;color:var(--ink);}
        .container{max-width:1000px;margin:0 auto;padding:0 24px;}
        .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .login-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:48px 36px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.08);}
        .login-card h1{font-family:'Noto Serif SC',serif;font-size:1.8rem;}
        .login-card input{width:100%;padding:14px 18px;border:1.5px solid var(--border);border-radius:var(--radius-full);text-align:center;margin-bottom:16px;}
        .btn{background:var(--ink);color:#fff;border:none;padding:12px 24px;border-radius:var(--radius-full);cursor:pointer;font-weight:500;}
        .btn-full{width:100%;}
        .btn-outline{background:transparent;color:var(--ink);border:1.5px solid #ccc;padding:8px 20px;border-radius:var(--radius-full);cursor:pointer;font-weight:600;font-size:0.8rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none;margin:0 4px;}
        .login-links{margin-top:16px;display:flex;justify-content:center;gap:20px;}
        .login-links a{color:var(--ink-light);font-size:0.8rem;cursor:pointer;}
        .admin-header{display:flex;justify-content:space-between;align-items:center;padding:32px 0 24px;}
        .panel-grid{display:grid;grid-template-columns:240px 1fr;gap:20px;}
        .module-sidebar{background:var(--card-bg);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border);}
        .module-item{display:flex;justify-content:space-between;padding:12px;border-radius:18px;cursor:pointer;}
        .module-item.active{background:#f7f0e0;}
        .content-panel{background:var(--card-bg);border-radius:var(--radius-lg);padding:28px;border:1px solid var(--border);}
        input,select,textarea{border-radius:30px!important;padding:12px 18px;border:1px solid #e0dbd0;width:100%;margin-bottom:10px;font-family:inherit;}
        textarea{min-height:150px;}
        .tag-list{display:flex;flex-wrap:wrap;gap:8px;}
        .tag-item{background:#f0ede5;padding:6px 14px;border-radius:20px;font-size:0.8rem;}
        .admin-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
        .admin-card{background:#fff;border-radius:var(--radius-lg);padding:18px;border:1px solid var(--border);}
        .modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:2000;}
        .modal-box{background:#fff;border-radius:var(--radius-lg);padding:32px;max-width:500px;width:90%;}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 24px;border-radius:30px;font-size:0.8rem;opacity:0;z-index:3000;}
        .toast.show{opacity:1;}
    </style>
</head>
<body>
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1>易饰乾园 · 后台</h1>
        <input type="password" id="pwdInput" placeholder="管理密码" onkeydown="if(event.key==='Enter')login()">
        <button class="btn btn-full" onclick="login()">进入后台</button>
        <div class="login-links">
            <a onclick="showChangePwdModal()">修改密码</a>
            <a onclick="showForgotPwdModal()">忘记密码？</a>
        </div>
        <a href="index.html" class="btn-outline" style="margin-top:16px;display:inline-flex;justify-content:center;">← 返回前台</a>
    </div>
</div>

<div id="adminMain" style="display:none;">
    <div class="container">
        <div class="admin-header">
            <h1>库管理中心</h1>
            <div>
                <a href="index.html" class="btn-outline">← 前台</a>
                <button class="btn-outline" onclick="exportData()">导出</button>
                <label class="btn-outline" style="cursor:pointer;">导入<input type="file" hidden onchange="importData(this)"></label>
            </div>
        </div>
        <div class="panel-grid">
            <div class="module-sidebar">
                <h3>模块</h3>
                <div id="moduleList"></div>
                <button class="btn btn-full" style="margin-top:12px;" onclick="addModule()">新增模块</button>
            </div>
            <div class="content-panel" id="contentPanel">← 选择模块</div>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function() {
    const KEY = 'ysqy_data_v3';
    const DEFAULT_PWD = 'ysqy798';
    const DEFAULT_MODULES = [
        { id:'pyq', name:'朋友圈', type:'moments', categories:['数字冲击','对话还原'] },
        { id:'witness', name:'客户见证', type:'testimonial', categories:['文昌','沙龙'] },
        { id:'course', name:'课程卖点', type:'course', categories:['核心价值'] }
    ];

    function cleanModules(db) {
        if (!db || !db.modules || !Array.isArray(db.modules)) {
            db.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
        } else {
            // 过滤掉非对象、无id、无name、name为"undefined"的条目
            db.modules = db.modules.filter(m => m && typeof m === 'object' && m.id && m.name && m.name !== 'undefined' && m.name !== 'null');
            if (db.modules.length === 0) {
                db.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
            }
        }
        if (!db.contents || !Array.isArray(db.contents)) db.contents = [];
        return db;
    }

    let raw = localStorage.getItem(KEY);
    let db;
    try { db = raw ? JSON.parse(raw) : null; } catch(e) { db = null; }
    db = cleanModules(db || {});
    save();

    function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
    function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
    function getPwd() { return localStorage.getItem('ysqy_admin_pwd') || DEFAULT_PWD; }

    window.login = function() {
        if (document.getElementById('pwdInput').value === getPwd()) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminMain').style.display = 'block';
            renderSidebar();
        } else toast('密码错误');
    };

    // 修改密码 / 忘记密码 (与之前相同，省略)
    window.showChangePwdModal = function() {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-box"><h3>修改密码</h3>
            <input type="password" id="oldPwd" placeholder="当前密码">
            <input type="password" id="newPwd1" placeholder="新密码">
            <input type="password" id="newPwd2" placeholder="确认">
            <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
                <button class="btn-outline" onclick="this.closest('.modal').remove()">取消</button>
                <button class="btn" id="doChange">确认</button>
            </div></div>`;
        document.body.appendChild(modal);
        document.getElementById('doChange').onclick = function() {
            const o = document.getElementById('oldPwd').value;
            const n1 = document.getElementById('newPwd1').value;
            const n2 = document.getElementById('newPwd2').value;
            if (o !== getPwd()) return toast('当前密码错误');
            if (n1.length < 4) return toast('至少4位');
            if (n1 !== n2) return toast('不一致');
            localStorage.setItem('ysqy_admin_pwd', n1);
            modal.remove(); toast('已修改');
        };
        modal.onclick = e => { if(e.target===modal) modal.remove(); };
    };
    window.showForgotPwdModal = function() {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-box"><h3>重置密码</h3>
            <input type="text" id="resetCode" placeholder="重置暗号">
            <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
                <button class="btn-outline" onclick="this.closest('.modal').remove()">取消</button>
                <button class="btn" id="doReset">重置</button>
            </div></div>`;
        document.body.appendChild(modal);
        document.getElementById('doReset').onclick = function() {
            if (document.getElementById('resetCode').value === 'ysqy_reset') {
                localStorage.removeItem('ysqy_admin_pwd');
                modal.remove(); toast('已重置为默认密码');
            } else toast('暗号错误');
        };
        modal.onclick = e => { if(e.target===modal) modal.remove(); };
    };

    let curModId = null;
    function renderSidebar() {
        document.getElementById('moduleList').innerHTML = db.modules.map(m => `
            <div class="module-item ${curModId===m.id?'active':''}" onclick="selectModule('${m.id}')">
                <span>${m.name}</span>
                <div onclick="event.stopPropagation()">
                    <i class="fa-solid fa-pen" onclick="renameModule('${m.id}')"></i>
                    <i class="fa-solid fa-trash" onclick="deleteModule('${m.id}')"></i>
                </div>
            </div>`).join('');
        if(curModId) renderContent();
    }
    window.selectModule = function(id) { curModId = id; renderSidebar(); };

    function renderContent() {
        const mod = db.modules.find(m=>m.id===curModId);
        if(!mod) return;
        const contents = db.contents.filter(c=>c.moduleId===curModId);
        let html = `<h3>${mod.name} (${mod.type})</h3>`;
        html += `<div class="tag-list">${(mod.categories||[]).map(c=>`<span class="tag-item">${c} <i class="fa-solid fa-xmark" onclick="delCat('${c}')"></i></span>`).join('')}</div>
        <input id="newCat" placeholder="新分类"><button class="btn" onclick="addCat()">添加</button>`;

        if(mod.type==='moments') {
            html += `<select id="pubAngle">${mod.categories.map(c=>`<option>${c}</option>`).join('')}</select>
            <textarea id="pubText" placeholder="文案..."></textarea><button class="btn" onclick="pub()">发布</button>`;
        } else {
            html += `<select id="pubCat">${mod.categories.map(c=>`<option>${c}</option>`).join('')}</select>
            <input id="pubTitle" placeholder="标题"><input id="pubImg" placeholder="图片URL"><input id="pubVid" placeholder="视频URL">
            <textarea id="pubDesc" placeholder="描述"></textarea><input id="pubDate" placeholder="日期"><button class="btn" onclick="pub()">保存</button>`;
        }

        html += `<h4>已发布</h4>`;
        if(!contents.length) html += '<p style="color:#aaa;">暂无内容</p>';
        else {
            html += `<div class="admin-card-grid">`;
            contents.forEach(c => {
                const idx = db.contents.indexOf(c);
                html += `<div class="admin-card">
                    ${c.title?`<strong>${c.title}</strong>`:''}
                    <div style="max-height:6em;overflow-y:auto;">${c.text||c.description||''}</div>
                    <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:8px;">
                        <i class="fa-solid fa-arrow-up" onclick="move(${idx},-1)"></i>
                        <i class="fa-solid fa-arrow-down" onclick="move(${idx},1)"></i>
                        <i class="fa-solid fa-pen" onclick="edit(${idx})"></i>
                        <i class="fa-solid fa-trash" onclick="del(${idx})"></i>
                    </div>
                </div>`;
            });
            html += `</div>`;
        }
        document.getElementById('contentPanel').innerHTML = html;
    }

    window.pub = function() {
        const mod = db.modules.find(m=>m.id===curModId);
        const item = { id: Date.now(), moduleId: curModId };
        if(mod.type==='moments') { item.angle = document.getElementById('pubAngle').value; item.text = document.getElementById('pubText').value.trim(); if(!item.text) return toast('内容为空'); item.time = Date.now(); }
        else { item.category = document.getElementById('pubCat').value; item.title = document.getElementById('pubTitle').value.trim(); item.description = document.getElementById('pubDesc').value.trim(); if(!item.title||!item.description) return toast('标题和描述必填'); item.imageUrl = document.getElementById('pubImg').value.trim(); item.videoUrl = document.getElementById('pubVid').value.trim(); item.date = document.getElementById('pubDate').value.trim(); }
        db.contents.unshift(item); save(); renderContent();
    };

    window.edit = function(idx) {
        const c = db.contents[idx];
        const mod = db.modules.find(m=>m.id===c.moduleId);
        let form = '';
        if(mod.type==='moments') {
            form = `<select id="eAngle">${mod.categories.map(cat=>`<option ${cat===c.angle?'selected':''}>${cat}</option>`).join('')}</select><textarea id="eText">${c.text}</textarea>`;
        } else {
            form = `<select id="eCat">${mod.categories.map(cat=>`<option ${cat===c.category?'selected':''}>${cat}</option>`).join('')}</select><input id="eTitle" value="${c.title||''}"><textarea id="eDesc">${c.description||''}</textarea>`;
        }
        const overlay = document.createElement('div'); overlay.className = 'modal';
        overlay.innerHTML = `<div class="modal-box"><h3>编辑</h3>${form}<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;"><button class="btn-outline" onclick="this.closest('.modal').remove()">取消</button><button class="btn" id="saveEdit">保存</button></div></div>`;
        document.body.appendChild(overlay);
        document.getElementById('saveEdit').onclick = function() {
            if(mod.type==='moments') { c.angle = document.getElementById('eAngle').value; c.text = document.getElementById('eText').value.trim(); }
            else { c.category = document.getElementById('eCat').value; c.title = document.getElementById('eTitle').value.trim(); c.description = document.getElementById('eDesc').value.trim(); }
            save(); renderContent(); overlay.remove(); toast('已更新');
        };
        overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
    };

    window.move = function(idx, dir) { const n = idx+dir; if(n<0||n>=db.contents.length) return; [db.contents[idx],db.contents[n]] = [db.contents[n],db.contents[idx]]; save(); renderContent(); };
    window.del = function(idx) { if(confirm('删除？')){db.contents.splice(idx,1);save();renderContent();} };
    window.addCat = function() { const val = document.getElementById('newCat').value.trim(); if(val){ const mod=db.modules.find(m=>m.id===curModId); if(!mod.categories)mod.categories=[]; if(mod.categories.includes(val))return toast('已存在'); mod.categories.push(val); save(); renderContent(); } };
    window.delCat = function(val) { const mod=db.modules.find(m=>m.id===curModId); mod.categories = mod.categories.filter(c=>c!==val); save(); renderContent(); };
    window.addModule = function() { const name=prompt('名称'); if(name){ const type=prompt('类型(moments/testimonial/course)','moments'); db.modules.push({id:'mod_'+Date.now(), name, type, categories:[]}); save(); renderSidebar(); } };
    window.renameModule = function(id) { const mod=db.modules.find(m=>m.id===id); const n=prompt('新名称',mod.name); if(n){mod.name=n;save();renderSidebar();if(curModId===id)renderContent();} };
    window.deleteModule = function(id) { if(confirm('删除模块及内容')){db.modules=db.modules.filter(m=>m.id!==id);db.contents=db.contents.filter(c=>c.moduleId!==id);if(curModId===id){curModId=null;document.getElementById('contentPanel').innerHTML='← 选择模块';}save();renderSidebar();} };
    window.exportData = function() { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'})); a.download='backup.json'; a.click(); };
    window.importData = function(input) {
        const file = input.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if(data.modules && data.contents) {
                    if(confirm('覆盖当前数据？')) {
                        db = cleanModules(data);
                        save(); curModId = null; renderSidebar(); document.getElementById('contentPanel').innerHTML = '← 选择模块'; toast('导入成功');
                    }
                } else toast('格式错误');
            } catch(ex) { toast('解析失败'); }
        };
        reader.readAsText(file); input.value = '';
    };
})();
</script>
</body>
</html>
