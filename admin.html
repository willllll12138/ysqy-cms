<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园 · 后台管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2;
            --card-bg: #fff;
            --ink: #1a1815;
            --gold: #b8832a;
            --border: #e0dbd0;
            --radius: 12px;
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Noto Sans SC', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            font-family: var(--font-sans);
            color: var(--ink);
            padding: 24px;
        }
        .admin-container { max-width:900px; margin:0 auto; }
        h1 { font-family: var(--font-serif); font-size:1.8rem; margin-bottom:24px; text-align:center; }
        .login-box { max-width:360px; margin:80px auto; background:#fff; padding:32px; border-radius:var(--radius); box-shadow:0 4px 20px rgba(0,0,0,0.05); }
        .login-box input { width:100%; padding:12px; margin:12px 0; border:1px solid var(--border); border-radius:8px; }
        .btn { background:var(--ink); color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-family:inherit; }
        .btn:hover { opacity:0.9; }
        .section { background:var(--card-bg); border-radius:var(--radius); padding:20px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,0.03); }
        .section h2 { font-size:1.1rem; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
        .tag-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
        .tag { background:#f0ede5; padding:4px 12px; border-radius:20px; font-size:0.8rem; display:flex; align-items:center; gap:4px; }
        .tag i { cursor:pointer; color:#b33; }
        .form-inline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .form-inline input, .form-inline select { padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-family:inherit; }
        table { width:100%; border-collapse:collapse; margin-top:12px; }
        th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #eee; font-size:0.85rem; }
        .action-icons i { margin:0 4px; cursor:pointer; color:#888; }
        .action-icons i:hover { color:var(--gold); }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 24px; border-radius:30px; font-size:0.8rem; opacity:0; transition:0.3s; z-index:999; }
        .toast.show { opacity:1; }
        @media(max-width:600px) {
            body { padding:12px; }
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-box">
        <h2 style="text-align:center;">🔐 管理员验证</h2>
        <input type="password" id="pwdInput" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')login()">
        <button class="btn" onclick="login()" style="width:100%;">进入后台</button>
        <p id="loginError" style="color:#c33;font-size:0.8rem;margin-top:8px;"></p>
    </div>

    <div id="adminMain" style="display:none;" class="admin-container">
        <h1>⚙️ 易饰乾园 · 库管理中心</h1>

        <!-- 模块管理 -->
        <div class="section">
            <h2><i class="fa-solid fa-cubes"></i> 模块管理</h2>
            <div class="tag-list" id="moduleTags"></div>
            <div class="form-inline">
                <input type="text" id="newModule" placeholder="新模块名称">
                <button class="btn" onclick="addModule()">添加模块</button>
            </div>
        </div>

        <!-- 角度管理 -->
        <div class="section">
            <h2><i class="fa-solid fa-tags"></i> 角度管理</h2>
            <div class="tag-list" id="angleTags"></div>
            <div class="form-inline">
                <input type="text" id="newAngle" placeholder="新角度名称">
                <button class="btn" onclick="addAngle()">添加角度</button>
            </div>
        </div>

        <!-- 见证分类 -->
        <div class="section">
            <h2><i class="fa-solid fa-folder-tree"></i> 客户见证分类</h2>
            <div class="tag-list" id="testCatTags"></div>
            <div class="form-inline">
                <input type="text" id="newTestCat" placeholder="新分类">
                <button class="btn" onclick="addTestCat()">添加分类</button>
            </div>
        </div>

        <!-- 课程分类 -->
        <div class="section">
            <h2><i class="fa-solid fa-graduation-cap"></i> 课程卖点分类</h2>
            <div class="tag-list" id="courseCatTags"></div>
            <div class="form-inline">
                <input type="text" id="newCourseCat" placeholder="新分类">
                <button class="btn" onclick="addCourseCat()">添加分类</button>
            </div>
        </div>

        <!-- 朋友圈发布 -->
        <div class="section">
            <h2>📝 发布朋友圈文案</h2>
            <div class="form-inline" style="margin-bottom:8px;">
                <select id="pubAngle"></select>
            </div>
            <textarea id="pubText" rows="4" placeholder="文案内容，换行表示新的一段…" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;"></textarea>
            <button class="btn" onclick="publishPost()" style="margin-top:8px;">发布文案</button>
        </div>

        <!-- 客户见证管理 -->
        <div class="section">
            <h2>🖼️ 客户见证管理</h2>
            <table>
                <thead><tr><th>标题</th><th>分类</th><th>操作</th></tr></thead>
                <tbody id="testTableBody"></tbody>
            </table>
            <details style="margin-top:12px;">
                <summary style="cursor:pointer;">➕ 新增/编辑见证</summary>
                <div class="form-inline" style="margin-top:8px;flex-direction:column;align-items:flex-start;">
                    <select id="editTestCat" style="margin-bottom:6px;"></select>
                    <input type="text" id="editTestTitle" placeholder="标题" style="margin-bottom:6px;">
                    <input type="text" id="editTestImage" placeholder="图片URL（可留空）" style="margin-bottom:6px;">
                    <input type="text" id="editTestVideo" placeholder="视频URL（YouTube嵌入链接或MP4）" style="margin-bottom:6px;">
                    <textarea id="editTestDesc" rows="3" placeholder="描述文字" style="width:100%;margin-bottom:6px;"></textarea>
                    <input type="text" id="editTestClient" placeholder="客户名称（选填）" style="margin-bottom:6px;">
                    <input type="text" id="editTestDate" placeholder="日期（如2024-05-15）">
                    <input type="hidden" id="editTestId">
                    <button class="btn" onclick="saveTestimonial()">保存见证</button>
                </div>
            </details>
        </div>

        <!-- 课程管理 -->
        <div class="section">
            <h2>📚 课程卖点管理</h2>
            <table>
                <thead><tr><th>标题</th><th>分类</th><th>操作</th></tr></thead>
                <tbody id="courseTableBody"></tbody>
            </table>
            <details style="margin-top:12px;">
                <summary style="cursor:pointer;">➕ 新增/编辑课程</summary>
                <div class="form-inline" style="margin-top:8px;flex-direction:column;align-items:flex-start;">
                    <select id="editCourseCat" style="margin-bottom:6px;"></select>
                    <input type="text" id="editCourseTitle" placeholder="标题" style="margin-bottom:6px;">
                    <input type="text" id="editCourseImage" placeholder="图片URL" style="margin-bottom:6px;">
                    <input type="text" id="editCourseVideo" placeholder="视频URL" style="margin-bottom:6px;">
                    <textarea id="editCourseDesc" rows="3" placeholder="描述" style="width:100%;margin-bottom:6px;"></textarea>
                    <input type="text" id="editCourseDate" placeholder="日期">
                    <input type="hidden" id="editCourseId">
                    <button class="btn" onclick="saveCourse()">保存课程</button>
                </div>
            </details>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const DATA_KEY = 'ysqy_data_v3';
        const ADMIN_PWD = 'ysqy798';
        let db = JSON.parse(localStorage.getItem(DATA_KEY) || 'null') || {
            modules: ['朋友圈','客户见证','课程卖点'],
            angles: ['数字冲击','对话还原','情绪唤醒','场景反差'],
            testimonialCategories: ['文昌','沙龙','成交'],
            courseCategories: ['核心价值','课程亮点'],
            posts: [],
            testimonials: [],
            courses: []
        };

        function save() {
            localStorage.setItem(DATA_KEY, JSON.stringify(db));
            window.dispatchEvent(new StorageEvent('storage', {key:DATA_KEY, newValue:JSON.stringify(db)}));
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
        }

        function login() {
            if (document.getElementById('pwdInput').value === ADMIN_PWD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminMain').style.display = 'block';
                renderAll();
            } else {
                document.getElementById('loginError').textContent = '密码错误';
            }
        }

        function renderAll() {
            renderTags('moduleTags', db.modules, 'module');
            renderTags('angleTags', db.angles, 'angle');
            renderTags('testCatTags', db.testimonialCategories, 'testCat');
            renderTags('courseCatTags', db.courseCategories, 'courseCat');
            document.getElementById('pubAngle').innerHTML = db.angles.map(a => `<option>${a}</option>`).join('');
            renderTestTable();
            renderCourseTable();
            document.getElementById('editTestCat').innerHTML = db.testimonialCategories.map(c => `<option>${c}</option>`).join('');
            document.getElementById('editCourseCat').innerHTML = db.courseCategories.map(c => `<option>${c}</option>`).join('');
        }

        function renderTags(containerId, arr, type) {
            document.getElementById(containerId).innerHTML = arr.map(item =>
                `<span class="tag">${item} <i class="fa-solid fa-xmark" onclick="removeItem('${type}','${item}')"></i></span>`
            ).join('');
        }

        function addItem(type, inputId) {
            const val = document.getElementById(inputId).value.trim();
            if (!val) return;
            const arr = type === 'module' ? db.modules : type === 'angle' ? db.angles : type === 'testCat' ? db.testimonialCategories : db.courseCategories;
            if (arr.includes(val)) { toast('已存在'); return; }
            arr.push(val);
            save(); renderAll(); document.getElementById(inputId).value = '';
        }
        function removeItem(type, val) {
            const arr = type === 'module' ? db.modules : type === 'angle' ? db.angles : type === 'testCat' ? db.testimonialCategories : db.courseCategories;
            const idx = arr.indexOf(val);
            if (idx > -1) { arr.splice(idx,1); save(); renderAll(); }
        }

        window.addModule = () => addItem('module','newModule');
        window.addAngle = () => addItem('angle','newAngle');
        window.addTestCat = () => addItem('testCat','newTestCat');
        window.addCourseCat = () => addItem('courseCat','newCourseCat');

        function publishPost() {
            const angle = document.getElementById('pubAngle').value;
            const text = document.getElementById('pubText').value.trim();
            if (!text) return;
            db.posts.push({ id: Date.now(), module:'朋友圈', angle, text, time: Date.now() });
            save(); document.getElementById('pubText').value = ''; toast('已发布');
        }

        function renderTestTable() {
            const tbody = document.getElementById('testTableBody');
            tbody.innerHTML = db.testimonials.map((t,i) => `
                <tr>
                    <td>${t.title}</td><td>${t.category}</td>
                    <td class="action-icons">
                        <i class="fa-solid fa-pen" onclick="editTestimonial(${i})"></i>
                        <i class="fa-solid fa-trash" onclick="deleteTestimonial(${i})"></i>
                    </td>
                </tr>`).join('');
        }

        function renderCourseTable() {
            const tbody = document.getElementById('courseTableBody');
            tbody.innerHTML = db.courses.map((c,i) => `
                <tr>
                    <td>${c.title}</td><td>${c.category}</td>
                    <td class="action-icons">
                        <i class="fa-solid fa-pen" onclick="editCourse(${i})"></i>
                        <i class="fa-solid fa-trash" onclick="deleteCourse(${i})"></i>
                    </td>
                </tr>`).join('');
        }

        function clearTestForm() {
            document.getElementById('editTestId').value = '';
            document.getElementById('editTestTitle').value = '';
            document.getElementById('editTestImage').value = '';
            document.getElementById('editTestVideo').value = '';
            document.getElementById('editTestDesc').value = '';
            document.getElementById('editTestClient').value = '';
            document.getElementById('editTestDate').value = '';
        }

        window.editTestimonial = function(idx) {
            const t = db.testimonials[idx];
            document.getElementById('editTestId').value = idx;
            document.getElementById('editTestCat').value = t.category;
            document.getElementById('editTestTitle').value = t.title;
            document.getElementById('editTestImage').value = t.imageUrl || '';
            document.getElementById('editTestVideo').value = t.videoUrl || '';
            document.getElementById('editTestDesc').value = t.description;
            document.getElementById('editTestClient').value = t.clientName || '';
            document.getElementById('editTestDate').value = t.date || '';
        };

        window.saveTestimonial = function() {
            const idx = document.getElementById('editTestId').value;
            const data = {
                module: '客户见证',
                category: document.getElementById('editTestCat').value,
                title: document.getElementById('editTestTitle').value.trim(),
                imageUrl: document.getElementById('editTestImage').value.trim(),
                videoUrl: document.getElementById('editTestVideo').value.trim(),
                description: document.getElementById('editTestDesc').value.trim(),
                clientName: document.getElementById('editTestClient').value.trim(),
                date: document.getElementById('editTestDate').value.trim()
            };
            if (!data.title || !data.description) return toast('标题和描述必填');
            if (idx === '') {
                data.id = Date.now();
                db.testimonials.push(data);
            } else {
                db.testimonials[idx] = { ...db.testimonials[idx], ...data };
            }
            save(); renderAll(); clearTestForm(); toast('已保存');
        };

        window.deleteTestimonial = function(idx) {
            if (!confirm('确认删除？')) return;
            db.testimonials.splice(idx,1);
            save(); renderAll();
        };

        window.editCourse = function(idx) {
            const c = db.courses[idx];
            document.getElementById('editCourseId').value = idx;
            document.getElementById('editCourseCat').value = c.category;
            document.getElementById('editCourseTitle').value = c.title;
            document.getElementById('editCourseImage').value = c.imageUrl || '';
            document.getElementById('editCourseVideo').value = c.videoUrl || '';
            document.getElementById('editCourseDesc').value = c.description;
            document.getElementById('editCourseDate').value = c.date || '';
        };

        window.saveCourse = function() {
            const idx = document.getElementById('editCourseId').value;
            const data = {
                module: '课程卖点',
                category: document.getElementById('editCourseCat').value,
                title: document.getElementById('editCourseTitle').value.trim(),
                imageUrl: document.getElementById('editCourseImage').value.trim(),
                videoUrl: document.getElementById('editCourseVideo').value.trim(),
                description: document.getElementById('editCourseDesc').value.trim(),
                date: document.getElementById('editCourseDate').value.trim()
            };
            if (!data.title || !data.description) return toast('标题和描述必填');
            if (idx === '') {
                data.id = Date.now();
                db.courses.push(data);
            } else {
                db.courses[idx] = { ...db.courses[idx], ...data };
            }
            save(); renderAll(); clearCourseForm(); toast('已保存');
        };

        function clearCourseForm() {
            document.getElementById('editCourseId').value = '';
            document.getElementById('editCourseTitle').value = '';
            document.getElementById('editCourseImage').value = '';
            document.getElementById('editCourseVideo').value = '';
            document.getElementById('editCourseDesc').value = '';
            document.getElementById('editCourseDate').value = '';
        }

        window.deleteCourse = function(idx) {
            if (!confirm('确认删除？')) return;
            db.courses.splice(idx,1);
            save(); renderAll();
        };

        window.onload = () => {
            // 保持登录密码框焦点
        };
    </script>
</body>
</html>
