<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园 · 后台管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --ink: #1D1D1F;
  --gold: #C66A4E;
  --cream: #F7F5F0;
  --warm: #F0EDE6;
  --mist: #E5E0D8;
  --sage: #849688;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--cream);
  font-family:'Noto Sans SC',sans-serif;
  color:var(--ink);min-height:100vh;
}

/* LOGIN */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--ink);
}
.login-box{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(198,106,78,0.3);
  padding:48px 44px;
  width:100%;max-width:380px;
  text-align:center;border-radius:16px;
}
.login-logo{
  font-family:'Noto Serif SC',serif;
  font-size:1.4rem;font-weight:900;
  color:#fff;letter-spacing:.1em;
}
.login-input{
  width:100%;padding:14px 16px;margin:12px 0;
  background:rgba(255,255,255,0.08);border:1px solid rgba(198,106,78,0.4);
  color:#fff;border-radius:8px;font-size:1rem;
}
.login-btn{
  width:100%;padding:14px;background:var(--gold);color:white;
  border:none;border-radius:8px;font-size:1rem;cursor:pointer;margin-top:10px;
}

/* ADMIN */
#adminScreen{display:none;}
.admin-header{
  background:var(--ink);padding:0 30px;height:70px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.admin-logo{font-family:'Noto Serif SC',serif;font-size:1.1rem;color:white;}

.main-content{
  max-width:1280px;margin:0 auto;padding:30px;
}

/* TABS */
.admin-tabs{
  display:flex;gap:20px;margin-bottom:30px;border-bottom:1px solid var(--mist);
}
.admin-tab{
  padding:12px 0;cursor:pointer;font-size:1.05rem;
  position:relative;
}
.admin-tab.active{
  color:var(--gold);
}
.admin-tab.active::after{
  content:'';position:absolute;bottom:-1px;left:0;width:100%;height:3px;background:var(--gold);
}

/* FORMS & CARDS */
.add-card, .manage-card{
  background:white;border:1px solid var(--mist);
  border-radius:16px;padding:32px;margin-bottom:40px;
}
.form-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(280px,1fr));gap:20px;
}
.form-group label{
  display:block;font-size:0.85rem;opacity:0.7;margin-bottom:8px;
}
.form-input, .form-select, .form-textarea{
  width:100%;padding:14px;border:1px solid var(--mist);
  border-radius:8px;background:var(--warm);font-size:1rem;
}
.form-textarea{min-height:160px;resize:vertical;}

.btn{
  padding:14px 32px;border:none;border-radius:8px;
  font-size:1rem;cursor:pointer;
}
.btn-primary{background:var(--ink);color:white;}
.btn-danger{background:#c0392b;color:white;}

/* POST LIST */
.post-list{
  display:flex;flex-direction:column;gap:16px;
}
.post-item{
  background:white;border:1px solid var(--mist);
  border-radius:16px;padding:24px;
  transition:all 0.3s;
}
.post-item:hover{box-shadow:0 20px 40px rgba(0,0,0,0.08);}

/* CATEGORY MANAGER */
.tag-manager{
  display:flex;flex-wrap:wrap;gap:10px;margin:15px 0;
}
.tag-item{
  background:#f5f0e8;padding:8px 16px;border-radius:999px;
  display:flex;align-items:center;gap:8px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">易饰乾园 · 后台</div>
    <p style="color:rgba(255,255,255,0.6);margin:20px 0 30px;">文案资产管理系统</p>
    <input type="password" id="pwdInput" class="login-input" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" onclick="doLogin()">进入后台</button>
    <div id="loginError" style="color:#ff6b6b;margin-top:15px;font-size:0.9rem;"></div>
  </div>
</div>

<!-- ADMIN INTERFACE -->
<div id="adminScreen">
  <div class="admin-header">
    <div class="admin-logo">易饰乾园 · 文案后台</div>
    <div>
      <button onclick="saveAll()" style="margin-right:12px;" class="btn btn-primary">💾 保存并同步</button>
      <button onclick="doLogout()" class="btn" style="background:#666;color:white;">退出</button>
    </div>
  </div>

  <div class="main-content">

    <!-- 切换 Tab -->
    <div class="admin-tabs">
      <div class="admin-tab active" onclick="switchTab(0)">新增文案</div>
      <div class="admin-tab" onclick="switchTab(1)">文案管理</div>
      <div class="admin-tab" onclick="switchTab(2)">模块 & 角度管理</div>
    </div>

    <!-- Tab 1: 新增文案 -->
    <div id="tab0">
      <div class="add-card">
        <h2 style="margin-bottom:24px;">发布新文案</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>模块</label>
            <select id="new-module" class="form-select"></select>
          </div>
          <div class="form-group">
            <label>角度</label>
            <select id="new-angle" class="form-select"></select>
          </div>
          <div class="form-group">
            <label>编号（可选）</label>
            <input type="text" id="new-no" class="form-input" placeholder="如 031">
          </div>
        </div>
        <div class="form-group">
          <label>文案内容</label>
          <textarea id="new-text" class="form-textarea" placeholder="在此输入文案..."></textarea>
        </div>
        <button onclick="addNewPost()" class="btn btn-primary" style="width:100%;padding:16px;">立即发布</button>
      </div>
    </div>

    <!-- Tab 2: 文案列表 -->
    <div id="tab1" style="display:none;">
      <input type="text" id="searchInput" placeholder="搜索文案..." style="width:100%;padding:14px;margin-bottom:20px;border:1px solid var(--mist);border-radius:8px;" onkeyup="filterPosts()">
      <div class="post-list" id="postList"></div>
    </div>

    <!-- Tab 3: 模块 & 角度管理 -->
    <div id="tab2" style="display:none;">
      <div class="manage-card">
        <h3>模块管理</h3>
        <div class="tag-manager" id="module-manager"></div>
        <div style="display:flex;gap:10px;">
          <input type="text" id="add-module" placeholder="新增模块名称" class="form-input">
          <button onclick="addModule()" class="btn btn-primary">添加</button>
        </div>
      </div>

      <div class="manage-card">
        <h3>角度管理</h3>
        <div class="tag-manager" id="angle-manager"></div>
        <div style="display:flex;gap:10px;">
          <input type="text" id="add-angle" placeholder="新增角度名称" class="form-input">
          <button onclick="addAngle()" class="btn btn-primary">添加</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 配置 ====================
const BIN_ID = 'YOUR_BIN_ID';           // ← 修改为你的 JSONBin ID
const MASTER_KEY = 'YOUR_MASTER_KEY';   // ← 修改为你的 Master Key
const DEFAULT_PWD = 'ysqy_admin';       // 默认密码，可自行修改

let posts = [];
let modules = ["朋友圈", "课程手册", "品牌故事"];
let angles = ["数字冲击", "对话还原", "情绪唤醒", "场景反差", "学员故事"];
let currentTab = 0;

// ==================== 登录 ====================
function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd === DEFAULT_PWD || pwd === localStorage.getItem('admin_pwd')) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginError').textContent = '密码错误';
  }
}

function doLogout() {
  document.getElementById('adminScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pwdInput').value = '';
}

// ==================== 数据操作 ====================
async function loadData() {
  if (BIN_ID === 'YOUR_BIN_ID') {
    posts = JSON.parse(localStorage.getItem('yishiy_posts') || '[]');
    renderAll();
    return;
  }
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: {'X-Master-Key': MASTER_KEY}
    });
    const data = await res.json();
    posts = data.record.posts || [];
    modules = data.record.modules || modules;
    angles = data.record.angles || angles;
    renderAll();
  } catch(e) {
    console.log("云端加载失败，使用本地数据");
    posts = JSON.parse(localStorage.getItem('yishiy_posts') || '[]');
    renderAll();
  }
}

async function saveAll() {
  localStorage.setItem('yishiy_posts', JSON.stringify(posts));
  
  if (BIN_ID !== 'YOUR_BIN_ID') {
    try {
      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': MASTER_KEY
        },
        body: JSON.stringify({posts, modules, angles})
      });
      alert("✅ 已成功保存至云端");
    } catch(e) {
      alert("云端保存失败，已保存至本地");
    }
  } else {
    alert("✅ 已保存至本地（未配置云端）");
  }
  renderAll();
}

// ==================== 渲染 ====================
function renderAll() {
  renderModuleSelect();
  renderAngleSelect();
  renderPosts();
  renderCategoryManagers();
}

function renderModuleSelect() {
  const html = modules.map(m => `<option value="${m}">${m}</option>`).join('');
  document.getElementById('new-module').innerHTML = html;
}

function renderAngleSelect() {
  const html = angles.map(a => `<option value="${a}">${a}</option>`).join('');
  document.getElementById('new-angle').innerHTML = html;
}

function renderPosts() {
  const container = document.getElementById('postList');
  container.innerHTML = posts.map((post, i) => `
    <div class="post-item">
      <strong>#${post.no || i+1} ${post.module} · ${post.angle}</strong>
      <p style="margin:12px 0;white-space:pre-wrap;">${post.text}</p>
      <button onclick="deletePost(${i})" class="btn btn-danger" style="padding:8px 16px;font-size:0.9rem;">删除</button>
    </div>
  `).join('');
}

function renderCategoryManagers() {
  document.getElementById('module-manager').innerHTML = modules.map((m,i) => `
    <div class="tag-item">${m} <span onclick="removeModule(${i})" style="cursor:pointer;color:#c0392b;">×</span></div>
  `).join('');

  document.getElementById('angle-manager').innerHTML = angles.map((a,i) => `
    <div class="tag-item">${a} <span onclick="removeAngle(${i})" style="cursor:pointer;color:#c0392b;">×</span></div>
  `).join('');
}

// ==================== 操作函数 ====================
function switchTab(n) {
  currentTab = n;
  document.querySelectorAll('.admin-tab').forEach((el,i)=> {
    el.classList.toggle('active', i===n);
  });
  document.getElementById('tab0').style.display = n===0 ? 'block' : 'none';
  document.getElementById('tab1').style.display = n===1 ? 'block' : 'none';
  document.getElementById('tab2').style.display = n===2 ? 'block' : 'none';
}

function addNewPost() {
  const text = document.getElementById('new-text').value.trim();
  if (!text) return alert("请输入文案内容");

  posts.unshift({
    no: document.getElementById('new-no').value || String(posts.length+1).padStart(2,'0'),
    module: document.getElementById('new-module').value,
    angle: document.getElementById('new-angle').value,
    text: text
  });

  saveAll();
  document.getElementById('new-text').value = '';
  document.getElementById('new-no').value = '';
  alert("✅ 文案发布成功");
}

function deletePost(i) {
  if(confirm("确定删除这条文案吗？")) {
    posts.splice(i,1);
    saveAll();
  }
}

function addModule() {
  const input = document.getElementById('add-module');
  if(input.value.trim()) {
    modules.push(input.value.trim());
    input.value = '';
    saveAll();
  }
}

function removeModule(i) {
  if(confirm("删除模块会影响已有文案，确定继续？")) {
    modules.splice(i,1);
    saveAll();
  }
}

function addAngle() {
  const input = document.getElementById('add-angle');
  if(input.value.trim()) {
    angles.push(input.value.trim());
    input.value = '';
    saveAll();
  }
}

function removeAngle(i) {
  if(confirm("确定删除此角度？")) {
    angles.splice(i,1);
    saveAll();
  }
}

function filterPosts() {
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  const filtered = posts.filter(p => 
    p.text.toLowerCase().includes(keyword) || 
    p.angle.toLowerCase().includes(keyword)
  );
  // 简化处理：直接用全局 posts 展示，实际可优化
  renderPosts();
}

// 初始化
window.onload = () => {
  if(localStorage.getItem('admin_pwd') === null) {
    localStorage.setItem('admin_pwd', DEFAULT_PWD);
  }
};
</script>
</body>
</html>
