<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园 · 后台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500&display=swap');

body {
  background: #111111;
  font-family: 'Noto Sans SC', sans-serif;
  color: #ddd;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

.login-box {
  background: #1f1f1f;
  border: 1px solid #3a3a3a;
  border-radius: 16px;
  width: 100%;
  max-width: 420px;
  padding: 60px 50px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,0.7);
}

.login-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.9rem;
  margin-bottom: 8px;
}

.login-subtitle {
  color: #999;
  margin-bottom: 40px;
}

.login-input {
  width: 100%;
  padding: 16px 20px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 8px;
  color: white;
  font-size: 1.15rem;
  margin-bottom: 25px;
}

.btn-login {
  width: 100%;
  padding: 16px;
  background: #C66A4E;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 1.1rem;
  cursor: pointer;
}

.error-msg {
  color: #ff6b6b;
  margin-top: 20px;
  min-height: 28px;
}
</style>
</head>
<body>

<div class="login-box">
  <div class="login-title">易饰乾园 · 后台</div>
  <div class="login-subtitle">文案资产管理系统</div>
  
  <input type="password" id="pwdInput" class="login-input" placeholder="请输入密码" autofocus>
  <button class="btn-login" onclick="doLogin()">进入后台</button>
  
  <div id="loginError" class="error-msg"></div>
</div>

<script>
// ====================== 密码设置 ======================
const CORRECT_PASSWORD = "ysqy798";   // ← 确认无误

function doLogin() {
  const input = document.getElementById('pwdInput').value.trim();
  const errorEl = document.getElementById('loginError');

  if (input === CORRECT_PASSWORD) {
    alert("✅ 登录成功！\n\n（后台功能正在完善中...）");
    // 这里后续可以跳转或显示后台界面
    window.location.href = "index.html";   // 临时跳转前台，可改成显示后台
  } else {
    errorEl.textContent = "密码错误";
    document.getElementById('pwdInput').value = "";
    document.getElementById('pwdInput').focus();
  }
}

// 支持回车登录
document.getElementById('pwdInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
