<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园 · 后台管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2;
            --card-bg: #FFFFFF;
            --ink: #1a1815;
            --ink-light: #5c574f;
            --gold: #b8832a;
            --gold-pale: #f7f0e0;
            --border: rgba(0,0,0,0.06);
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-full: 50px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); font-family:'Noto Sans SC', sans-serif; color:var(--ink); }
        .container { max-width:1000px; margin:0 auto; padding:0 24px; }
        .login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:48px 36px; max-width:380px; width:100%; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.08); }
        .login-card h1 { font-family:'Noto Serif SC', serif; font-size:1.8rem; }
        .login-card input { width:100%; padding:14px 18px; border:1.5px solid #ddd; border-radius:var(--radius-full); text-align:center; font-size:1rem; margin-bottom:16px; }
        .btn { background:var(--ink); color:#fff; border:none; padding:12px 24px; border-radius:var(--radius-full); cursor:pointer; font-weight:500; }
        .btn-full { width:100%; }
        .btn-outline {
            background:transparent; color:var(--ink); border:1.5px solid #ccc;
            padding:8px 20px; border-radius:var(--radius-full); cursor:pointer;
            font-size:0.8rem; font-weight:600; text-decoration:none; display:inline-block;
        }
        .btn-outline:hover { background:#f5f5f5; }
        .admin-header { display:flex; justify-content:space-between; align-items:center; padding:32px 0 24px; }
        .admin-header h1 { font-family:'Noto Serif SC', serif; font-size:1.8rem; }
        .header-actions { display:flex; gap:10px; align-items:center; }
        .header-actions .btn-outline { font-weight:600; }
        .panel-grid { display:grid; grid-template-columns:240px 1fr; gap:20px; }
        .module-sidebar { background:var(--card-bg); border-radius:var(--radius-lg); padding:20px; border:1px solid var(--border); }
        .module-item { display:flex; justify-content:space-between; padding:10px 12px; border-radius:var(--radius-md); cursor:pointer; }
        .module-item.active { background:var(--gold-pale); }
        .content-panel { background:var(--card-bg); border-radius:var(--radius-lg); padding:28px; border:1px solid var(--border); }
        input[type="text"], input[type="url"], select { border-radius:30px!important; padding:12px 18px; border:1.5px solid #e0dbd0; width:100%; margin-bottom:8px; }
        textarea { border-radius:25px!important; padding:14px 18px; min-height:150px; border:1.5px solid #e0dbd0; width:100%; resize:vertical; }
        .tag-list { display:flex; flex-wrap:wrap; gap:8px; }
        .tag-item { background:#f0ede5; padding:6px 14px; border-radius:20px; font-size:0.8rem; }
        .admin-card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:16px; }
        .admin-card { background:#fff; border-radius:var(--radius-lg); padding:18px; border:1px solid var(--border); }
        .admin-card .preview-title { font-weight:600; }
        .admin-card .preview-text { font-size:0.82rem; color:var(--ink-light); min-height:6em; max-height:10em; overflow-y:auto; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:2000; }
        .modal-box { background:#fff; border-radius:var(--radius-lg); padding:28px; max-width:500px; width:90%; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 24px; border-radius:30px; font-size:0.8rem; opacity:0; transition:0.3s; }
        .toast.show { opacity:1; }
    </style>
</head>
<body>
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1>易饰乾园 · 后台</h1>
        <input type="password" id="pwdInput" placeholder="管理密码">
        <button class="btn btn-full" onclick="login()">进入后台</button>
        <a href="index.html" class="btn-outline" style="margin-top:16px; display:inline-block;">← 返回前台</a>
    </div>
</div>

<div id="adminMain" style="display:none;">
    <div class="container">
        <div class="admin-header">
            <h1>库管理中心</h1>
            <div class="header-actions">
                <a href="index.html" class="btn-outline">← 前台</a>
                <button class="btn-outline" onclick="exportData()">📤 导出</button>
                <label class="btn-outline" style="cursor:pointer;">📥 导入<input type="file" hidden onchange="importData(this)"></label>
            </div>
        </div>
        <div class="panel-grid">
            <div class="module-sidebar">
                <h3>模块</h3>
                <div id="moduleList"></div>
                <button class="btn btn-full" style="margin-top:12px;" onclick="addModule()">新增模块</button>
            </div>
            <div class="content-panel" id="contentPanel">← 选择模块</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
    const DATA_KEY = 'ysqy_data_v3';
    const DEFAULT_MODULES = [
        { id:'pyq', name:'朋友圈', type:'moments', categories:['数字冲击','对话还原'] },
        { id:'witness', name:'客户见证', type:'testimonial', categories:['文昌','沙龙'] },
        { id:'course', name:'课程卖点', type:'course', categories:['核心价值'] }
    ];
    let raw = localStorage.getItem(DATA_KEY);
    let db = raw ? JSON.parse(raw) : { modules: JSON.parse(JSON.stringify(DEFAULT_MODULES)), contents: [] };
    if (!db.modules) db = { modules: JSON.parse(JSON.stringify(DEFAULT_MODULES)), contents: [] };
    save();
    function save() { localStorage.setItem(DATA_KEY, JSON.stringify(db)); }
    function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

    window.login = function() {
        if (document.getElementById('pwdInput').value === 'ysqy798') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminMain').style.display = 'block';
            renderSidebar();
        } else toast('密码错误');
    };

    let currentModuleId = null;
    function renderSidebar() {
        document.getElementById('moduleList').innerHTML = db.modules.map(m => `
            <div class="module-item ${currentModuleId===m.id?'active':''}" onclick="selectModule('${m.id}')">
                <span>${m.name}</span>
                <div onclick="event.stopPropagation()">
                    <i class="fa-solid fa-pen" onclick="renameModule('${m.id}')"></i>
                    <i class="fa-solid fa-trash" onclick="deleteModule('${m.id}')"></i>
                </div>
            </div>`).join('');
        if (currentModuleId) renderContent();
    }
    window.selectModule = function(id) { currentModuleId=id; renderSidebar(); };

    function renderContent() {
        const mod = db.modules.find(m=>m.id===currentModuleId);
        if (!mod) return;
        const contents = db.contents.filter(c=>c.moduleId===currentModuleId);
        let html = `<h3>${mod.name}</h3>`;
        html += `<div class="tag-list">${(mod.categories||[]).map(c=>`<span class="tag-item">${c} <i class="fa-solid fa-xmark" onclick="deleteCategory('${c}')"></i></span>`).join('')}</div>
        <input type="text" id="newCatInput" placeholder="新分类"><button class="btn" onclick="addCategory()">添加</button>`;
        if (mod.type==='moments') {
            html += `<select id="pubAngle">${mod.categories.map(c=>`<option>${c}</option>`).join('')}</select>
            <textarea id="pubText" placeholder="文案..."></textarea><button class="btn" onclick="publish()">发布</button>`;
        } else {
            html += `<select id="pubCategory">${mod.categories.map(c=>`<option>${c}</option>`).join('')}</select>
            <input type="text" id="pubTitle" placeholder="标题"><input type="text" id="pubImage" placeholder="图片URL">
            <input type="text" id="pubVideo" placeholder="视频URL"><textarea id="pubDesc" placeholder="描述"></textarea>
            <input type="text" id="pubDate" placeholder="日期"><button class="btn" onclick="publish()">保存</button>`;
        }
        html += `<div class="admin-card-grid">`;
        contents.forEach(c => {
            const idx = db.contents.indexOf(c);
            html += `<div class="admin-card">
                ${c.title?`<div class="preview-title">${c.title}</div>`:''}
                <div class="preview-text">${c.text||c.description||''}</div>
                <div class="card-actions" style="display:flex;justify-content:flex-end;gap:6px;margin-top:8px;">
                    <i class="fa-solid fa-arrow-up" onclick="moveContent(${idx},-1)"></i>
                    <i class="fa-solid fa-arrow-down" onclick="moveContent(${idx},1)"></i>
                    <i class="fa-solid fa-pen" onclick="editContent(${idx})"></i>
                    <i class="fa-solid fa-trash" onclick="deleteContent(${idx})"></i>
                </div>
            </div>`;
        });
        html += `</div>`;
        document.getElementById('contentPanel').innerHTML = html;
    }

    window.publish = function() {
        const mod = db.modules.find(m=>m.id===currentModuleId);
        const item = { id:Date.now(), moduleId:currentModuleId };
        if (mod.type==='moments') {
            item.angle = document.getElementById('pubAngle').value;
            item.text = document.getElementById('pubText').value.trim();
        } else {
            item.category = document.getElementById('pubCategory').value;
            item.title = document.getElementById('pubTitle').value.trim();
            item.description = document.getElementById('pubDesc').value.trim();
            item.imageUrl = document.getElementById('pubImage').value.trim();
            item.videoUrl = document.getElementById('pubVideo').value.trim();
            item.date = document.getElementById('pubDate').value.trim();
        }
        db.contents.unshift(item); save(); renderContent(); toast('已发布');
    };

    window.editContent = function(idx) {
        const c = db.contents[idx];
        const mod = db.modules.find(m=>m.id===c.moduleId);
        let form = '';
        if (mod.type==='moments') {
            form = `<select id="editAngle">${mod.categories.map(cat=>`<option ${cat===c.angle?'selected':''}>${cat}</option>`).join('')}</select>
            <textarea id="editText" style="min-height:150px;">${c.text}</textarea>`;
        } else {
            form = `<select id="editCat">${mod.categories.map(cat=>`<option ${cat===c.category?'selected':''}>${cat}</option>`).join('')}</select>
            <input type="text" id="editTitle" value="${c.title||''}">
            <textarea id="editDesc" style="min-height:150px;">${c.description||''}</textarea>`;
        }
        const overlay = document.createElement('div');
        overlay.className = 'modal';
        overlay.innerHTML = `<div class="modal-box">
            <h3>编辑内容</h3>${form}
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
                <button class="btn-outline" onclick="this.closest('.modal').remove()">取消</button>
                <button class="btn" id="saveEditBtn">保存</button>
            </div>
        </div>`;
        document.body.appendChild(overlay);
        document.getElementById('saveEditBtn').onclick = function() {
            if (mod.type==='moments') {
                c.angle = document.getElementById('editAngle').value;
                c.text = document.getElementById('editText').value.trim();
            } else {
                c.category = document.getElementById('editCat').value;
                c.title = document.getElementById('editTitle').value.trim();
                c.description = document.getElementById('editDesc').value.trim();
            }
            save(); renderContent(); overlay.remove(); toast('已更新');
        };
        overlay.onclick = function(e) { if (e.target===overlay) overlay.remove(); };
    };

    // 辅助函数（移动、删除、分类管理等）与之前相同，略
    window.moveContent = function(idx, dir) { /* ... */ };
    window.deleteContent = function(idx) { if(confirm('删除？')){db.contents.splice(idx,1);save();renderContent();} };
    window.addCategory = function() { /* ... */ };
    window.deleteCategory = function(val) { /* ... */ };
    window.addModule = function() { const name=prompt('模块名称'); if(name){ db.modules.push({id:'mod_'+Date.now(),name,type:'moments',categories:[]}); save();renderSidebar(); } };
    window.renameModule = function(id) { const mod=db.modules.find(m=>m.id===id); const newName=prompt('新名称',mod.name); if(newName){mod.name=newName;save();renderSidebar();} };
    window.deleteModule = function(id) { if(confirm('删除将清空内容')){db.modules=db.modules.filter(m=>m.id!==id);db.contents=db.contents.filter(c=>c.moduleId!==id);save();renderSidebar();} };
    window.exportData = function() { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'})); a.download='backup.json'; a.click(); };
    window.importData = function(input) { const reader=new FileReader(); reader.onload=e=>{db=JSON.parse(e.target.result);save();renderSidebar();document.getElementById('contentPanel').innerHTML='← 选择模块';}; reader.readAsText(input.files[0]); };
})();
</script>
</body>
</html>
