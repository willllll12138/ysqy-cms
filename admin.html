<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园 · 后台管理 V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2;
            --card-bg: #FFFFFF;
            --ink: #1a1815;
            --ink-light: #5c574f;
            --gold: #b8832a;
            --gold-pale: #f7f0e0;
            --border: rgba(0,0,0,0.06);
            --border-strong: rgba(0,0,0,0.12);
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-full: 50px;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.07);
            --transition: 0.3s cubic-bezier(0.23,1,0.32,1);
            --font-serif: 'Noto Serif SC', 'Songti SC', serif;
            --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:var(--bg);
            font-family:var(--font-sans);
            color:var(--ink);
            line-height:1.6;
            min-height:100vh;
        }
        body::before {
            content:''; position:fixed; top:0; left:0; right:0; height:3px;
            background:linear-gradient(90deg,var(--gold),#8b3a3a,#5a6b4d);
            z-index:1000;
        }
        .container { max-width:1000px; margin:0 auto; padding:0 24px; }

        /* 登录 */
        .login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-card {
            background:var(--card-bg); border-radius:var(--radius-lg); padding:48px 36px;
            max-width:380px; width:100%; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.08);
        }
        .login-card .hero-tag { display:inline-block; font-size:0.7rem; letter-spacing:0.35em; color:var(--gold); background:var(--gold-pale); padding:6px 18px; border-radius:var(--radius-full); margin-bottom:16px; }
        .login-card h1 { font-family:var(--font-serif); font-size:1.8rem; margin-bottom:12px; }
        .login-card .sub { font-size:0.8rem; color:var(--ink-light); margin-bottom:24px; }
        .login-card input { width:100%; padding:14px 18px; border:1.5px solid var(--border); border-radius:var(--radius-full); text-align:center; font-size:1rem; outline:none; margin-bottom:16px; background:var(--bg); }
        .btn { background:var(--ink); color:#fff; border:none; padding:12px 24px; border-radius:var(--radius-full); cursor:pointer; font-family:inherit; font-weight:500; letter-spacing:0.05em; transition:0.2s; }
        .btn:hover { background:#2b2b2b; }
        .btn-outline {
            background:transparent; color:var(--ink); border:1.5px solid var(--border-strong);
            padding:8px 16px; border-radius:var(--radius-full); cursor:pointer;
            font-family:inherit; font-size:0.75rem; letter-spacing:0.04em; transition:0.2s;
            display:inline-flex; align-items:center; gap:4px; text-decoration:none;
        }
        .btn-outline:hover { background:#f5f5f5; border-color:#aaa; }
        .login-links { margin-top:16px; display:flex; justify-content:center; gap:20px; }
        .login-links a { color:var(--ink-light); font-size:0.8rem; text-decoration:none; }
        .login-links a:hover { color:var(--gold); }
        .login-error { color:#c33; font-size:0.8rem; min-height:20px; }
        .back-to-front { margin-top:20px; }

        /* 主界面 */
        .admin-header { display:flex; align-items:center; justify-content:space-between; padding:32px 0 24px; flex-wrap:wrap; gap:12px; }
        .admin-header h1 { font-family:var(--font-serif); font-size:1.8rem; }
        .panel-grid { display:grid; grid-template-columns: 240px 1fr; gap:20px; margin-bottom:40px; }
        .module-sidebar {
            background:var(--card-bg); border-radius:var(--radius-lg); padding:20px;
            border:1px solid var(--border); box-shadow:var(--shadow-sm); height:fit-content;
        }
        .module-sidebar h3 { font-size:1rem; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
        .module-list { display:flex; flex-direction:column; gap:6px; }
        .module-item {
            display:flex; align-items:center; justify-content:space-between;
            padding:10px 12px; border-radius:var(--radius-md); cursor:pointer;
            border:1px solid transparent; transition:0.2s; font-size:0.9rem;
        }
        .module-item:hover { background:#faf8f3; }
        .module-item.active { background:var(--gold-pale); border-color:var(--gold); }
        .module-item .actions { display:flex; gap:4px; }
        .module-item .actions i { cursor:pointer; color:#888; padding:4px; border-radius:6px; }
        .module-item .actions i:hover { color:var(--gold); background:#fff; }
        .btn-add-module { margin-top:12px; width:100%; }

        .content-panel {
            background:var(--card-bg); border-radius:var(--radius-lg); padding:28px;
            border:1px solid var(--border); box-shadow:var(--shadow-sm);
        }
        .tag-list { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 16px; }
        .tag-item { background:#f0ede5; padding:6px 14px; border-radius:var(--radius-full); font-size:0.8rem; display:flex; align-items:center; gap:6px; }
        .tag-item i { cursor:pointer; color:#b33; font-size:0.7rem; }
        .tag-item .edit-tag { color:var(--gold); cursor:pointer; }

        /* 全局输入框大圆角 + 文本框至少6行 */
        input[type="text"], input[type="url"], input[type="date"], select {
            border-radius: 30px !important;
            padding: 12px 18px;
            border:1.5px solid #e0dbd0;
            font-family:inherit;
            font-size:0.85rem;
            background:#fdfdfb;
            outline:none;
            width:100%;
            margin-bottom:8px;
        }
        textarea {
            border-radius: 25px !important;
            padding: 14px 18px;
            min-height: 150px;
            border:1.5px solid #e0dbd0;
            font-family:inherit;
            font-size:0.85rem;
            background:#fdfdfb;
            outline:none;
            width:100%;
            resize:vertical;
        }
        .content-panel .form-inline {
            display:flex; gap:10px; align-items:center; flex-wrap:wrap;
        }

        /* 卡片式内容列表 */
        .admin-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .admin-card {
            background: #fff;
            border-radius: var(--radius-lg);
            padding: 18px;
            border:1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            transition: var(--transition);
        }
        .admin-card:hover { box-shadow: var(--shadow-md); }
        .admin-card .preview-text {
            font-size: 0.85rem;
            line-height: 1.7;
            white-space: pre-wrap;
            max-height: 100px;
            overflow-y: auto;
            color: var(--ink);
        }
        .admin-card .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #aaa;
        }
        .admin-card .card-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            margin-top: 4px;
        }
        .admin-card .card-actions i {
            cursor: pointer;
            color: #888;
            padding: 4px;
            border-radius: 6px;
            font-size:0.9rem;
        }
        .admin-card .card-actions i:hover { color: var(--gold); background: var(--gold-pale); }

        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s; }
        .modal-overlay.open { opacity:1; pointer-events:auto; }
        .modal { background:#fff; border-radius:var(--radius-lg); padding:32px; max-width:480px; width:90%; max-height:80vh; overflow-y:auto; position:relative; }
        .modal h3 { font-family:var(--font-serif); margin-bottom:16px; }
        .modal .form-group { margin-bottom:12px; }
        .modal .form-group label { display:block; font-size:0.72rem; letter-spacing:0.05em; margin-bottom:4px; color:var(--ink-light); }
        .modal .form-group input, .modal .form-group select, .modal .form-group textarea {
            width:100%; padding:10px 14px; border:1.5px solid #e0dbd0; border-radius:12px;
            font-family:inherit; background:#fdfdfb; outline:none;
        }
        .modal .btn-group { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 24px; border-radius:30px; font-size:0.8rem; opacity:0; transition:0.3s; z-index:3000; pointer-events:none; }
        .toast.show { opacity:1; }

        @media (max-width:680px) {
            .panel-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <div class="hero-tag">ADMIN PANEL</div>
        <h1>易饰乾园 · 后台</h1>
        <p class="sub">文案资产管理系统</p>
        <input type="password" id="pwdInput" placeholder="管理密码" onkeydown="if(event.key==='Enter')login()">
        <button class="btn" onclick="login()">进入后台</button>
        <div class="login-error" id="loginError"></div>
        <div class="login-links">
            <a href="#" onclick="showChangePwdModal()">修改密码</a>
            <a href="#" onclick="showForgotPwdModal()">忘记密码？</a>
        </div>
        <div class="back-to-front"><a href="index.html" class="btn-outline">← 返回前台</a></div>
    </div>
</div>

<div id="adminMain" style="display:none;">
    <div class="container">
        <div class="admin-header">
            <h1>⚙️ 库管理中心</h1>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <a href="index.html" class="btn-outline" style="font-size:0.72rem; padding:6px 14px;">← 返回前台</a>
                <button class="btn-outline" onclick="exportData()" style="font-size:0.72rem; padding:6px 14px;">📤 导出</button>
                <label class="btn-outline" style="cursor:pointer;font-size:0.72rem; padding:6px 14px;">📥 导入<input type="file" id="importFile" style="display:none" onchange="importData(this)"></label>
            </div>
        </div>
        <div class="panel-grid">
            <div class="module-sidebar">
                <h3><i class="fa-solid fa-cubes"></i> 模块管理</h3>
                <div class="module-list" id="moduleList"></div>
                <button class="btn btn-add-module" onclick="showAddModuleModal()">➕ 新增模块</button>
            </div>
            <div class="content-panel" id="contentPanel">
                <p style="color:#aaa; text-align:center; padding:40px;">← 请从左侧选择一个模块</p>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modalBox" onclick="event.stopPropagation()"><div id="modalContent"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function() {
    const DATA_KEY = 'ysqy_data_v3';
    const DEFAULT_PWD = 'ysqy798';
    const RESET_CODE = 'ysqy_reset';

    const DEFAULT_MODULES = [
        { id:'pyq', name:'朋友圈', type:'moments', categories:['数字冲击','对话还原','情绪唤醒','场景反差'] },
        { id:'witness', name:'客户见证', type:'testimonial', categories:['文昌','沙龙','成交','夫妻关系'] },
        { id:'course', name:'课程卖点', type:'course', categories:['核心价值','课程亮点','学员反馈'] }
    ];

    let raw = localStorage.getItem(DATA_KEY);
    let db;
    if (raw) { try { db = JSON.parse(raw); } catch(e) { db = null; } }
    if (!db || !db.modules || !Array.isArray(db.modules) || db.modules.length === 0 || !db.modules[0].id) {
        const oldContents = (db && db.contents) ? db.contents : [];
        db = {
            modules: JSON.parse(JSON.stringify(DEFAULT_MODULES)),
            contents: oldContents.length ? oldContents : [
                { id:1, moduleId:'pyq', angle:'数字冲击', text:'同样做室内设计，收入差距能有10倍 📊\n靠颜感做方案的，改稿改到怀疑人生\n靠五行色彩做方案的，签单当天就定', time:1715000000000 },
                { id:101, moduleId:'witness', category:'成交', title:'林女士 · 软装设计师', description:'学了五行色彩后签单提升40%', imageUrl:'', videoUrl:'', clientName:'林女士', date:'2024-05-15' },
                { id:201, moduleId:'course', category:'核心价值', title:'五行色彩诊断系统', description:'一套让设计师秒懂客户的底层工具', imageUrl:'', videoUrl:'', date:'2024-05-01' }
            ]
        };
        localStorage.setItem(DATA_KEY, JSON.stringify(db));
    } else if (!db.contents) { db.contents = []; save(); }

    function save() { localStorage.setItem(DATA_KEY, JSON.stringify(db)); }
    function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000); }
    function getPwd() { return localStorage.getItem('ysqy_admin_pwd') || DEFAULT_PWD; }

    // 登录
    window.login = function() {
        if (document.getElementById('pwdInput').value === getPwd()) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminMain').style.display = 'block';
            renderModuleSidebar();
        } else { document.getElementById('loginError').textContent = '密码错误'; setTimeout(()=>document.getElementById('loginError').textContent='',2500); }
    };

    // 密码修改/重置
    window.showChangePwdModal = function() {
        openModal('修改管理密码', `
            <div class="form-group"><label>当前密码</label><input type="password" id="oldPwdChg"></div>
            <div class="form-group"><label>新密码</label><input type="password" id="newPwd1"></div>
            <div class="form-group"><label>确认新密码</label><input type="password" id="newPwd2"></div>
            <div class="btn-group"><button class="btn-outline" onclick="closeModal()">取消</button><button class="btn" onclick="changePwd()">确认修改</button></div>
        `);
    };
    window.changePwd = function() {
        const o = document.getElementById('oldPwdChg').value, n1 = document.getElementById('newPwd1').value, n2 = document.getElementById('newPwd2').value;
        if (o !== getPwd()) return toast('当前密码错误');
        if (n1.length < 4) return toast('密码至少4位');
        if (n1 !== n2) return toast('两次输入不一致');
        localStorage.setItem('ysqy_admin_pwd', n1);
        closeModal(); toast('密码已修改');
    };
    window.showForgotPwdModal = function() {
        openModal('重置密码', `
            <p style="margin-bottom:12px;">请输入重置暗号</p>
            <input type="text" id="forgotCode" placeholder="重置暗号" style="width:100%;padding:10px;margin-bottom:16px;border:1px solid #ddd;border-radius:8px;">
            <div class="btn-group"><button class="btn-outline" onclick="closeModal()">取消</button><button class="btn" onclick="resetPwd()">重置密码</button></div>
        `);
    };
    window.resetPwd = function() {
        if (document.getElementById('forgotCode').value === RESET_CODE) {
            localStorage.removeItem('ysqy_admin_pwd'); closeModal(); toast('密码已重置为默认');
        } else toast('暗号错误');
    };

    // 模块侧边栏
    window.currentModuleId = null;
    function renderModuleSidebar() {
        const list = document.getElementById('moduleList');
        list.innerHTML = db.modules.map(m => `
            <div class="module-item ${currentModuleId === m.id ? 'active' : ''}" onclick="selectModule('${m.id}')">
                <span>${m.name || '(未命名)'}</span>
                <div class="actions" onclick="event.stopPropagation()">
                    <i class="fa-solid fa-pen" onclick="editModuleName('${m.id}')"></i>
                    <i class="fa-solid fa-trash" onclick="deleteModule('${m.id}')"></i>
                </div>
            </div>
        `).join('');
        if (currentModuleId) renderContentPanel();
    }
    window.selectModule = function(id) { currentModuleId = id; renderModuleSidebar(); };

    // 内容面板渲染
    function renderContentPanel() {
        const mod = db.modules.find(m => m.id === currentModuleId);
        if (!mod) return;
        const panel = document.getElementById('contentPanel');
        const contents = db.contents.filter(c => c.moduleId === currentModuleId);
        let html = `<h3>📁 ${mod.name} <span style="font-size:0.7rem;color:var(--ink-light);">(${mod.type})</span></h3>`;

        // 分类管理
        html += `<div class="tag-list">${(mod.categories||[]).map(c => `<span class="tag-item">${c} <i class="edit-tag fa-solid fa-pen" onclick="editCategory('${currentModuleId}','${c}')"></i> <i class="fa-solid fa-xmark" onclick="deleteCategory('${currentModuleId}','${c}')"></i></span>`).join('')}</div>
        <div class="form-inline"><input type="text" id="newCatInput" placeholder="新分类"><button class="btn" onclick="addCategory('${currentModuleId}')">添加</button></div>`;

        // 发布表单
        if (mod.type === 'moments') {
            html += `<h4 style="margin-top:18px;">📝 发布文案</h4>
            <select id="pubAngle">${(mod.categories||[]).map(c=>`<option>${c}</option>`).join('')}</select>
            <textarea id="pubText" placeholder="文案内容，换行分段..."></textarea>
            <button class="btn" onclick="publishContent('${currentModuleId}')">发布</button>`;
        } else if (mod.type === 'testimonial') {
            html += `<h4 style="margin-top:18px;">🖼️ 新增见证</h4>
            <select id="pubCategory">${(mod.categories||[]).map(c=>`<option>${c}</option>`).join('')}</select>
            <input type="text" id="pubTitle" placeholder="标题">
            <input type="text" id="pubImage" placeholder="图片URL">
            <input type="text" id="pubVideo" placeholder="视频URL">
            <textarea id="pubDesc" placeholder="描述"></textarea>
            <input type="text" id="pubClient" placeholder="客户名称">
            <input type="text" id="pubDate" placeholder="日期(2024-05-15)">
            <button class="btn" onclick="publishContent('${currentModuleId}')">保存</button>`;
        } else if (mod.type === 'course') {
            html += `<h4 style="margin-top:18px;">📚 新增课程</h4>
            <select id="pubCategory">${(mod.categories||[]).map(c=>`<option>${c}</option>`).join('')}</select>
            <input type="text" id="pubTitle" placeholder="标题">
            <input type="text" id="pubImage" placeholder="图片URL">
            <input type="text" id="pubVideo" placeholder="视频URL">
            <textarea id="pubDesc" placeholder="描述"></textarea>
            <input type="text" id="pubDate" placeholder="日期">
            <button class="btn" onclick="publishContent('${currentModuleId}')">保存</button>`;
        }

        // 已发布内容卡片
        html += `<h4 style="margin-top:24px;">📋 已发布内容 <span style="font-size:0.7rem;">(${contents.length})</span></h4>`;
        if (contents.length === 0) {
            html += '<p style="color:#aaa;text-align:center;">暂无内容</p>';
        } else {
            html += `<div class="admin-card-grid">`;
            contents.forEach((c, idx) => {
                const globalIdx = db.contents.indexOf(c);
                const preview = c.text ? c.text.substring(0, 100) : (c.title || '');
                html += `<div class="admin-card">
                    <div class="preview-text">${preview}</div>
                    <div class="card-meta"><span>${c.angle||c.category||''}</span><span>${c.date||''}</span></div>
                    <div class="card-actions">
                        <i class="fa-solid fa-arrow-up" onclick="moveContent(${globalIdx}, -1)" title="上移"></i>
                        <i class="fa-solid fa-arrow-down" onclick="moveContent(${globalIdx}, 1)" title="下移"></i>
                        <i class="fa-solid fa-pen" onclick="editContent(${globalIdx})" title="编辑"></i>
                        <i class="fa-solid fa-trash" onclick="deleteContent(${globalIdx})" title="删除"></i>
                    </div>
                </div>`;
            });
            html += `</div><button class="btn-outline" onclick="batchDeleteContents()" style="margin-top:12px;">🗑️ 删除选中</button>`;
        }
        panel.innerHTML = html;
    }

    // 分类操作
    window.addCategory = function(moduleId) {
        const input = document.getElementById('newCatInput');
        const val = input.value.trim();
        if (!val) return;
        const mod = db.modules.find(m => m.id === moduleId);
        if (!mod.categories) mod.categories = [];
        if (mod.categories.includes(val)) return toast('已存在');
        mod.categories.push(val);
        save(); renderContentPanel();
    };
    window.editCategory = function(moduleId, oldVal) {
        const newVal = prompt('修改分类', oldVal);
        if (newVal && newVal !== oldVal) {
            const mod = db.modules.find(m => m.id === moduleId);
            const idx = (mod.categories||[]).indexOf(oldVal);
            if (idx > -1) { mod.categories[idx] = newVal; save(); renderContentPanel(); }
        }
    };
    window.deleteCategory = function(moduleId, val) {
        if (!confirm('确定删除分类“'+val+'”?')) return;
        const mod = db.modules.find(m => m.id === moduleId);
        mod.categories = (mod.categories||[]).filter(c => c !== val);
        save(); renderContentPanel();
    };

    // 发布内容
    window.publishContent = function(moduleId) {
        const mod = db.modules.find(m => m.id === moduleId);
        if (!mod) return;
        const newItem = { id: Date.now(), moduleId };
        if (mod.type === 'moments') {
            newItem.angle = document.getElementById('pubAngle').value;
            newItem.text = document.getElementById('pubText').value.trim();
            if (!newItem.text) return toast('内容不能为空');
            newItem.time = Date.now();
        } else {
            newItem.category = document.getElementById('pubCategory').value;
            newItem.title = document.getElementById('pubTitle').value.trim();
            newItem.description = document.getElementById('pubDesc').value.trim();
            if (!newItem.title || !newItem.description) return toast('标题和描述必填');
            newItem.imageUrl = document.getElementById('pubImage').value.trim();
            newItem.videoUrl = document.getElementById('pubVideo').value.trim();
            if (mod.type === 'testimonial') newItem.clientName = document.getElementById('pubClient').value.trim();
            newItem.date = document.getElementById('pubDate').value.trim();
        }
        db.contents.unshift(newItem);
        save(); renderContentPanel(); toast('发布成功');
    };

    // 编辑内容
    window.editContent = function(idx) {
        const content = db.contents[idx];
        const mod = db.modules.find(m => m.id === content.moduleId);
        if (!mod) return;
        let formHtml = '';
        if (mod.type === 'moments') {
            formHtml = `
                <div class="form-group"><label>角度</label><select id="editAngle">${(mod.categories||[]).map(c=>`<option ${c===content.angle?'selected':''}>${c}</option>`).join('')}</select></div>
                <div class="form-group"><label>文案</label><textarea id="editText">${(content.text||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea></div>
            `;
        } else {
            formHtml = `
                <div class="form-group"><label>分类</label><select id="editCategory">${(mod.categories||[]).map(c=>`<option ${c===content.category?'selected':''}>${c}</option>`).join('')}</select></div>
                <div class="form-group"><label>标题</label><input type="text" id="editTitle" value="${(content.title||'').replace(/"/g,'&quot;')}"></div>
                <div class="form-group"><label>图片URL</label><input type="text" id="editImage" value="${content.imageUrl||''}"></div>
                <div class="form-group"><label>视频URL</label><input type="text" id="editVideo" value="${content.videoUrl||''}"></div>
                <div class="form-group"><label>描述</label><textarea id="editDesc">${(content.description||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea></div>
            `;
            if (mod.type === 'testimonial') formHtml += `<div class="form-group"><label>客户名称</label><input type="text" id="editClient" value="${content.clientName||''}"></div>`;
            formHtml += `<div class="form-group"><label>日期</label><input type="text" id="editDate" value="${content.date||''}"></div>`;
        }
        openModal('编辑内容', formHtml + `<input type="hidden" id="editIdx" value="${idx}"><div class="btn-group"><button class="btn-outline" onclick="closeModal()">取消</button><button class="btn" onclick="saveEditContent()">保存</button></div>`);
    };
    window.saveEditContent = function() {
        const idx = parseInt(document.getElementById('editIdx').value);
        const content = db.contents[idx];
        const mod = db.modules.find(m => m.id === content.moduleId);
        if (mod.type === 'moments') {
            content.angle = document.getElementById('editAngle').value;
            content.text = document.getElementById('editText').value.trim();
        } else {
            content.category = document.getElementById('editCategory').value;
            content.title = document.getElementById('editTitle').value.trim();
            content.description = document.getElementById('editDesc').value.trim();
            content.imageUrl = document.getElementById('editImage').value.trim();
            content.videoUrl = document.getElementById('editVideo').value.trim();
            content.date = document.getElementById('editDate').value.trim();
            if (mod.type === 'testimonial') content.clientName = document.getElementById('editClient').value.trim();
        }
        save(); closeModal(); renderContentPanel(); toast('已更新');
    };

    window.moveContent = function(idx, dir) {
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= db.contents.length) return;
        [db.contents[idx], db.contents[newIdx]] = [db.contents[newIdx], db.contents[idx]];
        save(); renderContentPanel();
    };
    window.deleteContent = function(idx) {
        if (!confirm('确认删除？')) return;
        db.contents.splice(idx, 1);
        save(); renderContentPanel();
    };
    window.batchDeleteContents = function() {
        const checks = document.querySelectorAll('.admin-card input[type="checkbox"]:checked');
        if (checks.length === 0) return toast('请至少选择一项');
        if (!confirm(`删除选中的 ${checks.length} 条？`)) return;
        const indices = [...checks].map(c => parseInt(c.dataset.idx)).sort((a,b)=>b-a);
        indices.forEach(i => db.contents.splice(i,1));
        save(); renderContentPanel();
    };

    // 模块管理
    window.showAddModuleModal = function() {
        openModal('新增模块', `
            <div class="form-group"><label>模块名称</label><input type="text" id="newModName" placeholder="如：活动集锦"></div>
            <div class="form-group"><label>类型</label><select id="newModType"><option value="moments">朋友圈文案</option><option value="testimonial">客户见证</option><option value="course">课程卖点</option></select></div>
            <div class="btn-group"><button class="btn-outline" onclick="closeModal()">取消</button><button class="btn" onclick="addNewModule()">添加</button></div>
        `);
    };
    window.addNewModule = function() {
        const name = document.getElementById('newModName').value.trim(), type = document.getElementById('newModType').value;
        if (!name) return;
        const id = 'mod_' + Date.now();
        db.modules.push({ id, name, type, categories: [] });
        save(); closeModal(); renderModuleSidebar(); toast('模块已添加');
        currentModuleId = id; renderModuleSidebar();
    };
    window.editModuleName = function(id) {
        const mod = db.modules.find(m => m.id === id);
        const newName = prompt('模块名称', mod.name);
        if (newName && newName.trim()) { mod.name = newName.trim(); save(); renderModuleSidebar(); if (currentModuleId === id) renderContentPanel(); }
    };
    window.deleteModule = function(id) {
        if (!confirm('删除此模块将同时删除其所有内容，确定？')) return;
        db.modules = db.modules.filter(m => m.id !== id);
        db.contents = db.contents.filter(c => c.moduleId !== id);
        if (currentModuleId === id) {
            currentModuleId = null;
            document.getElementById('contentPanel').innerHTML = '<p style="color:#aaa;text-align:center;padding:40px;">← 请选择模块</p>';
        }
        save(); renderModuleSidebar();
    };

    // 导入导出
    window.exportData = function() {
        const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'ysqy_backup_'+new Date().toISOString().slice(0,10)+'.json';
        a.click(); toast('已导出');
    };
    window.importData = function(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.modules && data.contents) {
                    if (confirm('导入将覆盖当前数据，继续？')) {
                        db = data; save(); currentModuleId = null; renderModuleSidebar();
                        document.getElementById('contentPanel').innerHTML = '<p style="color:#aaa;text-align:center;padding:40px;">← 请选择模块</p>';
                        toast('导入成功');
                    }
                } else toast('格式不正确');
            } catch (err) { toast('解析失败'); }
        };
        reader.readAsText(file); input.value = '';
    };

    // 模态框
    function openModal(title, html) {
        document.getElementById('modalContent').innerHTML = `<h3>${title}</h3>` + html;
        document.getElementById('modalOverlay').classList.add('open');
    }
    window.closeModal = function(e) {
        if (e && e.target !== document.getElementById('modalOverlay')) return;
        document.getElementById('modalOverlay').classList.remove('open');
    };
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('open')) closeModal();
    });
})();
</script>
</body>
</html>
