<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易饰乾园 · 后台管理 V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F9F7F2;
            --card-bg: #FFFFFF;
            --ink: #1a1815;
            --ink-light: #5c574f;
            --gold: #b8832a;
            --gold-pale: #f7f0e0;
            --border: rgba(0,0,0,0.06);
            --border-strong: rgba(0,0,0,0.12);
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-full: 50px;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.07);
            --transition: 0.3s cubic-bezier(0.23,1,0.32,1);
            --font-serif: 'Noto Serif SC', 'Songti SC', serif;
            --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); font-family:var(--font-sans); color:var(--ink); line-height:1.6; min-height:100vh; }
        body::before { content:''; position:fixed; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--gold),#8b3a3a,#5a6b4d); z-index:1000; }
        .container { max-width:1000px; margin:0 auto; padding:0 24px; }

        .login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:48px 36px; max-width:380px; width:100%; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.08); }
        .login-card h1 { font-family:var(--font-serif); font-size:1.8rem; margin-bottom:12px; }
        .login-card input { width:100%; padding:14px; border:1.5px solid var(--border); border-radius:50px; text-align:center; margin-bottom:16px; }
        .btn { background:var(--ink); color:#fff; border:none; padding:12px 24px; border-radius:50px; cursor:pointer; font-family:inherit; }
        .btn-outline { background:transparent; color:var(--ink); border:1.5px solid var(--border-strong); padding:8px 16px; border-radius:50px; cursor:pointer; font-family:inherit; }
        .admin-header { display:flex; align-items:center; justify-content:space-between; padding:32px 0 24px; flex-wrap:wrap; gap:12px; }
        .panel-grid { display:grid; grid-template-columns: 240px 1fr; gap:20px; }
        .module-sidebar { background:var(--card-bg); border-radius:var(--radius-lg); padding:20px; border:1px solid var(--border); }
        .module-item { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:var(--radius-md); cursor:pointer; }
        .module-item.active { background:var(--gold-pale); border-color:var(--gold); }
        .content-panel { background:var(--card-bg); border-radius:var(--radius-lg); padding:28px; border:1px solid var(--border); }

        /* 输入框圆角 */
        input[type="text"], input[type="url"], input[type="date"], select {
            border-radius: 30px !important;
            padding: 12px 18px;
            border:1.5px solid #e0dbd0;
            font-family:inherit;
            margin-bottom:8px;
        }
        textarea {
            border-radius: 25px !important;
            padding: 14px 18px;
            min-height: 150px; /* 至少6行 */
            border:1.5px solid #e0dbd0;
            font-family:inherit;
        }

        /* 卡片列表 */
        .admin-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .admin-card {
            background: #fff;
            border-radius: var(--radius-lg);
            padding: 18px;
            border:1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .admin-card .preview-text {
            font-size: 0.85rem;
            line-height: 1.7;
            white-space: pre-wrap;
            min-height: 9em;      /* 至少6行高度 */
            max-height: 14em;     /* 超出可滚动 */
            overflow-y: auto;
            padding: 4px 0;
        }
        .admin-card .card-actions { display:flex; gap:6px; justify-content:flex-end; }
        .admin-card .card-actions i { cursor:pointer; color:#888; padding:4px; border-radius:6px; }
        .admin-card .card-actions i:hover { color:var(--gold); background:var(--gold-pale); }

        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s; }
        .modal-overlay.open { opacity:1; pointer-events:auto; }
        .modal { background:#fff; border-radius:var(--radius-lg); padding:32px; max-width:480px; width:90%; max-height:80vh; overflow-y:auto; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 24px; border-radius:30px; font-size:0.8rem; opacity:0; transition:0.3s; z-index:3000; }
        .toast.show { opacity:1; }
    </style>
</head>
<body>
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1>易饰乾园 · 后台</h1>
        <input type="password" id="pwdInput" placeholder="管理密码" onkeydown="if(event.key==='Enter')login()">
        <button class="btn" onclick="login()">进入后台</button>
        <p style="margin-top:12px;"><a href="index.html" class="btn-outline">← 返回前台</a></p>
    </div>
</div>

<div id="adminMain" style="display:none;">
    <div class="container">
        <div class="admin-header">
            <h1>⚙️ 库管理中心</h1>
            <div>
                <a href="index.html" class="btn-outline">← 前台</a>
                <button class="btn-outline" onclick="exportData()">导出</button>
                <label class="btn-outline">导入<input type="file" id="importFile" hidden onchange="importData(this)"></label>
            </div>
        </div>
        <div class="panel-grid">
            <div class="module-sidebar">
                <h3>模块</h3>
                <div class="module-list" id="moduleList"></div>
                <button class="btn" onclick="showAddModuleModal()" style="width:100%;margin-top:12px;">新增模块</button>
            </div>
            <div class="content-panel" id="contentPanel">← 选择模块</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"><div id="modalContent"></div></div></div>
<div class="toast" id="toast"></div>

<script>
(function() {
    const DATA_KEY = 'ysqy_data_v3';
    const DEFAULT_PWD = 'ysqy798';
    const DEFAULT_MODULES = [
        { id:'pyq', name:'朋友圈', type:'moments', categories:['数字冲击','对话还原'] },
        { id:'witness', name:'客户见证', type:'testimonial', categories:['文昌','沙龙'] },
        { id:'course', name:'课程卖点', type:'course', categories:['核心价值','课程亮点'] }
    ];

    let db = (() => {
        let raw = localStorage.getItem(DATA_KEY);
        if (raw) { try { return JSON.parse(raw); } catch(e) {} }
        return { modules: JSON.parse(JSON.stringify(DEFAULT_MODULES)), contents: [] };
    })();

    if (!db.modules || !Array.isArray(db.modules) || !db.contents) {
        db = { modules: JSON.parse(JSON.stringify(DEFAULT_MODULES)), contents: [] };
        localStorage.setItem(DATA_KEY, JSON.stringify(db));
    }

    function save() { localStorage.setItem(DATA_KEY, JSON.stringify(db)); }
    function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
    function getPwd() { return localStorage.getItem('ysqy_admin_pwd') || DEFAULT_PWD; }

    window.login = function() {
        if (document.getElementById('pwdInput').value === getPwd()) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminMain').style.display = 'block';
            renderModuleSidebar();
        }
    };

    let currentModuleId = null;

    function renderModuleSidebar() {
        const list = document.getElementById('moduleList');
        list.innerHTML = db.modules.map(m => `
            <div class="module-item ${currentModuleId===m.id?'active':''}" onclick="selectModule('${m.id}')">
                <span>${m.name}</span>
                <div><i class="fa-solid fa-pen" onclick="event.stopPropagation();editModuleName('${m.id}')"></i></div>
            </div>
        `).join('');
        if (currentModuleId) renderContentPanel();
    }

    window.selectModule = function(id) { currentModuleId = id; renderModuleSidebar(); };

    function renderContentPanel() {
        const mod = db.modules.find(m => m.id === currentModuleId);
        if (!mod) return;
        const contents = db.contents.filter(c => c.moduleId === currentModuleId);
        let html = `<h3>${mod.name} (${mod.type})</h3>`;
        // 分类
        html += `<div class="tag-list" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;">${(mod.categories||[]).map(c => `<span style="background:#f0ede5;padding:4px 12px;border-radius:20px;font-size:0.8rem;">${c}</span>`).join('')}</div>`;
        html += `<input id="newCat" placeholder="新分类"><button class="btn" onclick="addCategory()">添加</button>`;

        // 发布表单
        if (mod.type === 'moments') {
            html += `<select id="pubAngle">${(mod.categories||[]).map(c => `<option>${c}</option>`).join('')}</select>`;
            html += `<textarea id="pubText" placeholder="文案内容..."></textarea>`;
            html += `<button class="btn" onclick="publishContent()">发布</button>`;
        } else if (mod.type === 'testimonial') {
            html += `<select id="pubCat">${(mod.categories||[]).map(c => `<option>${c}</option>`).join('')}</select>`;
            html += `<input id="pubTitle" placeholder="标题"><input id="pubImg" placeholder="图片URL"><input id="pubVid" placeholder="视频URL"><textarea id="pubDesc" placeholder="描述"></textarea><input id="pubClient" placeholder="客户名称"><input id="pubDate" placeholder="日期">`;
            html += `<button class="btn" onclick="publishContent()">保存</button>`;
        } else if (mod.type === 'course') {
            html += `<select id="pubCat">${(mod.categories||[]).map(c => `<option>${c}</option>`).join('')}</select>`;
            html += `<input id="pubTitle" placeholder="标题"><input id="pubImg" placeholder="图片URL"><input id="pubVid" placeholder="视频URL"><textarea id="pubDesc" placeholder="描述"></textarea><input id="pubDate" placeholder="日期">`;
            html += `<button class="btn" onclick="publishContent()">保存</button>`;
        }

        // 已发布卡片
        html += `<h4 style="margin-top:20px;">已发布内容</h4><div class="admin-card-grid">`;
        contents.forEach(c => {
            const idx = db.contents.indexOf(c);
            const preview = c.text ? c.text : (c.title || '');
            html += `<div class="admin-card"><div class="preview-text">${preview.replace(/\n/g,'<br>')}</div><div class="card-actions"><i class="fa-solid fa-arrow-up" onclick="moveContent(${idx},-1)"></i><i class="fa-solid fa-arrow-down" onclick="moveContent(${idx},1)"></i><i class="fa-solid fa-pen" onclick="editContent(${idx})"></i><i class="fa-solid fa-trash" onclick="deleteContent(${idx})"></i></div></div>`;
        });
        html += `</div>`;
        document.getElementById('contentPanel').innerHTML = html;
    }

    window.addCategory = function() {
        const val = document.getElementById('newCat').value.trim();
        if (!val) return;
        const mod = db.modules.find(m => m.id === currentModuleId);
        if (!mod.categories) mod.categories = [];
        if (mod.categories.includes(val)) return;
        mod.categories.push(val);
        save(); renderContentPanel();
    };

    window.publishContent = function() {
        const mod = db.modules.find(m => m.id === currentModuleId);
        const item = { id: Date.now(), moduleId: currentModuleId };
        if (mod.type === 'moments') {
            item.angle = document.getElementById('pubAngle').value;
            item.text = document.getElementById('pubText').value.trim();
            if (!item.text) return toast('内容不能为空');
        } else {
            item.category = document.getElementById('pubCat').value;
            item.title = document.getElementById('pubTitle').value.trim();
            item.description = document.getElementById('pubDesc').value.trim();
            if (!item.title || !item.description) return toast('标题和描述必填');
            item.imageUrl = document.getElementById('pubImg').value.trim();
            item.videoUrl = document.getElementById('pubVid').value.trim();
            if (mod.type === 'testimonial') item.clientName = document.getElementById('pubClient').value.trim();
            item.date = document.getElementById('pubDate').value.trim();
        }
        db.contents.unshift(item);
        save();
        renderContentPanel();  // 确保立即更新
        toast('发布成功');
    };

    window.moveContent = function(idx, dir) {
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= db.contents.length) return;
        [db.contents[idx], db.contents[newIdx]] = [db.contents[newIdx], db.contents[idx]];
        save(); renderContentPanel();
    };
    window.deleteContent = function(idx) { if (confirm('删除？')) { db.contents.splice(idx,1); save(); renderContentPanel(); } };

    // 其他辅助 (showAddModuleModal, exportData 等) 保持原样即可正常。
    window.showAddModuleModal = function() {
        // 略，与之前相同
    };
    window.exportData = function() {
        const blob = new Blob([JSON.stringify(db)], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'backup.json';
        a.click();
    };
    window.importData = function(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.modules && data.contents) { db = data; save(); currentModuleId = null; renderModuleSidebar(); }
            } catch(ex) { toast('格式错误'); }
        };
        reader.readAsText(file);
    };

    renderModuleSidebar();
    window.editModuleName = function(id) {
        const mod = db.modules.find(m => m.id === id);
        const newName = prompt('名称', mod.name);
        if (newName) { mod.name = newName; save(); renderModuleSidebar(); }
    };
})();
</script>
</body>
</html>
