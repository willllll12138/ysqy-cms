<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园 · 后台管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --ink: #0e0b08;
  --gold: #b8832a;
  --gold2: #d4a84b;
  --goldl: #f2dfa0;
  --cream: #f9f4ec;
  --warm: #ede3ce;
  --mist: #ddd4c0;
  --char: #2a2318;
  --rust: #7a3520;
  --sage: #4a6040;
  --steel: #3a4a5a;
  --rose: #7a3040;
  --danger: #c0392b;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--cream);
  font-family:'Noto Sans SC',sans-serif;
  color:var(--ink);min-height:100vh;
}

/* ── LOGIN SCREEN ── */
#loginScreen{
  min-height:100vh;display:flex;
  align-items:center;justify-content:center;
  background:var(--ink);
  position:relative;overflow:hidden;
}
#loginScreen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 50%,rgba(184,131,42,.15),transparent 55%),
              radial-gradient(ellipse at 80% 20%,rgba(184,131,42,.08),transparent 50%);
}
.login-box{
  position:relative;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(184,131,42,.25);
  padding:48px 44px;
  width:100%;max-width:380px;
  text-align:center;
}
.login-logo{
  font-family:'Noto Serif SC',serif;
  font-size:1.3rem;font-weight:900;
  color:#fff;letter-spacing:.12em;margin-bottom:6px;
}
.login-logo em{color:var(--gold2);font-style:normal;}
.login-sub{
  font-size:.62rem;letter-spacing:.25em;
  color:rgba(255,255,255,.3);margin-bottom:36px;
}
.login-label{
  font-size:.62rem;letter-spacing:.2em;
  color:rgba(255,255,255,.45);
  display:block;text-align:left;margin-bottom:8px;
}
.login-input{
  width:100%;padding:11px 16px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(184,131,42,.25);
  color:#fff;font-size:.85rem;
  font-family:inherit;outline:none;
  transition:border-color .2s;letter-spacing:.05em;
  margin-bottom:20px;
}
.login-input:focus{border-color:var(--gold);}
.login-input::placeholder{color:rgba(255,255,255,.2);}
.login-btn{
  width:100%;padding:12px;
  background:var(--gold);color:var(--ink);
  border:none;font-size:.78rem;letter-spacing:.2em;
  font-weight:500;cursor:pointer;font-family:inherit;
  transition:background .2s;
}
.login-btn:hover{background:var(--gold2);}
.login-error{
  margin-top:14px;font-size:.7rem;
  color:#e08080;letter-spacing:.1em;min-height:20px;
}
.login-separator{
  margin:28px 0 20px;
  border:none;border-top:1px solid rgba(184,131,42,.15);
}
.login-change-pwd{
  font-size:.62rem;color:rgba(255,255,255,.3);
  letter-spacing:.12em;cursor:pointer;
  background:none;border:none;font-family:inherit;
  transition:color .2s;
}
.login-change-pwd:hover{color:var(--gold);}

/* ── ADMIN LAYOUT ── */
#adminScreen{display:none;}

.admin-header{
  background:var(--ink);padding:0 28px;
  display:flex;align-items:center;justify-content:space-between;
  height:56px;position:sticky;top:0;z-index:200;
  border-bottom:1px solid rgba(184,131,42,.2);
}
.admin-logo{
  font-family:'Noto Serif SC',serif;
  font-size:.95rem;font-weight:700;
  color:#fff;letter-spacing:.1em;
}
.admin-logo em{color:var(--gold2);font-style:normal;}
.header-actions{display:flex;gap:10px;align-items:center;}
.hbtn{
  padding:6px 14px;font-size:.62rem;letter-spacing:.12em;
  cursor:pointer;font-family:inherit;transition:all .18s;
  white-space:nowrap;
}
.hbtn-outline{
  border:1px solid rgba(184,131,42,.35);
  background:none;color:rgba(255,255,255,.5);
}
.hbtn-outline:hover{border-color:var(--gold);color:var(--gold);}
.hbtn-gold{
  background:var(--gold);border:none;
  color:var(--ink);font-weight:500;
}
.hbtn-gold:hover{background:var(--gold2);}
.hbtn-danger{
  border:1px solid rgba(192,57,43,.4);
  background:none;color:rgba(192,57,43,.6);
}
.hbtn-danger:hover{border-color:var(--danger);color:var(--danger);}

/* STATUS BAR */
.status-bar{
  background:var(--char);padding:8px 28px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:8px;
}
.status-text{font-size:.65rem;color:rgba(255,255,255,.4);letter-spacing:.12em;}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  display:inline-block;margin-right:6px;
}
.dot-green{background:#4a9a4a;}
.dot-yellow{background:#c4a030;}
.dot-red{background:var(--danger);}

/* MAIN AREA */
.admin-main{
  max-width:1200px;margin:0 auto;
  padding:28px 24px 80px;
}

/* SECTION TITLE */
.sec-title{
  font-family:'Noto Serif SC',serif;
  font-size:.9rem;font-weight:700;
  letter-spacing:.08em;margin-bottom:16px;
  padding-bottom:12px;
  border-bottom:1px solid var(--mist);
  display:flex;align-items:center;justify-content:space-between;
}
.sec-badge{
  font-size:.6rem;letter-spacing:.15em;
  color:var(--gold);background:#fdf7ec;
  padding:3px 10px;font-weight:400;
  font-family:'Noto Sans SC',sans-serif;
}

/* ADD FORM */
.add-card{
  background:white;border:1px solid var(--mist);
  padding:24px;margin-bottom:32px;
  position:relative;overflow:hidden;
}
.add-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--goldl));
}
.form-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:14px;margin-bottom:14px;
}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-label{font-size:.62rem;letter-spacing:.18em;color:#888;}
.form-input,.form-select,.form-textarea{
  padding:9px 12px;border:1px solid var(--mist);
  background:var(--cream);font-size:.82rem;
  font-family:inherit;color:var(--ink);
  outline:none;transition:border-color .2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  border-color:var(--gold);background:white;
}
.form-textarea{
  width:100%;min-height:140px;resize:vertical;
  line-height:1.9;letter-spacing:.02em;
}
.form-hint{font-size:.58rem;color:#bbb;letter-spacing:.08em;margin-top:4px;}
.btn-add{
  padding:10px 28px;background:var(--ink);
  color:var(--gold2);border:none;
  font-size:.7rem;letter-spacing:.18em;
  cursor:pointer;font-family:inherit;
  transition:background .2s;
}
.btn-add:hover{background:var(--char);}
.btn-add:disabled{opacity:.5;cursor:not-allowed;}

/* POST LIST */
.post-list{display:flex;flex-direction:column;gap:12px;}

.post-item{
  background:white;border:1px solid var(--mist);
  position:relative;overflow:hidden;
  transition:box-shadow .2s;
}
.post-item:hover{box-shadow:0 4px 16px rgba(0,0,0,.07);}

.post-stripe{height:2px;}
.s-gold .post-stripe{background:linear-gradient(90deg,var(--gold),var(--goldl));}
.s-rust .post-stripe{background:linear-gradient(90deg,var(--rust),#c06040);}
.s-sage .post-stripe{background:linear-gradient(90deg,var(--sage),#7a9a70);}
.s-steel .post-stripe{background:linear-gradient(90deg,var(--steel),#6a8aaa);}
.s-rose .post-stripe{background:linear-gradient(90deg,var(--rose),#b06080);}
.s-char .post-stripe{background:linear-gradient(90deg,var(--char),#6a6050);}

.post-head{
  padding:14px 18px 10px;
  display:flex;align-items:center;
  justify-content:space-between;gap:12px;
}
.post-meta{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.post-no{
  font-family:'Noto Serif SC',serif;
  font-size:.75rem;font-weight:700;color:var(--mist);
  flex-shrink:0;
}
.post-angle-badge{
  font-size:.58rem;letter-spacing:.15em;padding:2px 8px;
  flex-shrink:0;
}
.s-gold .post-angle-badge{color:var(--gold);background:#fdf7ec;}
.s-rust .post-angle-badge{color:var(--rust);background:#fdf0ec;}
.s-sage .post-angle-badge{color:var(--sage);background:#eff5ef;}
.s-steel .post-angle-badge{color:var(--steel);background:#eff3f7;}
.s-rose .post-angle-badge{color:var(--rose);background:#fdeef2;}
.s-char .post-angle-badge{color:var(--char);background:#f2f0ec;}

.post-struct-text{
  font-size:.58rem;color:#bbb;
  letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.post-actions{display:flex;gap:6px;flex-shrink:0;}
.pbtn{
  font-size:.6rem;letter-spacing:.1em;
  padding:4px 10px;cursor:pointer;
  font-family:inherit;transition:all .18s;border:1px solid var(--mist);
  background:none;color:#aaa;
}
.pbtn:hover{border-color:var(--gold);color:var(--gold);}
.pbtn-del:hover{border-color:var(--danger);color:var(--danger);}
.pbtn-up,.pbtn-dn{padding:4px 8px;}

.post-body{
  padding:0 18px 14px;
  font-size:.83rem;line-height:2;
  color:var(--char);font-weight:300;
  letter-spacing:.02em;
  border-top:1px solid #f5f0e8;
  margin-top:4px;padding-top:12px;
}

/* EDIT INLINE */
.post-edit-area{
  padding:14px 18px;
  border-top:1px solid #f0ebe0;
  background:#fdf9f3;
  display:none;
}
.post-edit-area.open{display:block;}
.edit-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:10px;margin-bottom:10px;
}
.edit-textarea{
  width:100%;min-height:120px;resize:vertical;
  padding:9px 12px;border:1px solid var(--mist);
  background:white;font-size:.82rem;
  font-family:inherit;color:var(--ink);
  outline:none;transition:border-color .2s;
  line-height:1.9;margin-bottom:10px;
}
.edit-textarea:focus{border-color:var(--gold);}
.edit-actions{display:flex;gap:8px;}
.btn-save{
  padding:7px 20px;background:var(--ink);
  color:var(--gold2);border:none;font-size:.65rem;
  letter-spacing:.15em;cursor:pointer;font-family:inherit;
}
.btn-cancel-edit{
  padding:7px 16px;border:1px solid var(--mist);
  background:none;color:#aaa;font-size:.65rem;
  letter-spacing:.12em;cursor:pointer;font-family:inherit;
}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:500;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal{
  background:white;padding:36px;width:100%;max-width:420px;
  position:relative;
  transform:translateY(16px);transition:transform .22s;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-title{
  font-family:'Noto Serif SC',serif;
  font-size:1rem;font-weight:700;margin-bottom:20px;
  letter-spacing:.06em;
}
.modal-label{
  font-size:.62rem;letter-spacing:.18em;color:#888;
  display:block;margin-bottom:6px;
}
.modal-input{
  width:100%;padding:10px 14px;border:1px solid var(--mist);
  background:var(--cream);font-size:.85rem;
  font-family:inherit;color:var(--ink);outline:none;
  transition:border-color .2s;margin-bottom:14px;
}
.modal-input:focus{border-color:var(--gold);}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.mbtn-primary{
  flex:1;padding:10px;background:var(--ink);color:var(--gold2);
  border:none;font-size:.7rem;letter-spacing:.15em;
  cursor:pointer;font-family:inherit;
}
.mbtn-secondary{
  padding:10px 18px;border:1px solid var(--mist);
  background:none;color:#888;font-size:.7rem;
  letter-spacing:.12em;cursor:pointer;font-family:inherit;
}
.modal-error{font-size:.68rem;color:var(--danger);letter-spacing:.1em;min-height:18px;}

/* SEARCH FILTER */
.filter-bar{
  display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;
}
.filter-input{
  flex:1;min-width:200px;padding:8px 14px;
  border:1px solid var(--mist);background:white;
  font-size:.78rem;font-family:inherit;color:var(--ink);
  outline:none;transition:border-color .2s;
}
.filter-input:focus{border-color:var(--gold);}
.filter-select{
  padding:8px 12px;border:1px solid var(--mist);background:white;
  font-size:.75rem;font-family:inherit;color:var(--ink);
  outline:none;cursor:pointer;
}

/* TOAST */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:#fff;
  padding:9px 22px;font-size:.7rem;letter-spacing:.1em;
  opacity:0;transition:all .22s;pointer-events:none;z-index:999;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* SAVING INDICATOR */
.saving-badge{
  font-size:.6rem;letter-spacing:.15em;
  color:rgba(255,255,255,.4);
  animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}

@media(max-width:680px){
  .form-grid,.edit-grid{grid-template-columns:1fr;}
  .admin-main{padding:20px 14px 60px;}
  .admin-header{padding:0 14px;}
}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">易饰乾园 · <em>后台</em></div>
    <div class="login-sub">ADMIN PANEL · 文案管理系统</div>
    <label class="login-label">管理员密码</label>
    <input class="login-input" type="password" id="pwdInput"
      placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">进入后台</button>
    <div class="login-error" id="loginError"></div>
    <hr class="login-separator"/>
    <button class="login-change-pwd" onclick="showChangePwdModal()">🔑 忘记密码 / 修改密码</button>
  </div>
</div>

<!-- ── ADMIN ── -->
<div id="adminScreen">

  <div class="admin-header">
    <div class="admin-logo">易饰乾园 · <em>文案后台</em></div>
    <div class="header-actions">
      <span class="saving-badge" id="savingBadge" style="display:none">⟳ 同步中…</span>
      <button class="hbtn hbtn-outline" onclick="window.open('index.html','_blank')">↗ 查看前台</button>
      <button class="hbtn hbtn-outline" onclick="showChangePwdModal()">🔑 修改密码</button>
      <button class="hbtn hbtn-gold" onclick="saveAll()">☁ 保存全部</button>
      <button class="hbtn hbtn-danger" onclick="doLogout()">退出</button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-text">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">就绪</span>
    </div>
    <div class="status-text">共 <strong id="countText">0</strong> 条文案</div>
  </div>

  <div class="admin-main">

    <!-- ADD -->
    <div class="sec-title">
      新增文案
      <span class="sec-badge">ADD NEW</span>
    </div>
    <div class="add-card">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">编号 NO.</label>
          <input class="form-input" id="fNo" placeholder="如 31"/>
        </div>
        <div class="form-group">
          <label class="form-label">角度分类</label>
          <select class="form-select" id="fAngle">
            <option value="数字冲击">📊 数字冲击</option>
            <option value="旁观者视角">👁 旁观者视角</option>
            <option value="预言式">🔮 预言式</option>
            <option value="对话还原">💬 对话还原</option>
            <option value="时间轴">⏳ 时间轴</option>
            <option value="选择题">🎯 选择题</option>
            <option value="内幕揭秘">🔓 内幕揭秘</option>
            <option value="反常识">⚡ 反常识</option>
            <option value="学员故事">📖 学员故事</option>
            <option value="身体感知">🫀 身体感知</option>
            <option value="追问式">❓ 追问式</option>
            <option value="画面描写">🎬 画面描写</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">卡片颜色</label>
          <select class="form-select" id="fScheme">
            <option value="s-gold">金色 (金/黄)</option>
            <option value="s-rust">锈红</option>
            <option value="s-sage">松绿</option>
            <option value="s-steel">钢蓝</option>
            <option value="s-rose">玫红</option>
            <option value="s-char">炭灰</option>
          </select>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <label class="form-label">结构说明（选填）</label>
        <input class="form-input" id="fStruct" placeholder="如：数据开场→场景反差→结论落地"/>
      </div>
      <div class="form-group">
        <label class="form-label">文案内容（每行用回车换行）</label>
        <textarea class="form-textarea" id="fText"
          placeholder="第一行文案&#10;第二行文案&#10;第三行文案&#10;…"></textarea>
        <div class="form-hint">每行对应发圈一句，建议 6 行，每行不超过 20 字</div>
      </div>
      <button class="btn-add" id="addBtn" onclick="addPost()">＋ 添加文案</button>
    </div>

    <!-- LIST -->
    <div class="sec-title" style="margin-top:8px;">
      文案列表
      <div style="display:flex;gap:10px;align-items:center;">
        <span class="sec-badge" id="listBadge">共 0 条</span>
      </div>
    </div>

    <div class="filter-bar">
      <input class="filter-input" placeholder="搜索文案内容或角度…" oninput="filterList(this.value)"/>
      <select class="filter-select" onchange="filterAngle(this.value)">
        <option value="">全部角度</option>
        <option value="数字冲击">数字冲击</option>
        <option value="旁观者视角">旁观者视角</option>
        <option value="预言式">预言式</option>
        <option value="对话还原">对话还原</option>
        <option value="时间轴">时间轴</option>
        <option value="选择题">选择题</option>
        <option value="内幕揭秘">内幕揭秘</option>
        <option value="反常识">反常识</option>
        <option value="学员故事">学员故事</option>
        <option value="身体感知">身体感知</option>
        <option value="追问式">追问式</option>
        <option value="画面描写">画面描写</option>
      </select>
    </div>

    <div class="post-list" id="postList"></div>
  </div>
</div>

<!-- ── CHANGE PASSWORD MODAL ── -->
<div class="modal-overlay" id="pwdModal">
  <div class="modal">
    <div class="modal-title">🔑 修改管理密码</div>
    <label class="modal-label">当前密码</label>
    <input class="modal-input" type="password" id="mOldPwd" placeholder="输入当前密码"/>
    <label class="modal-label">新密码</label>
    <input class="modal-input" type="password" id="mNewPwd" placeholder="输入新密码（至少6位）"/>
    <label class="modal-label">确认新密码</label>
    <input class="modal-input" type="password" id="mConfPwd" placeholder="再次输入新密码"/>
    <div class="modal-error" id="pwdModalError"></div>
    <div class="modal-actions">
      <button class="mbtn-secondary" onclick="closePwdModal()">取消</button>
      <button class="mbtn-primary" onclick="changePassword()">确认修改</button>
    </div>
  </div>
</div>

<!-- ── DELETE CONFIRM MODAL ── -->
<div class="modal-overlay" id="delModal">
  <div class="modal">
    <div class="modal-title">⚠ 确认删除</div>
    <p style="font-size:.82rem;line-height:1.8;color:#666;margin-bottom:20px;">
      删除后无法恢复，请确认是否要删除这条文案？
    </p>
    <div class="modal-actions">
      <button class="mbtn-secondary" onclick="closeDelModal()">取消</button>
      <button class="mbtn-primary" style="background:var(--danger);" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── JSONBin 配置（与 index.html 保持一致）──
const BIN_ID   = 'JSONBIN_BIN_ID';
const API_KEY  = 'JSONBIN_API_KEY';
const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

// ── 密码存储 key ──
const PWD_KEY  = 'ysqy_admin_pwd';
const DATA_KEY = 'ysqy_posts';
const DEFAULT_PWD = 'ysqy798';

// ── 状态 ──
let posts = [];
let deleteTargetIdx = -1;
let filterQ = '';
let filterA = '';
let isLoggedIn = false;

// ════════════════════════
//   AUTH

function getPwd() {
  return localStorage.getItem(PWD_KEY) || DEFAULT_PWD;
}

function doLogin() {
  const val = document.getElementById('pwdInput').value.trim();
  if (!val) { showLoginErr('请输入密码'); return; }
  if (val !== getPwd()) { showLoginErr('密码错误，请重试'); return; }
  isLoggedIn = true;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  loadData();
}

function doLogout() {
  isLoggedIn = false;
  document.getElementById('adminScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pwdInput').value = '';
  document.getElementById('loginError').textContent = '';
}

function showLoginErr(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  setTimeout(() => el.textContent = '', 3000);
}

// ── Change Password Modal ──
function showChangePwdModal() {
  document.getElementById('mOldPwd').value = '';
  document.getElementById('mNewPwd').value = '';
  document.getElementById('mConfPwd').value = '';
  document.getElementById('pwdModalError').textContent = '';
  document.getElementById('pwdModal').classList.add('open');
}
function closePwdModal() {
  document.getElementById('pwdModal').classList.remove('open');
}
function changePassword() {
  const old = document.getElementById('mOldPwd').value;
  const nw  = document.getElementById('mNewPwd').value;
  const cf  = document.getElementById('mConfPwd').value;
  const err = document.getElementById('pwdModalError');

  // 在登录界面用此功能时，跳过旧密码校验
  if (isLoggedIn && old !== getPwd()) {
    err.textContent = '当前密码不正确'; return;
  }
  if (!isLoggedIn && old !== getPwd()) {
    err.textContent = '当前密码不正确'; return;
  }
  if (nw.length < 6) { err.textContent = '新密码至少6位'; return; }
  if (nw !== cf) { err.textContent = '两次输入不一致'; return; }

  localStorage.setItem(PWD_KEY, nw);
  closePwdModal();
  toast('密码已修改 ✓');
}

async function loadData() {
  setStatus('loading', '加载中…');
  if (BIN_ID === 'JSONBIN_BIN_ID') {
    posts = JSON.parse(localStorage.getItem(DATA_KEY) || 'null') || DEFAULT_DATA;
    setStatus('ok', '本地模式（未配置云端）');
    renderList();
    return;
  }
  try {
    const res = await fetch(`${BASE_URL}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    posts = json.record.posts || DEFAULT_DATA;
    setStatus('ok', '已从云端加载');
  } catch(e) {
    posts = JSON.parse(localStorage.getItem(DATA_KEY) || 'null') || DEFAULT_DATA;
    setStatus('warn', '云端加载失败，显示本地缓存');
  }
  renderList();
}

async function saveAll() {
  // 本地存储（始终执行）
  localStorage.setItem(DATA_KEY, JSON.stringify(posts));
  // 触发 index.html 的 storage 事件同步
  window.dispatchEvent(new StorageEvent('storage', { key: DATA_KEY, newValue: JSON.stringify(posts) }));

  if (BIN_ID === 'JSONBIN_BIN_ID') {
    toast('已保存到本地 ✓（配置云端后可跨设备同步）');
    return;
  }
  showSaving(true);
  try {
    const res = await fetch(BASE_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY
      },
      body: JSON.stringify({ posts })
    });
    if (!res.ok) throw new Error(res.status);
    setStatus('ok', '已同步到云端 ' + new Date().toLocaleTimeString());
    toast('已保存并同步云端 ✓');
  } catch(e) {
    setStatus('warn', '云端保存失败，已保存本地');
    toast('本地已保存，云端同步失败');
  }
  showSaving(false);
}

// ════════════════════════
//   CRUD
// ════════════════════════
function addPost() {
  const no     = document.getElementById('fNo').value.trim();
  const angle  = document.getElementById('fAngle').value;
  const scheme = document.getElementById('fScheme').value;
  const struct = document.getElementById('fStruct').value.trim();
  const text   = document.getElementById('fText').value.trim();

  if (!no)   { toast('请填写编号'); return; }
  if (!text) { toast('请填写文案内容'); return; }

  posts.push({ no, angle, scheme, struct, text });
  saveAll();
  renderList();
  toast('文案已添加 ✓');

  // 清空表单
  document.getElementById('fNo').value = '';
  document.getElementById('fStruct').value = '';
  document.getElementById('fText').value = '';
}

function movePost(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= posts.length) return;
  [posts[idx], posts[newIdx]] = [posts[newIdx], posts[idx]];
  saveAll();
  renderList();
}

function openEdit(idx) {
  // 关闭其他编辑区
  document.querySelectorAll('.post-edit-area.open').forEach(el => el.classList.remove('open'));
  const area = document.getElementById(`edit-${idx}`);
  if (area) area.classList.add('open');
}

function cancelEdit(idx) {
  const area = document.getElementById(`edit-${idx}`);
  if (area) area.classList.remove('open');
}

function saveEdit(idx) {
  const no     = document.getElementById(`eno-${idx}`).value.trim();
  const angle  = document.getElementById(`eangle-${idx}`).value;
  const scheme = document.getElementById(`escheme-${idx}`).value;
  const struct = document.getElementById(`estruct-${idx}`).value.trim();
  const text   = document.getElementById(`etext-${idx}`).value.trim();

  if (!text) { toast('文案内容不能为空'); return; }
  posts[idx] = { no, angle, scheme, struct, text };
  saveAll();
  renderList();
  toast('已保存修改 ✓');
}

function promptDelete(idx) {
  deleteTargetIdx = idx;
  document.getElementById('delModal').classList.add('open');
}
function closeDelModal() {
  document.getElementById('delModal').classList.remove('open');
  deleteTargetIdx = -1;
}
function confirmDelete() {
  if (deleteTargetIdx < 0) return;
  posts.splice(deleteTargetIdx, 1);
  saveAll();
  renderList();
  closeDelModal();
  toast('已删除 ✓');
}

function getFilteredIndices() {
  return posts.map((p, i) => i).filter(i => {
    const p = posts[i];
    const matchQ = !filterQ || p.text.includes(filterQ) || p.angle.includes(filterQ);
    const matchA = !filterA || p.angle === filterA;
    return matchQ && matchA;
  });
}

function renderList() {
  const container = document.getElementById('postList');
  const badge = document.getElementById('listBadge');
  const countText = document.getElementById('countText');
  const indices = getFilteredIndices();

  badge.textContent = `共 ${posts.length} 条 / 显示 ${indices.length} 条`;
  countText.textContent = posts.length;

  if (!indices.length) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#bbb;font-size:.82rem;letter-spacing:.12em;">暂无匹配文案</div>';
    return;
  }

  container.innerHTML = indices.map(i => {
    const p = posts[i];
    const lines = p.text.split('\n').join('<br>');
    const isFirst = i === 0;
    const isLast  = i === posts.length - 1;
    return `
    <div class="post-item ${p.scheme}">
      <div class="post-stripe"></div>
      <div class="post-head">
        <div class="post-meta">
          <span class="post-no">${p.no}</span>
          <span class="post-angle-badge">${p.angle}</span>
          <span class="post-struct-text">${p.struct||''}</span>
        </div>
        <div class="post-actions">
          <button class="pbtn pbtn-up" onclick="movePost(${i},-1)" ${isFirst?'disabled':''} title="上移">↑</button>
          <button class="pbtn pbtn-dn" onclick="movePost(${i},1)"  ${isLast ?'disabled':''} title="下移">↓</button>
          <button class="pbtn" onclick="openEdit(${i})">编辑</button>
          <button class="pbtn pbtn-del" onclick="promptDelete(${i})">删除</button>
        </div>
      </div>
      <div class="post-body">${lines}</div>
      <div class="post-edit-area" id="edit-${i}">
        <div class="edit-grid">
          <div class="form-group">
            <label class="form-label">编号</label>
            <input class="form-input" id="eno-${i}" value="${escHtml(p.no)}"/>
          </div>
          <div class="form-group">
            <label class="form-label">角度</label>
            <select class="form-select" id="eangle-${i}">
              ${['数字冲击','旁观者视角','预言式','对话还原','时间轴','选择题','内幕揭秘','反常识','学员故事','身体感知','追问式','画面描写']
                .map(a=>`<option value="${a}" ${a===p.angle?'selected':''}>${a}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">颜色</label>
            <select class="form-select" id="escheme-${i}">
              ${[['s-gold','金色'],['s-rust','锈红'],['s-sage','松绿'],['s-steel','钢蓝'],['s-rose','玫红'],['s-char','炭灰']]
                .map(([v,l])=>`<option value="${v}" ${v===p.scheme?'selected':''}>${l}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:10px;">
          <label class="form-label">结构说明</label>
          <input class="form-input" id="estruct-${i}" value="${escHtml(p.struct||'')}"/>
        </div>
        <textarea class="edit-textarea" id="etext-${i}">${escHtml(p.text)}</textarea>
        <div class="edit-actions">
          <button class="btn-cancel-edit" onclick="cancelEdit(${i})">取消</button>
          <button class="btn-save" onclick="saveEdit(${i})">保存修改</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterList(v) { filterQ = v.trim(); renderList(); }
function filterAngle(v) { filterA = v; renderList(); }

// ════════════════════════
//   UI HELPERS
// ════════════════════════
function setStatus(type, msg) {
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className  = 'status-dot ' + (type==='ok'?'dot-green':type==='warn'?'dot-yellow':'dot-red');
  text.textContent = msg;
}
function showSaving(on) {
  document.getElementById('savingBadge').style.display = on ? 'inline' : 'none';
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2200);
}
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
