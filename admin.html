<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易饰乾园 · 后台管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap');

:root {
  --bg: #F7F5F0;
  --card: #FFFFFF;
  --ink: #1D1D1F;
  --gold: #C66A4E;
  --mist: #E5E0D8;
  --danger: #c0392b;
}

* {margin:0;padding:0;box-sizing:border-box;}
body {
  background: var(--bg);
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--ink);
  min-height: 100vh;
}

/* LOGIN */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ink);
}
.login-box {
  background: white;
  padding: 60px 50px;
  border-radius: 20px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.1);
}
.login-logo {
  font-family: 'Noto Serif SC', serif;
  font-size: 2rem;
  margin-bottom: 10px;
}
.login-input {
  width: 100%;
  padding: 16px;
  margin: 20px 0;
  border: 1px solid var(--mist);
  border-radius: 12px;
  font-size: 1.1rem;
}
.login-btn {
  width: 100%;
  padding: 16px;
  background: var(--ink);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1.1rem;
  cursor: pointer;
}

/* ADMIN */
#adminScreen { display: none; }

.admin-header {
  background: var(--ink);
  color: white;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.admin-main {
  max-width: 1200px;
  margin: 30px auto;
  padding: 0 30px;
}

/* Tab */
.admin-tabs {
  display: flex;
  gap: 30px;
  margin-bottom: 30px;
  border-bottom: 1px solid var(--mist);
}
.admin-tab {
  padding: 12px 0;
  cursor: pointer;
  font-size: 1.1rem;
}
.admin-tab.active {
  color: var(--gold);
  border-bottom: 3px solid var(--gold);
}

/* Form & Card */
.add-card, .manage-card {
  background: var(--card);
  border: 1px solid var(--mist);
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 30px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--mist);
  border-radius: 12px;
  margin-top: 8px;
}

.btn {
  padding: 14px 28px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 1rem;
}
.btn-primary { background: var(--ink); color: white; }
.btn-danger { background: var(--danger); color: white; }

/* Post List */
.post-item {
  background: white;
  border: 1px solid var(--mist);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}

.tag-manager {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 15px 0;
}
.tag-item {
  background: #f0e9e0;
  padding: 8px 16px;
  border-radius: 30px;
  display: flex;
  align-items: center;
  gap: 8px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">易饰乾园 · 后台</div>
    <p style="margin:20px 0 30px;color:#666;">文案资产管理系统</p>
    <input type="password" id="pwdInput" class="login-input" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" onclick="doLogin()">进入后台</button>
    <div id="loginError" style="color:#c0392b;margin-top:15px;"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminScreen">
  <div class="admin-header">
    <div>易饰乾园 · 文案后台管理</div>
    <div>
      <button onclick="window.location.href='index.html'" style="margin-right:12px;padding:8px 16px;background:#555;color:white;border:none;border-radius:8px;cursor:pointer;">← 返回前台</button>
      <button onclick="saveAll()" class="btn btn-primary">💾 保存同步</button>
    </div>
  </div>

  <div class="admin-main">
    <div class="admin-tabs">
      <div class="admin-tab active" onclick="switchTab(0)">新增文案</div>
      <div class="admin-tab" onclick="switchTab(1)">文案列表</div>
      <div class="admin-tab" onclick="switchTab(2)">模块 & 角度管理</div>
    </div>

    <!-- Tab 1: 新增 -->
    <div id="tab0">
      <div class="add-card">
        <h2>发布新文案</h2><br>
        <select id="new-module" class="form-select" style="margin-bottom:15px;"></select>
        <select id="new-angle" class="form-select" style="margin-bottom:15px;"></select>
        <textarea id="new-text" class="form-textarea" placeholder="输入文案内容..."></textarea>
        <button onclick="addNewPost()" class="btn btn-primary" style="width:100%;margin-top:15px;">立即发布</button>
      </div>
    </div>

    <!-- Tab 2: 列表 -->
    <div id="tab1" style="display:none;">
      <input type="text" id="searchInput" placeholder="搜索文案..." style="width:100%;padding:14px;margin-bottom:20px;border:1px solid var(--mist);border-radius:12px;" onkeyup="filterPosts()">
      <div id="postList"></div>
    </div>

    <!-- Tab 3: 分类管理 -->
    <div id="tab2" style="display:none;">
      <div class="manage-card">
        <h3>角度管理</h3>
        <div class="tag-manager" id="angle-manager"></div>
        <div style="display:flex;gap:10px;">
          <input type="text" id="add-angle" placeholder="新增角度" class="form-input">
          <button onclick="addAngle()" class="btn btn-primary">添加</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 配置 ====================
const DEFAULT_PWD = 'ysqy798';

let posts = [];
let angles = ["数字冲击", "旁观者视角", "预言式", "对话还原", "时间轴", "选择题", "内幕揭秘", "反常识", "学员故事", "身体感知", "追问式", "画面描写"];
let currentTab = 0;

// ==================== 登录 ====================
function doLogin() {
  if (document.getElementById('pwdInput').value === DEFAULT_PWD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginError').textContent = '密码错误';
  }
}

// ==================== 数据 ====================
function loadData() {
  posts = JSON.parse(localStorage.getItem('ysqy_posts') || '[]');
  renderAll();
}

function saveAll() {
  localStorage.setItem('ysqy_posts', JSON.stringify(posts));
  alert('✅ 已保存');
  renderAll();
}

function renderAll() {
  renderModuleAndAngleSelect();
  renderPosts();
  renderAngleManager();
}

function renderModuleAndAngleSelect() {
  // 角度选择
  let html = angles.map(a => `<option value="${a}">${a}</option>`).join('');
  document.getElementById('new-angle').innerHTML = html;
}

function addNewPost() {
  const text = document.getElementById('new-text').value.trim();
  if (!text) return alert("请输入文案");

  posts.unshift({
    no: String(posts.length + 1).padStart(2, '0'),
    angle: document.getElementById('new-angle').value,
    text: text
  });
  saveAll();
  document.getElementById('new-text').value = '';
}

function renderPosts() {
  const container = document.getElementById('postList');
  container.innerHTML = posts.map((p, i) => `
    <div class="post-item">
      <strong>#${p.no} ${p.angle}</strong>
      <p style="margin:12px 0;white-space:pre-wrap;line-height:1.8;">${p.text}</p>
      <button onclick="deletePost(${i})" class="btn btn-danger">删除</button>
    </div>
  `).join('');
}

function deletePost(i) {
  if (confirm('确定删除？')) {
    posts.splice(i, 1);
    saveAll();
  }
}

function addAngle() {
  const val = document.getElementById('add-angle').value.trim();
  if (val) {
    angles.push(val);
    document.getElementById('add-angle').value = '';
    renderAll();
  }
}

function renderAngleManager() {
  document.getElementById('angle-manager').innerHTML = angles.map((a,i) => `
    <div class="tag-item">${a} <span onclick="removeAngle(${i})" style="color:red;cursor:pointer;">×</span></div>
  `).join('');
}

function removeAngle(i) {
  if (confirm('确定删除此角度？')) {
    angles.splice(i,1);
    renderAll();
  }
}

function filterPosts() {
  // 简单实现，可后续增强
  renderPosts();
}

function switchTab(n) {
  currentTab = n;
  document.querySelectorAll('.admin-tab').forEach((el,i) => el.classList.toggle('active', i===n));
  document.getElementById('tab0').style.display = n===0 ? 'block' : 'none';
  document.getElementById('tab1').style.display = n===1 ? 'block' : 'none';
  document.getElementById('tab2').style.display = n===2 ? 'block' : 'none';
}

window.onload = () => {};
</script>
</body>
</html>
